          in: query
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Indicateurs par banque
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IndicateursPlateforme' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/facturation-sms:
    get:
      tags: [Plateforme]
      operationId: lireFacturationSms
      summary: SMS et segments envoyés par banque sur un mois (refacturation)
      description: |
        Mois civil en temps universel. `sms` et `segments` : SMS remis à la passerelle pendant le mois
        (facturés, même si l'opérateur ne les remet pas) ; `remis` (étape 22) : ceux que l'accusé de remise
        dit arrivés au téléphone ; `echecs` : SMS créés pendant le mois et non remis (refusés par la
        passerelle, abandonnés après 5 tentatives, ou non remis selon l'accusé). Toutes les banques
        existant à la fin du mois figurent, même sans SMS.
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - name: mois
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', examples: ['2026-09'] }
      responses:
        '200':
          description: Consommation SMS
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacturationSms' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/banques/{id}/canaux/{canal}:
    put:
      tags: [Plateforme]
      operationId: raccorderCanal
      summary: Raccorder le numéro WhatsApp ou SMS d'une banque (étape 20)
      description: |
        WhatsApp : le numéro de la banque, son identifiant chez Meta (`identifiant`, phone_number_id), son
        compte WhatsApp Business (`compte`, WABA) et le jeton d'accès obtenu à l'inscription intégrée de
        Meta. Le jeton est chiffré et ne se relit plus ; à une modification, l'omettre garde l'actuel.
        SMS : le numéro de réception de la banque chez la passerelle de Makor. Le premier raccordement
        crée le point de dépôt du canal. Un numéro ou un identifiant déjà raccordé à une autre banque :
        409 `NUMERO_DEJA_UTILISE`. Le canal s'ouvre ensuite à la banque par `modifierBanque`
        (`whatsapp`, `smsEntrant`).
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - name: canal
          in: path
          required: true
          schema: { type: string, enum: [WHATSAPP, SMS] }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RaccordementCanal' }
      responses:
        '200': { $ref: '#/components/responses/UneBanque' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /plateforme/facturation-canaux:
    get:
      tags: [Plateforme]
      operationId: lireFacturationCanaux
      summary: Messages WhatsApp et SMS reçus par banque sur un mois (refacturation, étape 20)
      description: |
        Mois civil en temps universel. `whatsappEnvoyes` : messages remis à Meta pendant le mois ;
        `whatsappFactures` : ceux que Meta a déclarés facturables, au-delà de ses gratuités (tarif du pays
        du client) ; `whatsappEchecs` : messages abandonnés ; `whatsappRecus`, `smsRecus` : messages des
        clients. Des totaux seulement, jamais un numéro ni un texte. Les SMS envoyés restent dans
        `lireFacturationSms`. Figurent les banques existant à la fin du mois.
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - name: mois
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
      responses:
        '200':
          description: Consommation WhatsApp et SMS entrants
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FacturationCanaux' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /webhooks/whatsapp:
    get:
      tags: [Canaux]
      operationId: verifierWebhookWhatsapp
      summary: Vérification de l'adresse du webhook par Meta
      description: |
        Appelée par Meta une fois, quand Makor abonne son application : renvoie `hub.challenge` si
        `hub.verify_token` est le jeton de la configuration (WHATSAPP_JETON_VERIFICATION) ; sinon 403.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: hub.mode
          in: query
          required: true
          schema: { type: string, enum: [subscribe] }
        - name: hub.verify_token
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
        - name: hub.challenge
          in: query
          required: true
          schema: { type: string, maxLength: 200 }
      responses:
        '200':
          description: Le défi, tel quel
          content:
            text/plain:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
    post:
      tags: [Canaux]
      operationId: recevoirWebhookWhatsapp
      summary: Messages des clients et statuts des envois, transmis par Meta
      description: |
        Corps signé par Meta : `X-Hub-Signature-256` est le HMAC-SHA256 du corps avec le secret de
        l'application de Makor (WHATSAPP_SECRET_APP) ; absent ou faux, 401 `SIGNATURE_INVALIDE`, rien
        n'est lu. Chaque message n'est traité qu'une fois (Meta réessaie jusqu'à 7 jours). Un numéro
        raccordé à aucune banque, ou une banque qui n'a pas le canal ouvert : ignoré, 200. Une erreur
        interne répond 500 : Meta réessaie, sans doublon.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: X-Hub-Signature-256
          in: header
          required: false
          description: "sha256=<HMAC-SHA256 hexadécimal> ; absente ou fausse : 401 SIGNATURE_INVALIDE"
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WebhookWhatsapp' }
      responses:
        '200': { $ref: '#/components/responses/Recu' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /webhooks/sms:
    post:
      tags: [Canaux]
      operationId: recevoirSmsEntrant
      summary: SMS d'un client, transmis par la passerelle de Makor
      description: |
        Interface proposée à la passerelle de Makor (à confirmer avec son équipe) : un appel par SMS reçu,
        `X-Signature` étant le HMAC-SHA256 du corps avec le secret partagé (SMS_ENTRANT_SECRET) ; absent ou
        faux, 401 `SIGNATURE_INVALIDE`. `vers` est le numéro de la banque, `de` celui du client. Un même
        `id` n'est traité qu'une fois. Un numéro raccordé à aucune banque : ignoré, 200.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: false
          description: "sha256=<HMAC-SHA256 hexadécimal> ; absente ou fausse : 401 SIGNATURE_INVALIDE"
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SmsEntrant' }
      responses:
        '200': { $ref: '#/components/responses/Recu' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /webhooks/sms/remise:
    post:
      tags: [Canaux]
      operationId: recevoirRemiseSms
      summary: Accusé de remise d'un SMS envoyé, transmis par la passerelle de Makor (étape 22)
      description: |
        Interface proposée à la passerelle (à confirmer avec son équipe), signée comme les SMS reçus
        (`X-Signature`, HMAC-SHA256 du corps avec SMS_ENTRANT_SECRET ; absente ou fausse : 401). Le SMS est
        retrouvé par `reference` (l'identifiant envoyé avec le SMS) ou par `id` (celui rendu par la
        passerelle). REMIS : remis au téléphone ; NON_REMIS, EXPIRE (téléphone éteint trop longtemps) et
        REJETE (refusé par l'opérateur) : non remis, l'agent est prévenu. EN_COURS est ignoré. Un SMS
        inconnu, ou déjà remis ou non remis, est ignoré : 200.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: X-Signature
          in: header
          required: false
          description: "sha256=<HMAC-SHA256 hexadécimal> ; absente ou fausse : 401 SIGNATURE_INVALIDE"
          schema: { type: string, maxLength: 200 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RemiseSms' }
      responses:
        '200': { $ref: '#/components/responses/Recu' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /plateforme/consommation-ia:
    get:
      tags: [Plateforme]
      operationId: lireConsommationIa
      summary: Usage de l'assistant IA par banque sur un mois (facturation)
      description: |
        Mois civil en temps universel, d'après le journal des appels, qui ne contient aucun message
        (décision I5). `tours` : tours de l'assistant du portail ; `suggestions` : brouillons demandés
        par les agents ; `parIa` : réponses venues du fournisseur ; `regles` : réponses venues des règles
        (pas de fournisseur, plafond atteint, erreur ou délai dépassé). Le coût est celui du tarif
        configuré au moment de chaque appel. Figurent les banques existant à la fin du mois et celles qui ont des appels ce mois-là.
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - name: mois
          in: query
          required: true
          schema: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', examples: ['2026-10'] }
      responses:
        '200':
          description: Consommation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsommationIa' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/journal-audit:
    get:
      tags: [Plateforme]
      operationId: listerJournalPlateforme
      summary: Journal d'audit de toutes les banques et de la plateforme
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - name: banqueId
          in: query
          description: Absent = toutes les chaînes ; `plateforme` = la chaîne de la plateforme
          schema: { type: string, maxLength: 36 }
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/FiltreAction'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Lignes, les plus récentes d'abord
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageAudit' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/journal-audit/verification:
    get:
      tags: [Plateforme]
      operationId: verifierJournalPlateforme
      summary: Vérifier l'intégrité d'une chaîne d'audit
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - name: chaine
          in: query
          required: true
          description: '`plateforme` ou `banque:<uuid>`'
          schema: { type: string, maxLength: 48 }
      responses:
        '200': { $ref: '#/components/responses/Verification' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/notifications:
    get:
      tags: [Plateforme]
      operationId: listerNotificationsPlateforme
      summary: Alertes urgentes et dépassements de plafond (métadonnées)
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/NonLues'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Notifications
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageNotifications' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /plateforme/notifications/{id}/lecture:
    post:
      tags: [Plateforme]
      operationId: marquerNotificationPlateformeLue
      summary: Marquer une alerte comme lue
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Lue
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /plateforme/administrateurs:
    get:
      tags: [Plateforme]
      operationId: listerSuperAdmins
      summary: Comptes Super Admin
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '200':
          description: Super Admins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Utilisateur' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
    post:
      tags: [Plateforme]
      operationId: inviterSuperAdmin
      summary: Inviter un Super Admin
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentitePersonne' }
      responses:
        '201': { $ref: '#/components/responses/UnUtilisateur' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }

components:
  securitySchemes:
    jetonPersonnel:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès du personnel (15 minutes), obtenu après le mot de passe, et le code TOTP quand la double authentification est exigée ou activée.
    jetonClient:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session client (30 minutes) obtenue avec le code OTP ; limitée à ce client et à sa banque.
    cookieRafraichissement:
      type: apiKey
      in: cookie
      name: rt
      description: Refresh token (httpOnly, Secure, SameSite=Strict), remplacé à chaque usage.

  # ---------------------------------------------------------------------------
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    Mois:
      name: mois
      in: path
      required: true
      description: Mois civil, dans le fuseau de la banque
      schema: { $ref: '#/components/schemas/MoisCivil' }
    PieceId:
      name: pieceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    EnvoiId:
      name: envoiId
      in: path
      required: true
      description: Un message au client (fiche, champ envois)
      schema: { type: string, format: uuid }
    Slug:
      name: slug
      in: path
      required: true
      description: Adresse du portail de la banque (`<slug>.<domaine>`)
      schema: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', examples: ['alpha'] }
    CodePoint:
      name: code
      in: path
      required: true
      description: Code public du point de dépôt, porté par le QR code ou le lien
      schema: { type: string, pattern: '^[A-Z0-9]{6,16}$', examples: ['7K3QX9P2MA'] }
    JetonSuivi:
      name: jetonSuivi
      in: path
      required: true
      description: Jeton du lien de suivi reçu au dépôt
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clé choisie par le navigateur (UUID conseillé) ; conservée 24 h
      schema: { type: string, minLength: 8, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ParPage:
      name: parPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Du:
      name: du
      in: query
      description: Début de période (inclus), date de dépôt
      schema: { type: string, format: date-time }
    Au:
      name: au
      in: query
      description: Fin de période (exclue), date de dépôt
      schema: { type: string, format: date-time }
    Recherche:
      name: recherche
      in: query
      description: Numéro de ticket, nom, e-mail ou téléphone
      schema: { type: string, minLength: 2, maxLength: 100 }
    File:
      name: file
      in: query
      description: |
        File de traitement (§6.2). `a-reassigner` (étape 21) : réclamations non clôturées d'un agent
        désactivé, ou absent aujourd'hui (attribution ouverte) ; vide pour un agent.
      schema:
        type: string
        enum: [toutes, recues, assignees, urgentes, en-retard, escaladees, a-reassigner]
        default: toutes
    FiltreStatut:
      name: statut
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/StatutReclamation' }
    FiltrePriorite:
      name: priorite
      in: query
      schema: { $ref: '#/components/schemas/Priorite' }
    FiltreCategorie:
      name: categorieId
      in: query
      schema: { type: string, format: uuid }
    FiltreAgence:
      name: agenceId
      in: query
      schema: { type: string, format: uuid }
    FiltreCanal:
      name: canal
      in: query
      schema: { $ref: '#/components/schemas/CanalDepot' }
    FiltreAgent:
      name: agentId
      in: query
      schema: { type: string, format: uuid }
    FiltreAction:
      name: action
      in: query
      description: Préfixe d'action, ex. `reclamation.` ou `auth.connexion`
      schema: { type: string, maxLength: 80 }
    TriReclamations:
      name: tri
      in: query
      schema:
        type: string
        enum: [-creeLe, creeLe, echeanceSlaLe, -echeanceSlaLe, -priorite]
        default: -creeLe
    NonLues:
      name: nonLues
      in: query
      schema: { type: boolean, default: false }
    Apres:
      name: apres
      in: query
      description: Seulement les messages écrits à partir de cet instant (le `curseur` de la réponse précédente) ; un message déjà reçu peut revenir, à dédoublonner par `id`
      schema: { type: string, format: date-time }
    FiltreConversations:
      name: filtre
      in: query
      description: "a-repondre : le client a écrit en dernier ; non-lues : un message du client attend la lecture de la banque"
      schema: { type: string, enum: [a-repondre, non-lues, toutes], default: a-repondre }

  # ---------------------------------------------------------------------------
  responses:
    Invalide:
      description: Requête mal formée ou champ invalide (code VALIDATION, erreurs par champ)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    NonAuthentifie:
      description: Jeton absent, expiré ou invalide ; identifiants ou code incorrects
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Interdit:
      description: Rôle insuffisant, banque suspendue (code BANQUE_SUSPENDUE, pour toute opération du personnel de cette banque), ou fonction de la phase 2 que Makor n'a pas ouverte à la banque (code FONCTION_NON_OUVERTE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Introuvable:
      description: Introuvable — y compris une ressource d'une autre banque, ou un ticket non assigné à l'agent
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Conflit:
      description: Action impossible dans l'état actuel (transition interdite, doublon, clé d'idempotence réutilisée)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Recu:
      description: Reçu et traité (ou ignoré, pour un numéro inconnu)
      content:
        application/json:
          schema:
            type: object
            required: [recu]
            properties:
              recu: { type: boolean, const: true }
    RegleMetier:
      description: Donnée correcte en forme mais refusée par une règle métier
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Verrouille:
      description: Compte verrouillé temporairement après des échecs répétés
      headers:
        Retry-After:
          description: Secondes avant de réessayer
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TropDeRequetes:
      description: Limite de débit atteinte
      headers:
        Retry-After:
          description: Secondes avant de réessayer
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    FichierTropVolumineux:
      description: Fichier au-delà de 10 Mo (1 Mo pour un logo)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TypeNonSupporte:
      description: Type de fichier refusé (JPEG, PNG, WebP ou PDF attendus)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Fichier:
      description: Contenu du fichier
      headers:
        Content-Disposition:
          schema: { type: string, examples: ['attachment; filename="recu.pdf"'] }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Reclamation:
      description: Réclamation à jour
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReclamationDetail' }
    SessionOuverte:
      description: Session ouverte ; cookie `rt` posé
      headers:
        Set-Cookie:
          description: '`rt=<refresh token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`'
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionPersonnel' }
    Parametres:
      description: Paramètres de la banque
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParametresBanque' }
    Regles:
      description: Règles d'attribution et d'escalade
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReglesTraitement' }
    Horaires:
      description: Horaires ouvrés
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Horaires' }
    UnUtilisateur:
      description: Compte du personnel
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Utilisateur' }
    UneBanque:
      description: Banque
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BanquePlateforme' }
    Verification:
      description: Résultat de la vérification de la chaîne
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VerificationChaine' }

  # ---------------------------------------------------------------------------
  schemas:
    # ---- Énumérations (identiques au modèle de données) -----------------------
    StatutReclamation:
      type: string
      enum: [OUVERTE, EN_COURS, EN_ATTENTE_CLIENT, RESOLUE, CLOTUREE]
    Priorite:
      type: string
      enum: [NORMALE, URGENTE]
    CanalDepot:
      type: string
      description: "QR code en agence, lien web, numéro WhatsApp et SMS de la banque (étape 20), saisie par le personnel au guichet ou au téléphone (étape 21)"
      enum: [QR_CODE, LIEN_WEB, WHATSAPP, SMS, GUICHET, TELEPHONE]
    RoleUtilisateur:
      type: string
      enum: [SUPER_ADMIN, ADMIN_ENTREPRISE, SUPERVISEUR, AGENT]
    RoleBanque:
      type: string
      description: Rôles attribuables par l'Admin Entreprise
      enum: [ADMIN_ENTREPRISE, SUPERVISEUR, AGENT]
    StatutUtilisateur:
      type: string
      enum: [INVITE, ACTIF, DESACTIVE]
    TypeEvenement:
      type: string
      enum: [CREATION, PRISE_EN_CHARGE, QUESTION_AU_CLIENT, REPONSE_DU_CLIENT, RESOLUTION, CONFIRMATION, CONTESTATION,
        CLOTURE_AUTOMATIQUE, CLOTURE_FORCEE, ASSIGNATION, CHANGEMENT_PRIORITE, ESCALADE, ESCALADE_ADMIN,
        ALERTE_SLA_PREVENTIVE, DEPASSEMENT_SLA, MESSAGE, PIECE_JOINTE, RATTACHEMENT]
    ModeCloture:
      type: string
      enum: [CONFIRMATION_CLIENT, AUTOMATIQUE, FORCEE]
    MotifClotureForcee:
      type: string
      enum: [DOUBLON, HORS_PERIMETRE, ABUS, AUTRE]
    TypeCommentaire:
      type: string
      enum: [NOTE_INTERNE, REPONSE_AU_CLIENT, MESSAGE_DU_CLIENT]
    TypeActeur:
      type: string
      enum: [CLIENT, UTILISATEUR, SYSTEME]
    CanalOtp:
      type: string
      enum: [EMAIL, SMS]
    ActionStatut:
      type: string
      description: Actions de la machine d'états (étape 4)
      enum: [PRENDRE_EN_CHARGE, QUESTIONNER_CLIENT, REPRENDRE_SUR_REPONSE, RESOUDRE, CONFIRMER, CONTESTER,
        CLOTURER_AUTOMATIQUEMENT, CLOTURER_DE_FORCE, RATTACHER]
    OperationTicket:
      type: string
      description: Opérations sans changement de statut (étape 4)
      enum: [CONSULTER, ASSIGNER, CHANGER_PRIORITE, ESCALADER, NOTE_INTERNE, REPONDRE_AU_CLIENT, MESSAGE_DU_CLIENT, RENVOYER_LIEN]
    EtatChrono:
      type: string
      description: |
        État du chrono SLA, calculé par l'API à la lecture (étape 6) :
        DANS_LES_DELAIS, ALERTE (seuil d'alerte de la banque franchi), DEPASSE (échéance passée),
        EN_PAUSE (en attente du client), ARRETE (réclamation résolue ou clôturée).
      enum: [DANS_LES_DELAIS, ALERTE, DEPASSE, EN_PAUSE, ARRETE]
    CodeErreur:
      type: string
      description: Code stable d'une erreur, à utiliser par les interfaces (le titre peut changer)
      enum:
        # Requête et accès
        - VALIDATION
        - NON_AUTHENTIFIE
        - JETON_INVALIDE
        - INTERDIT
        - INTROUVABLE
        - TROP_DE_REQUETES
        - CONFLIT_IDEMPOTENCE
        # Authentification
        - IDENTIFIANTS_INVALIDES
        - COMPTE_VERROUILLE
        - CODE_TOTP_INVALIDE
        - MOT_DE_PASSE_TROP_FAIBLE
        - CODE_OTP_INVALIDE
        - CODE_OTP_EXPIRE
        - TROP_DE_TENTATIVES
        # Machine d'états (étape 4)
        - TRANSITION_INTERDITE
        - ACTEUR_NON_AUTORISE
        - AUCUN_AGENT_ASSIGNE
        - DELAI_DE_CONTESTATION_DEPASSE
        - CLOTURE_AUTOMATIQUE_PREMATUREE
        # Dépôt et messages
        - BANQUE_SUSPENDUE
        - POINT_DE_DEPOT_INACTIF
        - CATEGORIE_INVALIDE
        - CONTACT_REQUIS
        - CONTACT_INVALIDE
        - DESCRIPTION_REQUISE
        - CONSENTEMENT_REQUIS
        - ANTI_ROBOT_REFUSE
        - MESSAGE_VIDE
        - PRECISION_REQUISE
        - AGENT_INVALIDE
        # Fichiers
        - FICHIER_TROP_VOLUMINEUX
        - TYPE_DE_FICHIER_NON_SUPPORTE
        - TROP_DE_FICHIERS
        # Paramétrage et plateforme
        - PLAFOND_AGENTS_ATTEINT
        - EMAIL_DEJA_UTILISE
        - NOM_DEJA_UTILISE
        - CODE_DEJA_UTILISE
        - PREFIXE_DEJA_UTILISE
        - SLUG_DEJA_UTILISE
        - QR_CODE_SANS_AGENCE
        - SUPERVISEUR_INVALIDE
        - INVITATION_DEJA_ACCEPTEE
        - JOUR_FERIE_EXISTANT
        # Reporting (étape 9)
        - EXPORT_TROP_VOLUMINEUX
        # Enquêtes de satisfaction (étape 15)
        - AVIS_DEJA_DONNE
        - ENQUETE_TERMINEE
        # Attribution et escalade (étape 16)
        - FONCTION_NON_OUVERTE
        - GROUPE_INVALIDE
        - ABSENCE_INVALIDE
        # Assistant IA (étape 18)
        - CHAT_WEB_REQUIS
        - RECLAMATION_CLOTUREE
        # Double authentification au choix de la banque (étape 19)
        - DOUBLE_AUTHENTIFICATION_OBLIGATOIRE
        - DOUBLE_AUTHENTIFICATION_A_ACTIVER
        - DOUBLE_AUTHENTIFICATION_DEJA_ACTIVE
        - DOUBLE_AUTHENTIFICATION_INACTIVE
        - DOUBLE_AUTHENTIFICATION_NON_PREPAREE
        # Étape 20 : WhatsApp et SMS entrant
        - SIGNATURE_INVALIDE
        - NUMERO_DEJA_UTILISE
        - CANAL_NON_RACCORDE
        # Étape 21 : doublons
        - RATTACHEMENT_IMPOSSIBLE
        # Étape 22 : pièces jointes analysées, envois au client
        - FICHIER_INFECTE
        - FICHIER_EN_ANALYSE
        - FICHIER_SUPPRIME
        - MESSAGE_NON_RENVOYABLE
        # Serveur
        - ERREUR_INTERNE

    # ---- Communs -----------------------------------------------------------------
    Probleme:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: ['/erreurs/transition-interdite'] }
        title: { type: string, examples: ['Action impossible dans le statut actuel'] }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, examples: ['RESOUDRE est impossible depuis le statut OUVERTE'] }
        instance: { type: string, examples: ['/api/v1/banque/reclamations/0199.../resolution'] }
        code: { $ref: '#/components/schemas/CodeErreur' }
        erreurs:
          type: array
          description: Détail par champ (code VALIDATION)
          items: { $ref: '#/components/schemas/ErreurChamp' }
    ErreurChamp:
      type: object
      required: [champ, message]
      properties:
        champ: { type: string, examples: ['telephone'] }
        message: { type: string, examples: ['Numéro de téléphone invalide'] }
    Pagination:
      type: object
      required: [page, parPage, total]
      properties:
        page: { type: integer, minimum: 1 }
        parPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ReferenceNommee:
      type: object
      required: [id, nom]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
    Sante:
      type: object
      required: [statut, base, redis, worker, envois, disque, antivirus, version]
      properties:
        statut:
          type: string
          enum: [ok, degrade]
          description: ok si toutes les autres valeurs sont ok
        base: { type: string, enum: [ok, indisponible] }
        redis: { type: string, enum: [ok, indisponible] }
        worker:
          type: string
          enum: [ok, absent, inconnu]
          description: absent si le worker n'a terminé aucun travail depuis 2 minutes ; inconnu si Redis ne répond pas
        envois:
          type: string
          enum: [ok, en_retard, inconnu]
          description: en_retard si un e-mail ou un SMS attend depuis plus de 10 minutes (worker, SMTP ou passerelle SMS en panne)
        disque:
          type: string
          enum: [ok, presque_plein, inconnu]
          description: espace libre du volume des pièces jointes (moins de 5 % ou de 2 Gio → presque_plein)
        antivirus:
          type: string
          enum: [ok, indisponible, desactive]
          description: "Étape 22 : ClamAV répond (ok) ; desactive en développement seulement (ANTIVIRUS=aucun)"
        version:
          type: string
          description: étiquette de l'image déployée (VERSION de .env.production)
          examples: ['1.0.0']
    Horodatage:
      type: string
      format: date-time
      examples: ['2026-09-25T10:00:00Z']
    HorodatageFacultatif:
      type: [string, 'null']
      format: date-time
    Couleur:
      type: [string, 'null']
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#0B5FFF']
    PieceJointe:
      type: object
      required: [id, nomFichier, typeMime, tailleOctets, creeLe, antivirus]
      properties:
        id: { type: string, format: uuid }
        nomFichier: { type: string, examples: ['releve.pdf'] }
        typeMime: { type: string, examples: ['application/pdf'] }
        tailleOctets: { type: integer, minimum: 1 }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        antivirus: { $ref: '#/components/schemas/EtatAntivirus' }
    EtatAntivirus:
      type: string
      description: |
        Étape 22 : analyse antivirus (ClamAV). SAIN : téléchargeable. EN_ATTENTE : l'antivirus ne répondait
        pas au dépôt, le fichier sera analysé sous peu (téléchargement refusé, 409 FICHIER_EN_ANALYSE).
        INFECTE : un virus a été trouvé après coup, le fichier est effacé (409 FICHIER_SUPPRIME).
      enum: [EN_ATTENTE, SAIN, INFECTE]
    Fichiers:
      type: array
      description: |
        5 fichiers au plus, 10 Mo chacun : JPEG, PNG, WebP, PDF ou Word (.docx sans macro), reconnus au
        contenu. Chaque fichier est analysé par l'antivirus : infecté, il est refusé (422 FICHIER_INFECTE).
      maxItems: 5
      items: { type: string, format: binary }

    # ---- Public : dépôt et suivi -----------------------------------------------------
    BanquePublique:
      type: object
      required: [nom, slug, logoUrl, couleurPrimaire, couleurSecondaire, whatsapp]
      properties:
        whatsapp:
          description: "Numéro WhatsApp de la banque, quand le canal est ouvert (étape 20) : le portail propose d'y écrire"
          type: [string, 'null']
        nom: { type: string, examples: ['Banque Alpha'] }
        slug: { type: string, examples: ['alpha'] }
        logoUrl: { type: [string, 'null'], format: uri-reference }
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
    FormulaireDepot:
      type: object
      required: [banque, canal, agence, agences, categories, politiqueDonnees, fichiers, assistant]
      properties:
        assistant: { type: boolean, description: "Assistant automatique ouvert sur ce portail (étape 18)" }
        banque: { $ref: '#/components/schemas/BanquePublique' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        agence:
          description: Agence du QR code ; vide pour un lien web
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agences:
          type: array
          description: Agences proposées au client quand le point n'en a pas (choix facultatif)
          items: { $ref: '#/components/schemas/ReferenceNommee' }
        categories:
          type: array
          items:
            type: object
            required: [id, nom, description]
            properties:
              id: { type: string, format: uuid }
              nom: { type: string, examples: ['Carte bancaire'] }
              description: { type: [string, 'null'] }
        politiqueDonnees:
          type: object
          required: [version, url]
          properties:
            version: { type: string, examples: ['2026-09'] }
            url: { type: string, format: uri-reference }
        fichiers:
          type: object
          required: [maxFichiers, maxOctets, types]
          properties:
            maxFichiers: { type: integer, const: 5 }
            maxOctets: { type: integer, examples: [10485760] }
            types:
              type: array
              items: { type: string }
              examples: [['image/jpeg', 'image/png', 'image/webp', 'application/pdf', 'application/vnd.openxmlformats-officedocument.wordprocessingml.document']]
    DefiAntiRobot:
      type: object
      description: Défi de preuve de travail (étape 11), champs d'ALTCHA en français
      required: [algorithme, defi, sel, maximum, signature, expireLe]
      properties:
        algorithme: { type: string, const: SHA-256 }
        defi: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256(sel + nombre) en hexadécimal" }
        sel: { type: string, pattern: '^[0-9a-f]{24}\?expire=[0-9]{10}$', description: "Aléa et heure d'expiration (secondes Unix)", examples: ['9f86d081884c7d659a2feaa0?expire=1790000000'] }
        maximum: { type: integer, minimum: 1, description: "Le nombre cherché est entre 0 et maximum", examples: [100000] }
        signature: { type: string, pattern: '^[0-9a-f]{64}$', description: "HMAC-SHA-256 du défi par l'API" }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
    JetonAntiRobot:
      type: string
      minLength: 1
      maxLength: 1024
      description: |
        Défi résolu : JSON `{"sel", "nombre", "signature"}` encodé en base64url (lireDefiAntiRobot).
        À usage unique, valable jusqu'à l'expiration du défi.
      examples: ['eyJzZWwiOiI5Zjg2ZDA4MTg4NGM3ZDY1OWEyZmVhYTA_ZXhwaXJlPTE3OTAwMDAwMDAiLCJub21icmUiOjQyLCJzaWduYXR1cmUiOiIuLi4ifQ']
    DepotReclamation:
      type: object
      description: Un e-mail ou un téléphone au moins (arbitrage 1)
      required: [categorieId, description, nom, consentement, versionPolitique, jetonAntiRobot]
      anyOf:
        - required: [email]
        - required: [telephone]
      properties:
        categorieId: { type: string, format: uuid }
        agenceId: { type: string, format: uuid, description: "Seulement si le point de dépôt n'a pas d'agence" }
        description: { type: string, minLength: 1, maxLength: 5000 }
        nom: { type: string, minLength: 2, maxLength: 160, examples: ['Yao Kouassi'] }
        email: { type: string, format: email, maxLength: 254 }
        telephone: { type: string, maxLength: 25, description: "Format libre, normalisé en E.164 (+225 par défaut)", examples: ['07 08 09 10 11'] }
        consentement: { type: boolean, const: true, description: "Acceptation de la politique de données (ARTCI)" }
        versionPolitique: { type: string, maxLength: 20, examples: ['2026-09'] }
        jetonAntiRobot: { $ref: '#/components/schemas/JetonAntiRobot' }
        fichiers: { $ref: '#/components/schemas/Fichiers' }
        viaAssistant: { type: boolean, description: "Préparée avec l'assistant du portail (étape 18) : noté dans la chronologie" }
        categorieProposeeId: { type: string, format: uuid, description: "Catégorie proposée par l'assistant, que le client a pu changer" }
    AccuseDepot:
      type: object
      required: [numero, lienSuivi, jetonSuivi]
      properties:
        numero: { type: string, pattern: '^[A-Z0-9]{2,10}-[0-9]{4}-[0-9]{6}$', examples: ['ALP-2026-000042'] }
        lienSuivi: { type: string, format: uri, examples: ['https://alpha.reclamations.example/suivi/Qm9uam91ckJhbnF1ZUFscGhh'] }
        jetonSuivi: { type: string }
    EtapeSuivi:
      type: object
      required: [type, statut, date]
      properties:
        type: { $ref: '#/components/schemas/TypeEvenement' }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        date: { $ref: '#/components/schemas/Horodatage' }
    SuiviPublic:
      type: object
      description: Chronologie seule — ni description, ni messages, ni coordonnées
      required: [numero, statut, categorie, creeLe, banque, etapes, avis, rattacheeA]
      properties:
        rattacheeA:
          description: "Étape 21 : doublon joint à la réclamation principale du même client, à suivre à cette adresse du portail"
          oneOf:
            - $ref: '#/components/schemas/RattacheeA'
            - type: 'null'
        avis:
          description: Enquête de satisfaction de la réclamation clôturée (étape 15) ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisResume'
            - type: 'null'
        numero: { type: string, examples: ['ALP-2026-000042'] }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string, examples: ['Carte bancaire'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        banque: { $ref: '#/components/schemas/BanquePublique' }
        etapes:
          type: array
          items: { $ref: '#/components/schemas/EtapeSuivi' }
    EtatAvis:
      type: string
      description: "A_DONNER : enquête ouverte ; DONNE : réponse reçue ; TERMINE : 7 jours passés sans réponse"
      enum: [A_DONNER, DONNE, TERMINE]
    AvisResume:
      type: object
      required: [etat, expireLe]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
    ReponseAvis:
      type: object
      description: Réponse du client à l'enquête (étape 15)
      required: [note, recommandation]
      properties:
        note: { type: integer, minimum: 1, maximum: 5, description: "Satisfaction sur le traitement de la réclamation (CSAT), de 1 à 5" }
        recommandation: { type: integer, minimum: 0, maximum: 10, description: "Recommandation de la banque à un proche (NPS), de 0 à 10" }
        commentaire: { type: string, maxLength: 1000, description: "Facultatif" }
    Avis:
      type: object
      description: Enquête de satisfaction telle que la voit le client (étape 15)
      required: [numero, categorie, banque, etat, expireLe, reponse]
      properties:
        numero: { type: string, examples: ['ALP-2026-000042'] }
        categorie: { type: string, examples: ['Carte bancaire'] }
        banque: { $ref: '#/components/schemas/BanquePublique' }
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        reponse:
          oneOf:
            - $ref: '#/components/schemas/AvisDonne'
            - type: 'null'
    AvisDonne:
      type: object
      required: [note, recommandation, commentaire, reponduLe]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        recommandation: { type: integer, minimum: 0, maximum: 10 }
        commentaire: { type: [string, 'null'] }
        reponduLe: { $ref: '#/components/schemas/Horodatage' }
    DemandeOtp:
      type: object
      required: [jetonAntiRobot]
      properties:
        jetonAntiRobot: { $ref: '#/components/schemas/JetonAntiRobot' }
        canal:
          $ref: '#/components/schemas/CanalOtp'
          description: Par défaut le SMS si le client a un téléphone, sinon l'e-mail
    OtpEnvoye:
      type: object
      required: [canal, destinationMasquee, expireDans]
      properties:
        canal: { $ref: '#/components/schemas/CanalOtp' }
        destinationMasquee: { type: string, examples: ['+225 07 •• •• •• 11', 'y••••@exemple.ci'] }
        expireDans: { type: integer, description: "Secondes", examples: [600] }
    VerificationOtp:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    SessionClient:
      type: object
      required: [jetonClient, expireDans]
      properties:
        jetonClient: { type: string }
        expireDans: { type: integer, examples: [1800] }

    # ---- Espace client ------------------------------------------------------------------
    ReclamationClientResume:
      type: object
      required: [id, numero, statut, categorie, creeLe]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
    MessageVisible:
      type: object
      description: Réponse de la banque ou message du client (jamais une note interne)
      required: [id, type, contenu, auteur, creeLe, piecesJointes, canal]
      properties:
        canal:
          description: "Étape 20 : WhatsApp ou SMS si le message est passé par là"
          oneOf:
            - $ref: '#/components/schemas/CanalConversation'
            - type: 'null'
        id: { type: string, format: uuid }
        type: { type: string, enum: [REPONSE_AU_CLIENT, MESSAGE_DU_CLIENT] }
        contenu: { type: string }
        auteur: { type: string, enum: [BANQUE, CLIENT] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        piecesJointes:
          type: array
          items: { $ref: '#/components/schemas/PieceJointe' }
    ReclamationClient:
      type: object
      required: [id, numero, statut, categorie, description, creeLe, clotureAutoPrevueLe, messages, piecesJointes, etapes, actionsPossibles,
        operationsPossibles, avis, chat, rattacheeA]
      properties:
        rattacheeA:
          description: "Étape 21 : doublon joint à la réclamation principale"
          oneOf:
            - $ref: '#/components/schemas/RattacheeA'
            - type: 'null'
        chat:
          description: Chat web (étape 17) ; vide si Makor ne l'a pas ouvert à la banque (fil de messages simple)
          oneOf:
            - $ref: '#/components/schemas/EtatChat'
            - type: 'null'
        avis:
          description: Enquête de satisfaction (étape 15) et adresse de sa page ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisClient'
            - type: 'null'
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string }
        description: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        clotureAutoPrevueLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Fin du délai pour confirmer ou contester
        messages:
          type: array
          items: { $ref: '#/components/schemas/MessageVisible' }
        piecesJointes:
          type: array
          description: Fichiers du dépôt
          items: { $ref: '#/components/schemas/PieceJointe' }
        etapes:
          type: array
          items: { $ref: '#/components/schemas/EtapeSuivi' }
        actionsPossibles:
          type: array
          description: Boutons à afficher (ex. CONFIRMER, CONTESTER)
          items: { $ref: '#/components/schemas/ActionStatut' }
        operationsPossibles:
          type: array
          description: "Opérations permises au client : CONSULTER, et MESSAGE_DU_CLIENT tant que la réclamation n'est pas résolue"
          items: { $ref: '#/components/schemas/OperationTicket' }
    AvisClient:
      type: object
      required: [etat, expireLe, chemin]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        chemin: { type: string, description: "Page de l'enquête sur le portail, ex. /suivi/<jeton>/avis", examples: ['/suivi/Zq3h0Zk8b2mN4pLsQ1w2e3r4t5y6u7i8/avis'] }
    NouveauMessage:
      type: object
      required: [contenu]
      properties:
        contenu: { type: string, minLength: 1, maxLength: 5000 }
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    Contestation:
      type: object
      required: [motif]
      properties:
        motif: { type: string, minLength: 1, maxLength: 5000 }

    # ---- Conversations et chat web (étape 17) -----------------------------------------
    CanalConversation:
      type: string
      description: "Canal d'une conversation ou d'un message : WEB (suivi et chat du portail), WHATSAPP, SMS (étape 20)"
      enum: [WEB, WHATSAPP, SMS]
    EtatChat:
      type: object
      description: Le chat vu du client
      required: [ouvert, repriseLe, luParLaBanqueLe]
      properties:
        ouvert: { type: boolean, description: "La banque est dans ses heures d'ouverture" }
        repriseLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Prochaine ouverture, quand la banque est fermée
        luParLaBanqueLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Dernière lecture de la conversation par la banque (« Lu » sous les messages du client)
    ConversationClient:
      type: object
      required: [statut, messages, curseur, chat]
      properties:
        statut:
          $ref: '#/components/schemas/StatutReclamation'
          description: Un statut différent de celui affiché appelle une relecture de la réclamation (boutons, historique)
        messages:
          type: array
          description: Messages écrits à partir de `apres`, du plus ancien au plus récent
          items: { $ref: '#/components/schemas/MessageVisible' }
        curseur:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Heure du dernier message de la réclamation, à repasser dans `apres`
        chat: { $ref: '#/components/schemas/EtatChat' }

    # ---- Authentification -----------------------------------------------------------
    MotDePasse:
      type: string
      minLength: 12
      maxLength: 128
      description: 12 caractères au moins ; refusé s'il figure dans une liste de mots de passe courants
    Connexion:
      type: object
      required: [email, motDePasse]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        motDePasse: { type: string, maxLength: 128 }
    EtapeConnexion:
      type: object
      required: [etape]
      description: |
        Suite de la connexion (étape 19). `TOTP_REQUIS` : code de l'application attendu (`validerCodeTotp`).
        `ENROLEMENT_TOTP_REQUIS` : double authentification exigée mais pas encore activée (première
        connexion, réinitialisation, banque qui vient de l'exiger) ; `enrolement` à activer (`activerTotp`).
        `SESSION_OUVERTE` : double authentification facultative et non activée ; la session est ouverte
        (`session`) et le refresh token posé en cookie.
      properties:
        etape:
          type: string
          enum: [TOTP_REQUIS, ENROLEMENT_TOTP_REQUIS, SESSION_OUVERTE]
        jetonIntermediaire: { type: string, description: "Valable 5 minutes, pour la seconde étape seulement ; absent si SESSION_OUVERTE" }
        expireDans: { type: integer, examples: [300] }
        enrolement:
          $ref: '#/components/schemas/EnrolementTotp'
          description: Présent quand etape = ENROLEMENT_TOTP_REQUIS
        session:
          $ref: '#/components/schemas/SessionPersonnel'
          description: Présent quand etape = SESSION_OUVERTE
    CodeTotp:
      type: object
      required: [jetonIntermediaire, code]
      properties:
        jetonIntermediaire: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    CodeVerification:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$', description: "Code à 6 chiffres de l'application d'authentification" }
    EnrolementCompte:
      type: object
      description: Secret à enregistrer dans l'application d'authentification (« Mon compte », étape 19)
      required: [otpauthUrl, secret, qrCodeDataUrl]
      properties:
        otpauthUrl: { type: string, examples: ['otpauth://totp/Reclamations:agent@alpha.ci?secret=…&issuer=Reclamations'] }
        secret: { type: string, description: "Secret en base32, pour une saisie manuelle" }
        qrCodeDataUrl: { type: string, description: 'Image PNG en data: URL' }
    DefinitionMotDePasse:
      type: object
      required: [jeton, motDePasse]
      properties:
        jeton: { type: string, description: "Jeton reçu par e-mail (invitation ou réinitialisation)" }
        motDePasse: { $ref: '#/components/schemas/MotDePasse' }
    EnrolementTotp:
      type: object
      required: [jetonIntermediaire, otpauthUrl, secret, qrCodeDataUrl]
      properties:
        jetonIntermediaire: { type: string }
        otpauthUrl: { type: string, examples: ['otpauth://totp/Reclamations:agent@alpha.ci?secret=…&issuer=Reclamations'] }
        secret: { type: string, description: "Secret en base32, pour une saisie manuelle" }
        qrCodeDataUrl: { type: string, description: 'Image PNG en data: URL' }
    Moi:
      type: object
      required: [id, email, nom, prenom, role, banque, totpActif, totpObligatoire]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nom: { type: string }
        prenom: { type: string }
        role: { $ref: '#/components/schemas/RoleUtilisateur' }
        totpActif: { type: boolean, description: "Double authentification activée sur ce compte (étape 19)" }
        totpObligatoire: { type: boolean, description: "Exigée : toujours pour le Super Admin, et pour le personnel d'une banque qui l'a rendue obligatoire" }
        banque:
          description: Vide pour un Super Admin
          oneOf:
            - type: object
              required: [id, nom, slug, fuseauHoraire]
              properties:
                id: { type: string, format: uuid }
                nom: { type: string }
                slug: { type: string }
                fuseauHoraire: { type: string, examples: ['Africa/Abidjan'] }
            - type: 'null'
    SessionPersonnel:
      type: object
      required: [jetonAcces, expireDans, utilisateur]
      properties:
        jetonAcces: { type: string }
        expireDans: { type: integer, examples: [900] }
        utilisateur: { $ref: '#/components/schemas/Moi' }

    # ---- Banque : réclamations --------------------------------------------------------
    ReclamationResume:
      type: object
      required: [id, numero, statut, priorite, canal, categorie, agence, agent, agentSuggere, client, creeLe, echeanceSlaLe, enRetard, escaladee, sla,
        doublonPossible, envoiNonRemis]
      properties:
        envoiNonRemis:
          type: boolean
          description: "Étape 22 : un message au client n'a pas été remis, et rien ne l'a remplacé depuis"
        doublonPossible:
          type: boolean
          description: "Étape 21 : le même client a une autre réclamation non clôturée de la même catégorie, déposée à moins de 30 jours d'écart"
        id: { type: string, format: uuid }
        numero: { type: string, examples: ['ALP-2026-000042'] }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        categorie: { $ref: '#/components/schemas/ReferenceNommee' }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agentSuggere:
          description: "Mode suggestion (étape 16) : l'agent proposé pour une réclamation non assignée, pour le superviseur ; vide sinon"
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        echeanceSlaLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Vide pendant la pause « En attente client » et après la résolution
        enRetard: { type: boolean }
        escaladee: { type: boolean }
        sla: { $ref: '#/components/schemas/SlaResume' }
    SlaResume:
      type: object
      description: Chrono d'une réclamation dans les files, de quoi dessiner sa jauge sans recalculer le temps ouvré
      required: [etat, delaiCibleMinutes, minutesRestantes]
      properties:
        etat: { $ref: '#/components/schemas/EtatChrono' }
        delaiCibleMinutes: { type: integer, minimum: 0, description: "Minutes ouvrées" }
        minutesRestantes:
          type: [integer, 'null']
          description: "Minutes ouvrées avant l'échéance, négatives après ; figées pendant la pause ; vides une fois le chrono arrêté"
    PageReclamations:
      type: object
      required: [donnees, pagination, compteurs]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/ReclamationResume' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        compteurs:
          type: object
          description: "Réclamations non clôturées de chaque file, pour l'utilisateur connecté et sans les autres filtres : les pastilles des onglets"
          required: [recues, assignees, urgentes, enRetard, escaladees, aReassigner]
          properties:
            aReassigner: { type: integer, minimum: 0, description: "Étape 21 : d'un agent désactivé ou absent aujourd'hui (0 pour un agent)" }
            recues: { type: integer, minimum: 0, description: "Non assignées (0 pour un agent)" }
            assignees: { type: integer, minimum: 0, description: "Assignées à l'utilisateur connecté" }
            urgentes: { type: integer, minimum: 0 }
            enRetard: { type: integer, minimum: 0 }
            escaladees: { type: integer, minimum: 0 }
    EtatSla:
      type: object
      required: [etat, delaiCibleMinutes, echeanceLe, alertePreventiveLe, enPauseDepuis, minutesRestantes, enRetard, respecte]
      properties:
        etat: { $ref: '#/components/schemas/EtatChrono' }
        delaiCibleMinutes: { type: integer, description: "Minutes ouvrées, copiées de la catégorie au dépôt" }
        echeanceLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        alertePreventiveLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        enPauseDepuis: { $ref: '#/components/schemas/HorodatageFacultatif' }
        minutesRestantes:
          type: [integer, 'null']
          description: "Minutes ouvrées avant l'échéance : calculées à la lecture quand le chrono tourne (négatives après l'échéance), figées pendant la pause et à la résolution"
        enRetard: { type: boolean }
        respecte: { type: [boolean, 'null'], description: "Verdict à la résolution" }
    Jalons:
      type: object
      required: [prisEnChargeLe, premiereReponseLe, resolueLe, clotureLe, clotureAutoPrevueLe, escaladeeLe, escaladeeAdminLe]
      properties:
        prisEnChargeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        premiereReponseLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        resolueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        clotureLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        clotureAutoPrevueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        escaladeeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        escaladeeAdminLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Escalade automatique à l'Admin Entreprise, seuil de dépassement franchi (étape 16)
    InfosCloture:
      type: object
      required: [mode, motif, precision, par]
      properties:
        mode: { $ref: '#/components/schemas/ModeCloture' }
        motif:
          oneOf:
            - $ref: '#/components/schemas/MotifClotureForcee'
            - type: 'null'
        precision: { type: [string, 'null'] }
        par:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
    ActeurVisible:
      type: object
      required: [type, nom]
      properties:
        type: { $ref: '#/components/schemas/TypeActeur' }
        nom: { type: [string, 'null'], description: "Nom du membre du personnel ; vide pour le client et le système" }
    Message:
      type: object
      required: [id, type, contenu, auteur, creeLe, piecesJointes, canal]
      properties:
        canal:
          description: "Étape 20 : où le client a écrit, ou par où la réponse lui est partie ; vide pour une note interne ou un message antérieur"
          oneOf:
            - $ref: '#/components/schemas/CanalConversation'
            - type: 'null'
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TypeCommentaire' }
        contenu: { type: string }
        auteur: { $ref: '#/components/schemas/ActeurVisible' }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        piecesJointes:
          type: array
          items: { $ref: '#/components/schemas/PieceJointe' }
    Evenement:
      type: object
      required: [type, statutAvant, statutApres, acteur, visibleClient, date]
      properties:
        type: { $ref: '#/components/schemas/TypeEvenement' }
        statutAvant:
          oneOf:
            - $ref: '#/components/schemas/StatutReclamation'
            - type: 'null'
        statutApres:
          oneOf:
            - $ref: '#/components/schemas/StatutReclamation'
            - type: 'null'
        acteur: { $ref: '#/components/schemas/ActeurVisible' }
        visibleClient: { type: boolean }
        date: { $ref: '#/components/schemas/Horodatage' }
    ReclamationDetail:
      type: object
      required: [id, numero, statut, priorite, canal, description, categorie, agence, pointDepot, agent, escaladeeVers, client,
        creeLe, sla, jalons, cloture, nbReouvertures, messages, piecesJointes, chronologie, actionsPossibles, operationsPossibles, avis,
        attributionSuggeree, conversation, depotAssistant, saisiePar, duMemeClient, rattacheeA, doublonsRattaches, envois]
      properties:
        envois:
          type: array
          maxItems: 50
          description: "Étape 22 : les messages envoyés au client pour cette réclamation, les plus récents d'abord (jamais leur texte)"
          items: { $ref: '#/components/schemas/EnvoiClient' }
        saisiePar:
          description: "Étape 21 : saisie au guichet ou au téléphone par cette personne de la banque"
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        duMemeClient:
          type: array
          maxItems: 10
          description: "Étape 21 : les autres réclamations du même client, les plus récentes d'abord"
          items: { $ref: '#/components/schemas/ReclamationDuClient' }
        rattacheeA:
          description: "Étape 21 : doublon joint à cette réclamation principale"
          oneOf:
            - $ref: '#/components/schemas/RattacheeA'
            - type: 'null'
        doublonsRattaches:
          type: array
          description: "Étape 21 : doublons joints à cette réclamation"
          items: { $ref: '#/components/schemas/RattacheeA' }
        depotAssistant: { type: boolean, description: "Déposée avec l'assistant automatique du portail (étape 18)" }
        conversation:
          description: Chat web (étape 17) ; vide si le client ne l'a pas ouvert ou si Makor ne l'a pas ouvert à la banque
          oneOf:
            - $ref: '#/components/schemas/ConversationTicket'
            - type: 'null'
        attributionSuggeree:
          description: "Mode suggestion (étape 16) : l'agent proposé, pour le superviseur, tant que la réclamation n'est pas assignée"
          oneOf:
            - $ref: '#/components/schemas/AttributionSuggeree'
            - type: 'null'
        avis:
          description: Enquête de satisfaction ouverte à la clôture (étape 15) ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisReclamation'
            - type: 'null'
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        description: { type: string }
        categorie: { $ref: '#/components/schemas/ReferenceNommee' }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        pointDepot:
          type: object
          required: [id, libelle]
          properties:
            id: { type: string, format: uuid }
            libelle: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        escaladeeVers:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        client:
          type: object
          required: [id, nom, email, telephone]
          properties:
            id: { type: string, format: uuid }
            nom: { type: string }
            email: { type: [string, 'null'] }
            telephone: { type: [string, 'null'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        sla: { $ref: '#/components/schemas/EtatSla' }
        jalons: { $ref: '#/components/schemas/Jalons' }
        cloture:
          oneOf:
            - $ref: '#/components/schemas/InfosCloture'
            - type: 'null'
        nbReouvertures: { type: integer, minimum: 0 }
        messages:
          type: array
          description: Notes internes comprises
          items: { $ref: '#/components/schemas/Message' }
        piecesJointes:
          type: array
          description: Fichiers du dépôt
          items: { $ref: '#/components/schemas/PieceJointe' }
        chronologie:
          type: array
          items: { $ref: '#/components/schemas/Evenement' }
        actionsPossibles:
          type: array
          description: Transitions permises à l'utilisateur connecté
          items: { $ref: '#/components/schemas/ActionStatut' }
        operationsPossibles:
          type: array
          description: Opérations permises à l'utilisateur connecté
          items: { $ref: '#/components/schemas/OperationTicket' }
    # ---- Étape 21 : saisie par le personnel, doublons, réaffectation, réclamations retrouvées ----
    ReclamationDuClient:
      type: object
      description: Une autre réclamation du même client, sur la fiche
      required: [id, numero, categorie, statut, creeLe, agent, doublonPossible, accessible]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        categorie: { $ref: '#/components/schemas/ReferenceNommee' }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        doublonPossible:
          type: boolean
          description: Même catégorie, toutes deux non clôturées, déposées à moins de 30 jours d'écart
        accessible:
          type: boolean
          description: L'utilisateur connecté peut l'ouvrir (un agent, seulement les siennes)
    RattacheeA:
      type: object
      required: [id, numero, chemin]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        chemin:
          type: [string, 'null']
          description: "Pour le client : sa page de suivi sur le portail ; vide pour le personnel"
          examples: ['/suivi/Qm9uam91ckJhbnF1ZUFscGhh']
    SaisieReclamation:
      type: object
      description: Un e-mail ou un téléphone au moins, comme au portail (arbitrage 1)
      required: [canal, categorieId, description, nom, consentementInforme]
      anyOf:
        - required: [email]
        - required: [telephone]
      properties:
        canal: { type: string, enum: [GUICHET, TELEPHONE] }
        agenceId: { type: string, format: uuid, description: "Obligatoire au guichet ; au téléphone, l'agence dont parle le client" }
        categorieId: { type: string, format: uuid }
        description: { type: string, minLength: 1, maxLength: 5000 }
        nom: { type: string, minLength: 2, maxLength: 160 }
        email: { type: string, format: email, maxLength: 254 }
        telephone: { type: string, maxLength: 25, description: "Format libre, normalisé en E.164 (+225 par défaut)" }
        consentementInforme: { type: boolean, const: true, description: "Le client a été informé de la politique de données de la banque" }
        urgente: { type: boolean, default: false, description: "Priorité urgente dès la saisie (sinon celle de la catégorie)" }
        meLAssigner: { type: boolean, default: true, description: "Un agent se l'assigne ; ignoré pour un superviseur" }
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    AccuseSaisie:
      type: object
      required: [id, numero, lienSuivi, creeLe, envoiPar, agent]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string, examples: ['ALP-2026-000042'] }
        lienSuivi: { type: string, format: uri, description: "Pour le QR code du récépissé ; il n'est plus montré au personnel ensuite" }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        envoiPar:
          type: array
          description: Canaux de l'accusé envoyé au client
          items: { $ref: '#/components/schemas/CanalOtp' }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
    Rattachement:
      type: object
      required: [principaleId]
      properties:
        principaleId: { type: string, format: uuid, description: "Réclamation principale du même client, non clôturée" }
    EnvoiClient:
      type: object
      description: Un message au client (étape 22) ; sa coordonnée masquée, jamais son texte
      required: [id, canal, objet, destinationMasquee, etat, motif, tentatives, prochaineTentativeLe, creeLe, envoyeLe, remiseLe, renvoyable]
      properties:
        id: { type: string, format: uuid }
        canal: { type: string, enum: [EMAIL, SMS, WHATSAPP] }
        objet: { type: string, examples: ['Résolution'] }
        destinationMasquee: { type: string, examples: ['+225 07 •• •• •• 11'] }
        etat: { $ref: '#/components/schemas/EtatEnvoi' }
        motif:
          description: Non remis, pourquoi
          oneOf:
            - $ref: '#/components/schemas/MotifEchec'
            - type: 'null'
        tentatives: { type: integer, minimum: 0 }
        prochaineTentativeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        envoyeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        remiseLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        renvoyable: { type: boolean, description: "Non remis et renvoyable par l'utilisateur connecté (renvoyerMessage)" }
    EtatEnvoi:
      type: string
      description: |
        EN_ATTENTE : pas encore parti ; NOUVEL_ESSAI : échec temporaire, nouvelle tentative à prochaineTentativeLe ;
        ENVOYE : accepté par la passerelle ou le serveur d'e-mail ; REMIS : accusé de remise (SMS, WhatsApp) ;
        LU : lu sur WhatsApp ; NON_REMIS : définitivement non remis (motif)
      enum: [EN_ATTENTE, NOUVEL_ESSAI, ENVOYE, REMIS, LU, NON_REMIS]
    MotifEchec:
      type: string
      enum: [NUMERO_INVALIDE, INJOIGNABLE, EXPIRE, REFUSE, ADRESSE_INVALIDE, WHATSAPP_INDISPONIBLE, ERREUR_TECHNIQUE]
    LienSuiviRenvoye:
      type: object
      required: [envois]
      properties:
        envois:
          type: array
          minItems: 1
          items:
            type: object
            required: [canal, destinationMasquee]
            properties:
              canal: { type: string, enum: [SMS, EMAIL, WHATSAPP] }
              destinationMasquee: { type: string, examples: ['+225 07 •• •• •• 11'] }
    AssignationEnLot:
      type: object
      description: "Soit `agentId`, soit `repartir`"
      required: [reclamationIds]
      oneOf:
        - required: [agentId]
        - required: [repartir]
      properties:
        reclamationIds:
          type: array
          minItems: 1
          maxItems: 100
          uniqueItems: true
          items: { type: string, format: uuid }
        agentId: { type: string, format: uuid, description: "Toutes à cet agent actif" }
        repartir: { type: boolean, const: true, description: "Chacune à l'agent disponible le moins chargé" }
    ResultatAssignationEnLot:
      type: object
      required: [assignees, laissees]
      properties:
        assignees:
          type: array
          items:
            type: object
            required: [id, numero, agent]
            properties:
              id: { type: string, format: uuid }
              numero: { type: string }
              agent: { $ref: '#/components/schemas/ReferenceNommee' }
        laissees:
          type: array
          items:
            type: object
            required: [id, numero, raison]
            properties:
              id: { type: string, format: uuid }
              numero: { type: [string, 'null'], description: "Vide si la réclamation est introuvable" }
              raison: { type: string, examples: ['Aucun agent disponible'] }
    DemandeAcces:
      type: object
      required: [contact, jetonAntiRobot]
      properties:
        contact: { type: string, minLength: 6, maxLength: 254, description: "Téléphone (format libre, +225 par défaut) ou e-mail donné au dépôt", examples: ['07 08 09 10 11'] }
        jetonAntiRobot: { $ref: '#/components/schemas/JetonAntiRobot' }
    VerificationAcces:
      type: object
      required: [contact, code]
      properties:
        contact: { type: string, minLength: 6, maxLength: 254 }
        code: { type: string, pattern: '^[0-9]{6}$' }
    AvisReclamation:
      type: object
      required: [etat, ouverteLe, expireLe, reponse]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        ouverteLe: { $ref: '#/components/schemas/Horodatage' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        reponse:
          oneOf:
            - $ref: '#/components/schemas/AvisDonne'
            - type: 'null'
    ReponseAuClient:
      type: object
      required: [contenu]
      properties:
        contenu: { type: string, minLength: 1, maxLength: 5000 }
        attendreReponse:
          type: boolean
          default: false
          description: Passe le ticket « En attente client » (question) et suspend le chrono SLA
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    ReclamationEnConversation:
      type: object
      required: [id, numero, statut, priorite, categorie]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        categorie: { type: string }
    ConversationResume:
      type: object
      required: [id, canal, reclamation, client, agent, dernierMessage, aRepondre, nonLue, clientEnLigne]
      properties:
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        reclamation: { $ref: '#/components/schemas/ReclamationEnConversation' }
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        dernierMessage:
          type: object
          required: [extrait, auteur, date]
          properties:
            extrait: { type: string, maxLength: 140, description: "Sur une ligne, coupé au mot" }
            auteur: { type: string, enum: [BANQUE, CLIENT] }
            date: { $ref: '#/components/schemas/Horodatage' }
        aRepondre: { type: boolean, description: "Le client a écrit en dernier" }
        nonLue: { type: boolean, description: "Un message du client attend la lecture de la banque" }
        clientEnLigne: { type: boolean, description: "Le client avait le chat à l'écran il y a moins de 2 minutes" }
    PageConversations:
      type: object
      required: [donnees, pagination, compteurs]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/ConversationResume' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        compteurs:
          type: object
          description: Toutes pages confondues, dans le périmètre de l'appelant (pastille du menu)
          required: [aRepondre, nonLues]
          properties:
            aRepondre: { type: integer, minimum: 0 }
            nonLues: { type: integer, minimum: 0 }
    ConversationDetail:
      type: object
      required: [id, canal, reclamation, client, agent, description, deposeeLe, messages, aRepondre, nonLue, clientEnLigne,
        luParLeClientLe, operationsPossibles, reponseVers]
      properties:
        reponseVers: { $ref: '#/components/schemas/ReponseVers' }
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        reclamation: { $ref: '#/components/schemas/ReclamationEnConversation' }
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        description: { type: string, description: "Texte du dépôt, en tête du fil" }
        deposeeLe: { $ref: '#/components/schemas/Horodatage' }
        messages:
          type: array
          description: Réponses de la banque et messages du client, du plus ancien au plus récent (jamais une note interne)
          items: { $ref: '#/components/schemas/Message' }
        aRepondre: { type: boolean }
        nonLue: { type: boolean }
        clientEnLigne: { type: boolean }
        luParLeClientLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Dernière lecture par le client (« Lu » sous les réponses de la banque)
        operationsPossibles:
          type: array
          description: REPONDRE_AU_CLIENT si l'appelant peut répondre d'ici
          items: { $ref: '#/components/schemas/OperationTicket' }
    ReponseVers:
      type: object
      description: |
        Par où partira la prochaine réponse de la banque (étape 20) : WHATSAPP, le texte même, si le client y a
        écrit en dernier il y a moins de 24 h ; SMS, le texte même, s'il a écrit par SMS ; sinon WEB : la
        réponse reste dans son suivi et il en est averti par e-mail ou SMS, sans le texte.
      required: [canal, finFenetreLe]
      properties:
        canal: { $ref: '#/components/schemas/CanalConversation' }
        finFenetreLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: "WhatsApp : fin de la fenêtre de 24 h ouverte par le dernier message du client"
    ConversationTicket:
      type: object
      description: Conversation de la réclamation, sur sa fiche
      required: [id, canal, aRepondre, nonLue, clientEnLigne, luParLeClientLe, reponseVers]
      properties:
        reponseVers: { $ref: '#/components/schemas/ReponseVers' }
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        aRepondre: { type: boolean }
        nonLue: { type: boolean }
        clientEnLigne: { type: boolean }
        luParLeClientLe: { $ref: '#/components/schemas/HorodatageFacultatif' }

    # ---- Tableau de bord ----------------------------------------------------------------
    Volume:
      type: object
      required: [cle, libelle, total]
      properties:
        cle: { type: string }
        libelle: { type: string }
        total: { type: integer, minimum: 0 }
    Indicateurs:
      type: object
      description: Définitions du §6.6 ; délais en minutes ouvrées
      required: [du, au, total, parStatut, parCategorie, parCanal, parAgence, delaiPremiereReponseMoyenMinutes,
        delaiResolutionMoyenMinutes, tauxRespectSla, tauxResolutionPremierContact, charge, evolution, satisfaction]
      properties:
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        total: { type: integer, minimum: 0 }
        parStatut:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parCategorie:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parCanal:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parAgence:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        delaiPremiereReponseMoyenMinutes: { type: [number, 'null'] }
        delaiResolutionMoyenMinutes: { type: [number, 'null'] }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1, description: "Part des réclamations résolues avant leur échéance" }
        tauxResolutionPremierContact: { type: [number, 'null'], minimum: 0, maximum: 1, description: "Sans attente client, sans escalade, sans réouverture" }
        charge: { $ref: '#/components/schemas/Charge' }
        evolution: { $ref: '#/components/schemas/Evolution' }
        satisfaction:
          description: Enquêtes de satisfaction (étape 15) ; vide si la banque ne les a pas activées et n'en a aucune sur la période
          oneOf:
            - $ref: '#/components/schemas/Satisfaction'
            - type: 'null'
    Satisfaction:
      type: object
      description: |
        Enquêtes ouvertes pendant la période (date de clôture), avec les mêmes filtres que les autres
        indicateurs. Satisfaits : notes 4 et 5 (CSAT). NPS : part des notes 9 et 10 moins part des notes
        0 à 6, de -100 à 100. Un agent ne voit que ses réclamations.
      required: [enquetes, reponses, tauxReponse, tauxSatisfaits, noteMoyenne, nps, promoteurs, passifs, detracteurs, parAgent, commentaires]
      properties:
        enquetes: { type: integer, minimum: 0, description: "Enquêtes ouvertes (réclamations clôturées par confirmation ou automatiquement)" }
        reponses: { type: integer, minimum: 0 }
        tauxReponse: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1, description: "CSAT : part des notes 4 et 5" }
        noteMoyenne: { type: [number, 'null'], minimum: 1, maximum: 5 }
        nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
        promoteurs: { type: integer, minimum: 0, description: "Recommandation 9 ou 10" }
        passifs: { type: integer, minimum: 0, description: "Recommandation 7 ou 8" }
        detracteurs: { type: integer, minimum: 0, description: "Recommandation de 0 à 6" }
        parAgent:
          type: array
          description: Agents qui ont traité des réclamations ayant reçu une réponse, du plus grand nombre de réponses au plus petit
          items:
            type: object
            required: [cle, libelle, reponses, tauxSatisfaits, nps]
            properties:
              cle: { type: string }
              libelle: { type: string }
              reponses: { type: integer, minimum: 1 }
              tauxSatisfaits: { type: number, minimum: 0, maximum: 1 }
              nps: { type: integer, minimum: -100, maximum: 100 }
        commentaires:
          type: array
          maxItems: 10
          description: Les 10 derniers commentaires laissés par les clients
          items:
            type: object
            required: [reclamationId, numero, note, recommandation, commentaire, reponduLe]
            properties:
              reclamationId: { type: string, format: uuid }
              numero: { type: string }
              note: { type: integer, minimum: 1, maximum: 5 }
              recommandation: { type: integer, minimum: 0, maximum: 10 }
              commentaire: { type: string }
              reponduLe: { $ref: '#/components/schemas/Horodatage' }
    Charge:
      type: object
      description: |
        Réclamations non clôturées à cet instant, quelle que soit la période (étape 11) ; les autres
        filtres s'appliquent. En alerte : seuil d'alerte de la banque franchi, échéance pas encore
        passée. En retard : mêmes règles que la file « En retard ».
      required: [aTraiter, enAttenteClient, enAlerte, enRetard]
      properties:
        aTraiter: { type: integer, minimum: 0, description: "Ouvertes ou en cours" }
        enAttenteClient: { type: integer, minimum: 0 }
        enAlerte: { type: integer, minimum: 0 }
        enRetard: { type: integer, minimum: 0 }
    IndicateursAgences:
      type: object
      description: |
        Activité des agences (étape 19) : mêmes définitions que le tableau de bord (§6.6), réclamations
        déposées pendant la période, délais en minutes ouvrées, charge à cet instant.
      required: [du, au, agences]
      properties:
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        agences:
          type: array
          items: { $ref: '#/components/schemas/ActiviteAgence' }
    ActiviteAgence:
      type: object
      required: [agence, groupe, total, urgentes, resolues, delaiPremiereReponseMoyenMinutes, delaiResolutionMoyenMinutes,
        tauxRespectSla, tauxResolutionPremierContact, charge, satisfaction, parCategorie, agents, pointsDepot]
      properties:
        agence:
          description: Vide pour les dépôts par lien web sans agence indiquée
          oneOf:
            - type: object
              required: [id, code, nom, ville, active]
              properties:
                id: { type: string, format: uuid }
                code: { type: string }
                nom: { type: string }
                ville: { type: [string, 'null'] }
                active: { type: boolean }
            - type: 'null'
        groupe:
          description: Groupe d'agents qui reçoit les réclamations de l'agence (attribution automatique, étape 16)
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        total: { type: integer, minimum: 0, description: "Réclamations déposées pendant la période" }
        urgentes: { type: integer, minimum: 0 }
        resolues: { type: integer, minimum: 0, description: "Résolues et non rouvertes depuis" }
        delaiPremiereReponseMoyenMinutes: { type: [number, 'null'] }
        delaiResolutionMoyenMinutes: { type: [number, 'null'] }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tauxResolutionPremierContact: { type: [number, 'null'], minimum: 0, maximum: 1 }
        charge: { $ref: '#/components/schemas/Charge' }
        satisfaction:
          description: Enquêtes ouvertes pendant la période ; vide si la banque ne les a pas activées et n'en a aucune
          oneOf:
            - type: object
              required: [enquetes, reponses, tauxSatisfaits, nps]
              properties:
                enquetes: { type: integer, minimum: 0 }
                reponses: { type: integer, minimum: 0 }
                tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
                nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
            - type: 'null'
        parCategorie:
          type: array
          maxItems: 3
          description: Les trois catégories les plus fréquentes
          items: { $ref: '#/components/schemas/Volume' }
        agents:
          type: array
          maxItems: 5
          description: Agents assignés aux réclamations de la période, du plus grand nombre au plus petit (5 au plus)
          items: { $ref: '#/components/schemas/Volume' }
        pointsDepot:
          type: array
          description: |
            QR codes et liens web de l'agence, et liens web par lesquels des clients l'ont choisie, avec les
            réclamations reçues par chacun pendant la période (leur somme fait `total`)
          items:
            type: object
            required: [id, libelle, canal, actif, total]
            properties:
              id: { type: string, format: uuid }
              libelle: { type: string }
              canal: { $ref: '#/components/schemas/CanalDepot' }
              actif: { type: boolean }
              total: { type: integer, minimum: 0 }
    Regroupement:
      type: string
      description: Pas d'une série dans le temps, calculé dans le fuseau de la banque (semaine du lundi)
      enum: [JOUR, SEMAINE, MOIS]
    Evolution:
      type: object
      description: Courbe du tableau de bord (étape 9, décision E7 de l'étape 6)
      required: [regroupement, points]
      properties:
        regroupement: { $ref: '#/components/schemas/Regroupement' }
        points:
          type: array
          maxItems: 400
          items:
            type: object
            required: [debut, deposees, resolues]
            properties:
              debut: { $ref: '#/components/schemas/Horodatage' }
              deposees: { type: integer, minimum: 0, description: "Déposées pendant ce pas" }
              resolues: { type: integer, minimum: 0, description: "Résolues pendant ce pas (date de la dernière résolution), quelle que soit leur date de dépôt" }

    # ---- Notifications in-app --------------------------------------------------------------
    NotificationInApp:
      type: object
      required: [id, modele, sujet, contenu, reclamationId, creeLe, lueLe]
      properties:
        id: { type: string, format: uuid }
        modele: { type: string, examples: ['sla.alerte_preventive'] }
        sujet: { type: [string, 'null'] }
        contenu: { type: string }
        reclamationId: { type: [string, 'null'], format: uuid }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        lueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
    PageNotifications:
      type: object
      required: [donnees, pagination, nonLues]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/NotificationInApp' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        nonLues: { type: integer, minimum: 0 }

    # ---- Paramétrage ----------------------------------------------------------------------
    ParametresBanque:
      type: object
      required: [nom, slug, prefixeTickets, fuseauHoraire, seuilAlerteSlaPourcent, delaiClotureAutoJours,
        smsChaqueChangementStatut, enqueteSatisfaction, attributionAutomatique, modeAttribution, chatWeb, assistantIa, barometre, doubleAuthentificationObligatoire,
        whatsapp, smsEntrant, couleurPrimaire, couleurSecondaire, logoUrl, emailContact, plan, consommation]
      properties:
        whatsapp:
          description: "Numéro WhatsApp de la banque, quand Makor l'a raccordé et ouvert (étape 20)"
          type: [string, 'null']
          examples: ['+2252722000000']
        smsEntrant:
          description: "Numéro auquel les clients écrivent par SMS, quand Makor l'a raccordé et ouvert (étape 20)"
          type: [string, 'null']
        nom: { type: string }
        slug: { type: string }
        prefixeTickets: { type: string }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer, minimum: 1, maximum: 99 }
        delaiClotureAutoJours: { type: integer, minimum: 1, maximum: 60 }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean, description: "Enquête de satisfaction à la clôture (étape 15), activée par Makor" }
        attributionAutomatique: { type: boolean, description: "Attribution et escalade automatiques (étape 16), ouvertes par Makor" }
        modeAttribution: { $ref: '#/components/schemas/ModeAttribution' }
        chatWeb: { type: boolean, description: "Chat web du portail et boîte de réception (étape 17), ouverts par Makor" }
        assistantIa: { type: boolean, description: "Assistant du portail et brouillons pour les agents (étape 18), ouverts par Makor" }
        barometre: { type: boolean, description: "Baromètre mensuel et recommandations (étape 23), ouverts par Makor" }
        doubleAuthentificationObligatoire: { type: boolean, description: "Double authentification exigée de tout le personnel (étape 19), réglée par l'Admin Entreprise" }
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
        logoUrl: { type: [string, 'null'], format: uri-reference }
        emailContact: { type: [string, 'null'], format: email }
        plan:
          type: object
          required: [nom, plafondAgents, plafondTicketsMois]
          properties:
            nom: { type: string }
            plafondAgents: { type: [integer, 'null'], description: "Vide = illimité" }
            plafondTicketsMois: { type: [integer, 'null'], description: "Vide = illimité" }
        consommation:
          type: object
          required: [agents, ticketsCeMois]
          properties:
            agents: { type: integer, description: "Agents et superviseurs non désactivés" }
            ticketsCeMois: { type: integer }
    ModificationSecurite:
      type: object
      required: [doubleAuthentificationObligatoire]
      properties:
        doubleAuthentificationObligatoire: { type: boolean }
    ModificationApparence:
      type: object
      minProperties: 1
      properties:
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
        emailContact: { type: [string, 'null'], format: email, maxLength: 254 }
    Categorie:
      type: object
      required: [id, nom, description, prioriteParDefaut, delaiCibleMinutes, ordre, active]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        description: { type: [string, 'null'] }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, description: "Minutes ouvrées" }
        ordre: { type: integer }
        active: { type: boolean }
    EcritureCategorie:
      type: object
      required: [nom, delaiCibleMinutes]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, maximum: 525600 }
        ordre: { type: integer, default: 0 }
    ModificationCategorie:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, maximum: 525600 }
        ordre: { type: integer }
        active: { type: boolean }
    Agence:
      type: object
      required: [id, code, nom, ville, adresse, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['AG01'] }
        nom: { type: string, examples: ['Plateau'] }
        ville: { type: [string, 'null'] }
        adresse: { type: [string, 'null'] }
        active: { type: boolean }
    EcritureAgence:
      type: object
      required: [code, nom]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        nom: { type: string, minLength: 2, maxLength: 160 }
        ville: { type: [string, 'null'], maxLength: 120 }
        adresse: { type: [string, 'null'], maxLength: 255 }
    ModificationAgence:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        ville: { type: [string, 'null'], maxLength: 120 }
        adresse: { type: [string, 'null'], maxLength: 255 }
        active: { type: boolean }
    PointDepot:
      type: object
      required: [id, code, canal, libelle, agence, actif, urlDepot]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['7K3QX9P2MA'] }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        libelle: { type: string }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        actif: { type: boolean }
        urlDepot: { type: string, format: uri, description: "Adresse encodée dans le QR code ou à placer sur le site ; WhatsApp : https://wa.me/<numéro> ; SMS : sms:<numéro>" }
    EcriturePointDepot:
      type: object
      required: [canal, libelle]
      properties:
        canal: { type: string, enum: [QR_CODE, LIEN_WEB], description: "Les points WhatsApp et SMS sont créés par Makor au raccordement du numéro" }
        libelle: { type: string, minLength: 2, maxLength: 160 }
        agenceId: { type: [string, 'null'], format: uuid, description: "Obligatoire pour un QR code" }
    ModificationPointDepot:
      type: object
      minProperties: 1
      properties:
        libelle: { type: string, minLength: 2, maxLength: 160 }
        agenceId: { type: [string, 'null'], format: uuid }
        actif: { type: boolean }
    Plage:
      type: object
      required: [jourSemaine, debut, fin]
      properties:
        jourSemaine: { type: integer, minimum: 1, maximum: 7, description: "1 = lundi … 7 = dimanche" }
        debut: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['08:00'] }
        fin: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', examples: ['12:00'] }
    Horaires:
      type: object
      required: [fuseauHoraire, plages]
      properties:
        fuseauHoraire: { type: string, examples: ['Africa/Abidjan'] }
        plages:
          type: array
          items: { $ref: '#/components/schemas/Plage' }
    JourFerie:
      type: object
      required: [id, date, libelle, recurrent]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date, examples: ['2026-08-07'] }
        libelle: { type: string, examples: ["Fête de l'Indépendance"] }
        recurrent: { type: boolean, description: "Répété chaque année au même jour" }
    EcritureJourFerie:
      type: object
      required: [date, libelle]
      properties:
        date: { type: string, format: date }
        libelle: { type: string, minLength: 2, maxLength: 120 }
        recurrent: { type: boolean, default: false }

    # ---- Attribution et escalade automatiques (étape 16) ---------------------------------------
    ModeAttribution:
      type: string
      description: |
        MANUELLE : le superviseur assigne, comme en phase 1. SUGGESTION : l'API propose l'agent, le
        superviseur valide. AUTOMATIQUE : la réclamation part au dépôt vers l'agent proposé.
      enum: [MANUELLE, SUGGESTION, AUTOMATIQUE]
    SeuilEscalade:
      type: [integer, 'null']
      minimum: 101
      maximum: 1000
      description: "Pourcentage du délai cible (150 = la moitié du délai après l'échéance) ; vide = pas de seuil ici"
    ReglesTraitement:
      type: object
      required: [mode, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent, categories, agences]
      properties:
        mode: { $ref: '#/components/schemas/ModeAttribution' }
        seuilEscaladeAdminPourcent:
          $ref: '#/components/schemas/SeuilEscalade'
          description: Seuil d'escalade à l'Admin Entreprise de la banque, réclamations normales
        seuilEscaladeAdminUrgentPourcent:
          $ref: '#/components/schemas/SeuilEscalade'
          description: Seuil pour les réclamations urgentes ; vide = celui des normales
        categories:
          type: array
          description: Toutes les catégories, actives ou non, dans l'ordre d'affichage
          items:
            type: object
            required: [categorie, active, groupe, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent]
            properties:
              categorie: { $ref: '#/components/schemas/ReferenceNommee' }
              active: { type: boolean }
              groupe:
                oneOf:
                  - $ref: '#/components/schemas/ReferenceNommee'
                  - type: 'null'
              seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
              seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        agences:
          type: array
          description: Toutes les agences, par code
          items:
            type: object
            required: [agence, active, groupe]
            properties:
              agence: { $ref: '#/components/schemas/ReferenceNommee' }
              active: { type: boolean }
              groupe:
                oneOf:
                  - $ref: '#/components/schemas/ReferenceNommee'
                  - type: 'null'
    ModificationReglesTraitement:
      type: object
      minProperties: 1
      properties:
        mode: { $ref: '#/components/schemas/ModeAttribution' }
        seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        categories:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, groupeId, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent]
            properties:
              id: { type: string, format: uuid }
              groupeId: { type: [string, 'null'], format: uuid }
              seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
              seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        agences:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, groupeId]
            properties:
              id: { type: string, format: uuid }
              groupeId: { type: [string, 'null'], format: uuid }
    MembreGroupe:
      type: object
      required: [id, nom, statut, absent, aTraiter]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, examples: ['Awa Koné'] }
        statut: { $ref: '#/components/schemas/StatutUtilisateur' }
        absent: { type: boolean, description: "Absence déclarée pour aujourd'hui" }
        aTraiter: { type: integer, minimum: 0, description: "Réclamations ouvertes ou en cours qui lui sont assignées (sa charge)" }
    GroupeAgents:
      type: object
      required: [id, nom, membres, categories, agences]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, examples: ['Monétique'] }
        membres:
          type: array
          description: Agents du groupe, par nom
          items: { $ref: '#/components/schemas/MembreGroupe' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/ReferenceNommee' }
        agences:
          type: array
          items: { $ref: '#/components/schemas/ReferenceNommee' }
    EcritureGroupe:
      type: object
      required: [nom, membres]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        membres:
          type: array
          description: Agents de la banque (rôle Agent, compte non désactivé)
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    ModificationGroupe:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        membres:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    Absence:
      type: object
      required: [id, agent, du, au, creeLe, reclamationsEnCours]
      properties:
        reclamationsEnCours: { type: integer, minimum: 0, description: "Étape 21 : réclamations non clôturées assignées à l'agent, à réassigner pendant son absence" }
        id: { type: string, format: uuid }
        agent: { $ref: '#/components/schemas/ReferenceNommee' }
        du: { type: string, format: date, description: "Premier jour d'absence" }
        au: { type: string, format: date, description: "Dernier jour d'absence (inclus)" }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
    NouvelleAbsence:
      type: object
      required: [agentId, du, au]
      properties:
        agentId: { type: string, format: uuid }
        du: { type: string, format: date }
        au: { type: string, format: date, description: "Au plus 366 jours après le premier jour, pas avant aujourd'hui" }
    AttributionSuggeree:
      type: object
      description: Agent qui recevrait la réclamation maintenant (mode suggestion)
      required: [agent, groupe]
      properties:
        agent: { $ref: '#/components/schemas/ReferenceNommee' }
        groupe: { $ref: '#/components/schemas/ReferenceNommee' }

    # ---- Personnel -------------------------------------------------------------------------
    Utilisateur:
      type: object
      required: [id, email, nom, prenom, telephone, role, statut, superviseur, totpActif, derniereConnexionLe, verrouilleJusquA, reclamationsEnCours]
      properties:
        reclamationsEnCours: { type: integer, minimum: 0, description: "Étape 21 : réclamations non clôturées qui lui sont assignées" }
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nom: { type: string }
        prenom: { type: string }
        telephone: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/RoleUtilisateur' }
        statut: { $ref: '#/components/schemas/StatutUtilisateur' }
        superviseur:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        totpActif: { type: boolean }
        derniereConnexionLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        verrouilleJusquA: { $ref: '#/components/schemas/HorodatageFacultatif' }
    PageUtilisateurs:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/Utilisateur' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    IdentitePersonne:
      type: object
      required: [email, nom, prenom]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        nom: { type: string, minLength: 1, maxLength: 120 }
        prenom: { type: string, minLength: 1, maxLength: 120 }
        telephone: { type: [string, 'null'], maxLength: 25 }
    InvitationUtilisateur:
      allOf:
        - $ref: '#/components/schemas/IdentitePersonne'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/RoleBanque' }
            superviseurId: { type: [string, 'null'], format: uuid, description: "Équipe d'un agent" }
    ModificationUtilisateur:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 1, maxLength: 120 }
        prenom: { type: string, minLength: 1, maxLength: 120 }
        telephone: { type: [string, 'null'], maxLength: 25 }
        role: { $ref: '#/components/schemas/RoleBanque' }
        superviseurId: { type: [string, 'null'], format: uuid }

    # ---- Audit -------------------------------------------------------------------------------
    LigneAudit:
      type: object
      required: [id, chaine, rang, horodatage, acteur, action, entite, entiteId, donnees, ip]
      properties:
        id: { type: string, description: "Identifiant technique (entier)" }
        chaine: { type: string, examples: ['banque:0199…', 'plateforme'] }
        rang: { type: integer, minimum: 1 }
        horodatage: { $ref: '#/components/schemas/Horodatage' }
        acteur:
          type: object
          required: [type, id, libelle, role]
          properties:
            type: { $ref: '#/components/schemas/TypeActeur' }
            id: { type: [string, 'null'], format: uuid }
            libelle: { type: [string, 'null'], description: "Identité figée au moment de l'action (jamais le nom d'un client)" }
            role: { type: [string, 'null'] }
        action: { type: string, examples: ['reclamation.resolution'] }
        entite: { type: [string, 'null'] }
        entiteId: { type: [string, 'null'] }
        donnees: { type: [object, 'null'], additionalProperties: true, description: "Identifiants et statuts seulement" }
        ip: { type: [string, 'null'] }
    PageAudit:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/LigneAudit' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    VerificationChaine:
      type: object
      required: [chaine, valide, lignes, premiereRupture]
      properties:
        chaine: { type: string }
        valide: { type: boolean }
        lignes: { type: integer, minimum: 0 }
        premiereRupture: { type: [integer, 'null'], description: "Rang de la première ligne altérée ou manquante" }

    # ---- Plateforme ----------------------------------------------------------------------------
    Plan:
      type: object
      required: [id, code, nom, description, plafondAgents, plafondTicketsMois, actif]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['ESSENTIEL'] }
        nom: { type: string }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1, description: "Vide = illimité ; bloque les invitations" }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1, description: "Vide = illimité ; jamais bloquant pour un dépôt" }
        actif: { type: boolean }
    EcriturePlan:
      type: object
      required: [code, nom]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1 }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1 }
    ModificationPlan:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1 }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1 }
        actif: { type: boolean }
    BanquePlateforme:
      type: object
      required: [id, nom, slug, prefixeTickets, plan, fuseauHoraire, seuilAlerteSlaPourcent, delaiClotureAutoJours,
        smsChaqueChangementStatut, enqueteSatisfaction, attributionAutomatique, chatWeb, assistantIa, barometre, doubleAuthentificationObligatoire,
        whatsapp, smsEntrant, raccordements, suspendueLe, motifSuspension, creeLe, consommation]
      properties:
        whatsapp: { type: boolean, description: "WhatsApp Business ouvert (étape 20)" }
        smsEntrant: { type: boolean, description: "SMS entrant ouvert (étape 20)" }
        raccordements: { $ref: '#/components/schemas/Raccordements' }
        id: { type: string, format: uuid }
        nom: { type: string }
        slug: { type: string }
        prefixeTickets: { type: string }
        plan: { $ref: '#/components/schemas/ReferenceNommee' }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer }
        delaiClotureAutoJours: { type: integer }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean }
        attributionAutomatique: { type: boolean }
        chatWeb: { type: boolean }
        assistantIa: { type: boolean }
        barometre: { type: boolean, description: "Baromètre mensuel (étape 23)" }
        doubleAuthentificationObligatoire: { type: boolean, description: "Réglée par l'Admin Entreprise de la banque (étape 19)" }
        suspendueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        motifSuspension: { type: [string, 'null'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        consommation:
          type: object
          required: [agents, ticketsCeMois]
          properties:
            agents: { type: integer }
            ticketsCeMois: { type: integer }
    PageBanques:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/BanquePlateforme' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CreationBanque:
      type: object
      required: [nom, slug, prefixeTickets, planId, administrateur]
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', description: "Adresse du portail" }
        prefixeTickets: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        planId: { type: string, format: uuid }
        fuseauHoraire: { type: string, default: Africa/Abidjan }
        administrateur: { $ref: '#/components/schemas/IdentitePersonne' }
    ModificationBanque:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        planId: { type: string, format: uuid }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer, minimum: 1, maximum: 99 }
        delaiClotureAutoJours: { type: integer, minimum: 1, maximum: 60 }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean, description: "Enquête de satisfaction à la clôture (étape 15)" }
        attributionAutomatique:
          type: boolean
          description: "Attribution et escalade automatiques (étape 16) ; fermer la fonction remet la banque en attribution manuelle"
        chatWeb:
          type: boolean
          description: "Chat web du portail et boîte de réception (étape 17) ; fermé, l'espace client garde son fil de messages simple"
        assistantIa:
          type: boolean
          description: "Assistant IA (étape 18) ; exige le chat web (sinon 422 CHAT_WEB_REQUIS) ; fermer le chat ferme aussi l'assistant"
        whatsapp:
          type: boolean
          description: "WhatsApp Business (étape 20) ; exige le chat web (422 CHAT_WEB_REQUIS) et le numéro raccordé (422 CANAL_NON_RACCORDE) ; fermer le chat le ferme"
        smsEntrant:
          type: boolean
          description: "SMS entrant (étape 20) ; mêmes conditions que WhatsApp"
        barometre:
          type: boolean
          description: |
            Baromètre mensuel et recommandations (étape 23). Sans l'assistant IA, l'analyse se fait par les
            règles ; avec, les commentaires des clients passent masqués par le fournisseur d'IA.
    IndicateursPlateforme:
      type: object
      required: [du, au, banques]
      properties:
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        banques:
          type: array
          items:
            type: object
            required: [banque, total, parStatut, urgentes, tauxRespectSla, tauxResolutionPremierContact, satisfaction]
            properties:
              satisfaction:
                description: Totaux des enquêtes de la période (étape 15), jamais les commentaires ; vide sans enquête
                oneOf:
                  - type: object
                    required: [enquetes, reponses, tauxSatisfaits, nps]
                    properties:
                      enquetes: { type: integer, minimum: 0 }
                      reponses: { type: integer, minimum: 0 }
                      tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
                  - type: 'null'
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              total: { type: integer }
              parStatut:
                type: array
                items: { $ref: '#/components/schemas/Volume' }
              urgentes: { type: integer }
              tauxRespectSla: { type: [number, 'null'] }
              tauxResolutionPremierContact: { type: [number, 'null'] }
    FacturationSms:
      type: object
      required: [mois, banques]
      properties:
        mois: { type: string, examples: ['2026-09'] }
        banques:
          type: array
          items:
            type: object
            required: [banque, sms, segments, remis, echecs]
            properties:
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              sms: { type: integer, description: "SMS envoyés" }
              segments: { type: integer, description: "Segments facturés par la passerelle" }
              remis: { type: integer, minimum: 0, description: "Étape 22 : remis selon l'accusé de remise de la passerelle" }
              echecs: { type: integer, description: "Non remis : refusés par la passerelle, après 5 essais, ou selon l'accusé de remise" }
    FacturationCanaux:
      type: object
      required: [mois, banques]
      properties:
        mois: { type: string, examples: ['2026-10'] }
        banques:
          type: array
          items:
            type: object
            required: [banque, whatsappEnvoyes, whatsappFactures, whatsappEchecs, whatsappRecus, smsRecus]
            properties:
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              whatsappEnvoyes: { type: integer, minimum: 0 }
              whatsappFactures: { type: integer, minimum: 0, description: "Déclarés facturables par Meta" }
              whatsappEchecs: { type: integer, minimum: 0 }
              whatsappRecus: { type: integer, minimum: 0 }
              smsRecus: { type: integer, minimum: 0 }

    # ---- Canaux WhatsApp et SMS (étape 20) --------------------------------------------
    Raccordements:
      type: object
      description: Numéros raccordés par Makor ; le jeton WhatsApp n'est jamais renvoyé
      required: [whatsapp, sms]
      properties:
        whatsapp:
          oneOf:
            - type: object
              required: [numero, identifiant, compte]
              properties:
                numero: { type: string, examples: ['+2252722000000'] }
                identifiant: { type: string, description: "phone_number_id chez Meta" }
                compte: { type: string, description: "Compte WhatsApp Business (WABA)" }
            - type: 'null'
        sms:
          oneOf:
            - type: object
              required: [numero]
              properties:
                numero: { type: string }
            - type: 'null'
    RaccordementCanal:
      type: object
      required: [numero]
      properties:
        numero: { type: string, minLength: 8, maxLength: 24, description: "Numéro de la banque, normalisé en E.164 (+225 par défaut)" }
        identifiant: { type: string, pattern: '^[0-9]{5,30}$', description: "WhatsApp : phone_number_id (obligatoire)" }
        compte: { type: string, pattern: '^[0-9]{5,30}$', description: "WhatsApp : identifiant du compte WhatsApp Business (obligatoire)" }
        jeton: { type: string, minLength: 20, maxLength: 1000, writeOnly: true, description: "WhatsApp : jeton d'accès de la banque ; obligatoire au premier raccordement" }
    WebhookWhatsapp:
      type: object
      description: Notification de Meta (messages reçus, statuts des envois) ; les champs inconnus sont ignorés
      required: [object, entry]
      properties:
        object: { type: string }
        entry:
          type: array
          maxItems: 1000
          items: { type: object }
    RemiseSms:
      type: object
      description: Accusé de remise d'un SMS (étape 22) ; `id` ou `reference` au moins
      anyOf:
        - required: [id]
        - required: [reference]
      required: [statut]
      properties:
        id: { type: string, minLength: 1, maxLength: 128, description: "Identifiant du SMS chez la passerelle" }
        reference: { type: string, format: uuid, description: "Identifiant envoyé avec le SMS (Idempotency-Key)" }
        statut: { type: string, enum: [REMIS, NON_REMIS, EXPIRE, REJETE, EN_COURS] }
        code: { type: string, maxLength: 60, description: "Code de l'opérateur, gardé pour le diagnostic" }
        recuLe: { type: string, format: date-time }
    SmsEntrant:
      type: object
      required: [id, de, vers, texte]
      properties:
        id: { type: string, minLength: 1, maxLength: 160, description: "Identifiant du SMS chez la passerelle" }
        de: { type: string, minLength: 3, maxLength: 24, description: "Numéro du client" }
        vers: { type: string, minLength: 3, maxLength: 24, description: "Numéro de la banque" }
        texte: { type: string, maxLength: 2000 }
        recuLe: { type: string, format: date-time }

    # ---- Assistant IA (étape 18) ------------------------------------------------------
    CodeMessageAssistant:
      type: string
      description: |
        Nature d'un message de l'assistant : PRESENTATION (il se présente), SALUTATION, FAQ (réponse de la
        base de la banque), FAQ_SUITE (relance), PRECISER (demande de précisions), PROPOSER_DEPOT,
        TRANSFERT (passe la main à un conseiller), FIN, HORS_SUJET, INCOMPRIS, CODE_SECRET (rappel de ne
        jamais communiquer un code)
      enum: [PRESENTATION, SALUTATION, FAQ, FAQ_SUITE, PRECISER, PROPOSER_DEPOT, TRANSFERT, FIN, HORS_SUJET, INCOMPRIS, CODE_SECRET]
    EchangeAssistant:
      type: object
      description: Un tour de la conversation. Pour l'assistant, seul le code compte ; le texte peut être omis.
      required: [auteur]
      properties:
        auteur: { type: string, enum: [CLIENT, ASSISTANT] }
        texte: { type: string, maxLength: 2000 }
        code: { $ref: '#/components/schemas/CodeMessageAssistant' }
    TourAssistant:
      type: object
      required: [echanges]
      properties:
        echanges:
          type: array
          maxItems: 30
          description: Les échanges depuis l'ouverture, du plus ancien au plus récent ; seuls les derniers sont lus
          items: { $ref: '#/components/schemas/EchangeAssistant' }
    MessageAssistant:
      type: object
      required: [code, texte]
      properties:
        code: { $ref: '#/components/schemas/CodeMessageAssistant' }
        texte: { type: string }
    ReponseAssistant:
      type: object
      required: [messages, proposition, suggestions]
      properties:
        messages:
          type: array
          items: { $ref: '#/components/schemas/MessageAssistant' }
        proposition:
          description: Réclamation préparée, à relire et compléter par le client avant l'envoi ; vide sinon
          oneOf:
            - type: object
              required: [motif, categorieId, description]
              properties:
                motif: { type: string, enum: [DEPOT, TRANSFERT], description: "TRANSFERT : le client a demandé un conseiller" }
                categorieId: { type: [string, 'null'], format: uuid }
                description: { type: string, description: "Les mots du client, codes secrets retirés" }
            - type: 'null'
        suggestions:
          type: array
          description: Réponses proposées en un toucher
          items: { type: string, examples: ['Parler à un conseiller'] }
    CodeInterdit:
      type: string
      description: Ce que l'IA ne doit jamais écrire (décision I4)
      enum: [REMBOURSEMENT_PROMIS, DELAI_PROMIS, STATUT_ANNONCE, CONSEIL_FINANCIER, CODE_SECRET_DEMANDE]
    AlerteInterdit:
      type: object
      required: [code, libelle, extrait]
      properties:
        code: { $ref: '#/components/schemas/CodeInterdit' }
        libelle: { type: string, examples: ['promet un délai'] }
        extrait: { type: string, description: "Les mots en cause, sans accents ni majuscules", examples: ['sous 48 heures'] }
    SuggestionReponse:
      type: object
      required: [brouillon, alertes, categorie, urgente, source]
      properties:
        brouillon: { type: string }
        alertes:
          type: array
          description: Interdits trouvés dans le brouillon ; à corriger avant l'envoi
          items: { $ref: '#/components/schemas/AlerteInterdit' }
        categorie:
          description: Catégorie qui conviendrait mieux, à titre indicatif ; vide si l'actuelle convient
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        urgente: { type: boolean, description: "La réclamation paraît urgente (fraude en cours, carte volée…), à titre indicatif" }
        source: { type: string, enum: [IA, REGLES], description: "REGLES : sans fournisseur d'IA, ou s'il n'a pas répondu" }
    ReponseBanque:
      type: object
      required: [id, question, reponse, active, ordre, alertes, modifieLe]
      properties:
        id: { type: string, format: uuid }
        question: { type: string }
        reponse: { type: string }
        active: { type: boolean }
        ordre: { type: integer }
        alertes:
          type: array
          description: Interdits trouvés dans la réponse ; un avertissement, l'Admin Entreprise décide
          items: { $ref: '#/components/schemas/AlerteInterdit' }
        modifieLe: { $ref: '#/components/schemas/Horodatage' }
    EcritureReponseBanque:
      type: object
      required: [question, reponse]
      properties:
        question: { type: string, minLength: 5, maxLength: 300, examples: ['Quels sont les horaires des agences ?'] }
        reponse: { type: string, minLength: 5, maxLength: 2000 }
        active: { type: boolean, default: true }
        ordre: { type: integer, minimum: 0, maximum: 1000 }
    ModificationReponseBanque:
      type: object
      minProperties: 1
      properties:
        question: { type: string, minLength: 5, maxLength: 300 }
        reponse: { type: string, minLength: 5, maxLength: 2000 }
        active: { type: boolean }
        ordre: { type: integer, minimum: 0, maximum: 1000 }
    ConsommationIa:
      type: object
      required: [mois, fournisseur, banques]
      properties:
        mois: { type: string, examples: ['2026-10'] }
        fournisseur:
          type: object
          description: Fournisseur configuré aujourd'hui
          required: [nom, modele]
          properties:
            nom: { type: string, examples: ['regles'] }
            modele: { type: [string, 'null'] }
        banques:
          type: array
          items:
            type: object
            required: [banque, assistantIa, tours, suggestions, barometres, parIa, regles, jetonsEntree, jetonsSortie, coutUsd]
            properties:
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              assistantIa: { type: boolean }
              tours: { type: integer, minimum: 0 }
              suggestions: { type: integer, minimum: 0 }
              barometres: { type: integer, minimum: 0, description: "Analyses du baromètre mensuel (étape 23)" }
              parIa: { type: integer, minimum: 0 }
              regles: { type: integer, minimum: 0 }
              jetonsEntree: { type: integer, minimum: 0 }
              jetonsSortie: { type: integer, minimum: 0 }
              coutUsd: { type: number, minimum: 0, examples: [1.2345] }

    # ---- Baromètre (étape 23) ---------------------------------------------------------------
    MoisCivil:
      type: string
      pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$'
      examples: ['2026-09']
    ListeBarometres:
      type: object
      required: [prochainLe, donnees]
      properties:
        prochainLe: { type: string, format: date, description: "Publication du prochain baromètre (le 1er du mois prochain)" }
        donnees:
          type: array
          items: { $ref: '#/components/schemas/ResumeBarometre' }
    ResumeBarometre:
      type: object
      required: [mois, source, genereLe, reclamations, tauxRespectSla, tauxSatisfaits, recommandations, aEtudier]
      properties:
        mois: { $ref: '#/components/schemas/MoisCivil' }
        source: { $ref: '#/components/schemas/SourceAnalyse' }
        genereLe: { $ref: '#/components/schemas/Horodatage' }
        reclamations: { type: integer, minimum: 0 }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
        recommandations: { type: integer, minimum: 0, maximum: 5 }
        aEtudier: { type: integer, minimum: 0, maximum: 5, description: "Recommandations sans décision" }
    SourceAnalyse:
      type: string
      enum: [IA, REGLES]
      description: "Thèmes et recommandations rédigés par l'IA, ou par les règles de la plateforme"
    MesuresBarometre:
      type: object
      description: |
        Chiffres d'un mois civil. Réclamations : déposées pendant le mois ; résolues, délais et premier
        contact : résolues pendant le mois (minutes ouvrées) ; contestées : clôtures contestées pendant le
        mois ; réponses, satisfaits (notes 4 et 5), note et NPS : réponses reçues pendant le mois ; taux de
        réponse : enquêtes dont le délai de réponse a pris fin pendant le mois.
      required: [reclamations, urgentes, resolues, tauxRespectSla, tauxPremierContact, delaiResolutionMoyenMinutes, contestees,
        enquetes, tauxReponse, reponses, tauxSatisfaits, noteMoyenne, nps]
      properties:
        reclamations: { type: integer, minimum: 0 }
        urgentes: { type: integer, minimum: 0 }
        resolues: { type: integer, minimum: 0 }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tauxPremierContact: { type: [number, 'null'], minimum: 0, maximum: 1 }
        delaiResolutionMoyenMinutes: { type: [integer, 'null'], minimum: 0 }
        contestees: { type: integer, minimum: 0 }
        enquetes: { type: integer, minimum: 0 }
        tauxReponse: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reponses: { type: integer, minimum: 0 }
        tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
        noteMoyenne: { type: [number, 'null'], minimum: 1, maximum: 5 }
        nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
    PointTendance:
      type: object
      required: [mois, reclamations, tauxRespectSla, reponses, tauxSatisfaits, nps]
      properties:
        mois: { $ref: '#/components/schemas/MoisCivil' }
        reclamations: { type: integer, minimum: 0 }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1 }
        reponses: { type: integer, minimum: 0 }
        tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
        nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
    Irritant:
      type: object
      description: |
        Une catégorie ou une agence du mois. Score : une réclamation déposée compte 1, et chaque
        réclamation résolue hors délai, chaque clôture contestée et chaque client insatisfait (note de 1 à
        3) ajoute 1. 3 réclamations au moins pour figurer.
      required: [id, nom, score, reclamations, precedent, resolues, horsDelai, contestees, reponses, insatisfaits]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        score: { type: integer, minimum: 0 }
        reclamations: { type: integer, minimum: 0 }
        precedent: { type: integer, minimum: 0, description: "Réclamations déposées le mois précédent" }
        resolues: { type: integer, minimum: 0 }
        horsDelai: { type: integer, minimum: 0 }
        contestees: { type: integer, minimum: 0 }
        reponses: { type: integer, minimum: 0 }
        insatisfaits: { type: integer, minimum: 0 }
    ThemeBarometre:
      type: object
      required: [libelle, mentions, negatifs, positifs, exemples]
      properties:
        libelle: { type: string }
        mentions: { type: integer, minimum: 1, description: "Commentaires du mois qui en parlent" }
        negatifs: { type: integer, minimum: 0, description: "Dont notes de 1 à 3" }
        positifs: { type: integer, minimum: 0, description: "Dont notes 4 et 5" }
        exemples:
          type: array
          maxItems: 2
          items:
            type: object
            required: [numero, note, texte]
            properties:
              numero: { type: string, description: "Réclamation de ce commentaire" }
              note: { type: integer, minimum: 1, maximum: 5 }
              texte: { type: string, maxLength: 240 }
    FaitMarquant:
      type: object
      required: [sens, texte]
      properties:
        sens: { type: string, enum: [MIEUX, MOINS_BIEN] }
        texte: { type: string }
    DecisionRecommandationValeur:
      type: string
      enum: [A_ETUDIER, RETENUE, ECARTEE]
    RecommandationBarometre:
      type: object
      required: [id, ordre, titre, constat, action, categorie, priorite, source, decision, commentaire, decideePar, decideeLe]
      properties:
        id: { type: string, format: uuid }
        ordre: { type: integer, minimum: 1, maximum: 5 }
        titre: { type: string }
        constat: { type: string, description: "Ce que disent les chiffres du mois" }
        action: { type: string, description: "Ce qui est proposé" }
        categorie:
          description: Catégorie concernée, s'il y en a une
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        priorite: { type: string, enum: [HAUTE, MOYENNE] }
        source: { $ref: '#/components/schemas/SourceAnalyse' }
        decision: { $ref: '#/components/schemas/DecisionRecommandationValeur' }
        commentaire: { type: [string, 'null'] }
        decideePar:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        decideeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
    DecisionRecommandation:
      type: object
      required: [decision]
      properties:
        decision: { $ref: '#/components/schemas/DecisionRecommandationValeur' }
        commentaire: { type: [string, 'null'], maxLength: 1000 }
    Barometre:
      type: object
      required: [mois, du, au, source, genereLe, mesures, precedent, peuDeReponses, tendance, irritants, agences, themes,
        commentaires, faitsMarquants, recommandations]
      properties:
        mois: { $ref: '#/components/schemas/MoisCivil' }
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        source: { $ref: '#/components/schemas/SourceAnalyse' }
        genereLe: { $ref: '#/components/schemas/Horodatage' }
        mesures: { $ref: '#/components/schemas/MesuresBarometre' }
        precedent:
          description: Le mois précédent, s'il a eu de l'activité
          oneOf:
            - $ref: '#/components/schemas/MesuresBarometre'
            - type: 'null'
        peuDeReponses: { type: boolean, description: "Moins de 30 réponses à l'enquête : satisfaction et NPS à lire avec prudence" }
        tendance:
          type: array
          description: Les 6 derniers mois, jusqu'à celui-ci
          items: { $ref: '#/components/schemas/PointTendance' }
        irritants:
          type: array
          description: Catégories, les plus irritantes d'abord (5 au plus)
          items: { $ref: '#/components/schemas/Irritant' }
        agences:
          type: array
          description: Agences, les plus irritantes d'abord (3 au plus)
          items: { $ref: '#/components/schemas/Irritant' }
        themes:
          type: array
          items: { $ref: '#/components/schemas/ThemeBarometre' }
        commentaires: { type: integer, minimum: 0, description: "Commentaires des clients reçus pendant le mois (200 lus au plus)" }
        faitsMarquants:
          type: array
          items: { $ref: '#/components/schemas/FaitMarquant' }
        recommandations:
          type: array
          maxItems: 5
          items: { $ref: '#/components/schemas/RecommandationBarometre' }
