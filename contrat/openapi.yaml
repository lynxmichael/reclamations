      tags: [Attribution]
      operationId: modifierReglesTraitement
      summary: Régler l'attribution et l'escalade
      description: |
        Les catégories et agences citées sont réécrites ; les autres ne changent pas. Une catégorie
        sans seuil prend celui de la banque ; sans seuil nulle part, pas d'escalade à l'Admin Entreprise.
      x-roles: [ADMIN_ENTREPRISE]
      security:
