      operationId: renvoyerLienSuivi
      summary: Renvoyer au client son lien de suivi (étape 21)
      description: |
        Le client a perdu le SMS ou l'e-mail de l'accusé. Le lien part aux seules coordonnées du dossier :
        par SMS (ou sur WhatsApp, là où il écrit) et par e-mail. Réservé à l'agent assigné et au
        superviseur, à tout statut ; 3 fois par heure et par réclamation ; inscrit au journal d'audit.
      x-roles: [AGENT, SUPERVISEUR]
      x-action: renvoyerLienSuivi
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Lien renvoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LienSuiviRenvoye' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

