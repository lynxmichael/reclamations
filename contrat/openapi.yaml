              schema: { $ref: '#/components/schemas/ConversationDetail' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /banque/conversations/{id}/lecture:
    post:
      tags: [Conversations]
      operationId: marquerConversationLue
      summary: Marquer la conversation lue
      description: |
        Compte pour l'agent assigné, ou pour un superviseur si la réclamation n'est pas assignée. Sans
        effet pour un autre lecteur : un superviseur qui regarde la conversation d'un agent ne la
        marque pas lue à sa place. Répondre au client la marque lue aussi.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Lecture enregistrée (ou sans effet pour ce lecteur)
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

