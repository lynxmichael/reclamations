    get:
      tags: [Baromètre]
      operationId: listerBarometres
      summary: Baromètres publiés, du plus récent au plus ancien
      description: |
        Un baromètre par mois, publié par le worker le 1er du mois suivant (dans le fuseau de la banque)
        et figé ensuite. Le premier arrive dans les 10 minutes qui suivent l'ouverture de la fonction, pour
        le mois écoulé. Fonction ouverte par Makor (`modifierBanque`, `barometre`) : sinon 403
        FONCTION_NON_OUVERTE.
      x-roles: [SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
