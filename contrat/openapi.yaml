  # ===========================================================================
  #  Banque : tableau de bord et notifications
  # ===========================================================================
  /banque/indicateurs:
    get:
      tags: [Tableau de bord]
      operationId: lireIndicateurs
      summary: Indicateurs du §6.6 sur une période
      description: |
        Réclamations déposées pendant la période (par défaut, du début du mois courant, dans le
        fuseau de la banque, jusqu'à maintenant). Délais en minutes ouvrées. Les taux portent sur
        les réclamations résolues (et non rouvertes depuis) parmi celles de la période.
        `evolution` compte les réclamations déposées et résolues par jour, semaine ou mois (étape 9).
        `charge` compte les réclamations non clôturées à cet instant, hors période (étape 11).
        Pour un agent (étape 11), tout porte sur les réclamations qui lui sont assignées, comme sa file.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreAgence'
        - $ref: '#/components/parameters/FiltreCanal'
        - name: regroupement
          in: query
          description: Pas de la courbe d'évolution ; par défaut JOUR jusqu'à 62 jours, SEMAINE jusqu'à 26 semaines, MOIS au-delà
          schema: { $ref: '#/components/schemas/Regroupement' }
      responses:
        '200':
          description: Indicateurs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Indicateurs' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/indicateurs/agences:
    get:
      tags: [Tableau de bord]
      operationId: lireIndicateursAgences
      summary: Activité de chaque agence sur une période (étape 19)
      description: |
        Une ligne par agence : réclamations déposées pendant la période (par défaut, du début du mois
        courant à maintenant), mêmes définitions que `lireIndicateurs` ; `charge` à cet instant.
        Une ligne sans agence, en dernier, regroupe les dépôts par lien web où le client n'a pas indiqué
        d'agence. Une agence inactive sans réclamation de la période ni en cours n'apparaît pas.
      x-roles: [SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreCanal'
      responses:
        '200':
          description: Activité des agences, de la plus sollicitée à la moins sollicitée
