      description: Préfixe, fuseau, seuil d'alerte, délai de clôture et option SMS relèvent du Super Admin.
      x-roles: [ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificationApparence' }
      responses:
        '200': { $ref: '#/components/responses/Parametres' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/parametres/logo:
    put:
      tags: [Paramétrage]
      operationId: televerserLogo
      summary: Logo du portail (PNG, SVG ou WebP, 1 Mo au plus)
      x-roles: [ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      requestBody:
