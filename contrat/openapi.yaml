        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ModificationUtilisateur' }
      responses:
        '200': { $ref: '#/components/responses/UnUtilisateur' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /banque/utilisateurs/{id}/desactivation:
    post:
      tags: [Personnel]
      operationId: desactiverUtilisateur
