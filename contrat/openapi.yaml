openapi: 3.1.0
info:
  title: Plateforme de gestion des réclamations — API
  version: 1.0.0
  summary: Contrat de l'API du MVP (Makor Telecoms · Solution 1)
  description: |
    Contrat de l'API, écrit avant le code (étape 5). Le backend NestJS de l'étape 7 et le frontend
    de l'étape 8 s'y conforment ; les réponses de l'API seront validées contre ce fichier par les tests.

    ## Espaces

    | Préfixe | Qui | Authentification | La banque est connue par |
    |---|---|---|---|
    | `/public` | Client final, sans compte | aucune | le code du point de dépôt ou le jeton de suivi |
    | `/client` | Client final après code OTP | `jetonClient` (30 min) | le jeton |
    | `/auth` | Personnel | mot de passe, puis code TOTP si la double authentification est exigée ou activée (étape 19) | — |
    | `/banque` | Agent, superviseur, Admin Entreprise | `jetonPersonnel` (15 min) | le jeton |
    | `/plateforme` | Super Admin | `jetonPersonnel` | — (toutes les banques, métadonnées seulement) |

    La banque n'est jamais un paramètre libre de la requête : un agent de la banque A qui demande
    un ticket de la banque B reçoit 404.

    ## Conventions

    - Chemins et champs en français, comme le code et le modèle de données.
    - Dates au format ISO 8601 en UTC (`2026-09-25T10:00:00Z`) ; l'interface les affiche dans le
      fuseau de la banque (`fuseauHoraire` de `/banque/parametres`).
    - Identifiants UUID.
    - Listes paginées : `page` (à partir de 1) et `parPage` (100 au plus) ; réponse
      `{ donnees, pagination: { page, parPage, total } }`.
    - Erreurs au format RFC 9457 (`application/problem+json`) avec un `code` stable.
    - Les actions sur une réclamation renvoient la réclamation à jour.
    - `x-roles` indique qui peut appeler chaque opération ; `x-action` la relie à la méthode du
      service du cycle de vie (`src/application/reclamations/cycle-de-vie.ts`).
  contact:
    name: Makor Telecoms
  license:
    name: Propriétaire — Makor Telecoms
    identifier: LicenseRef-Proprietaire

servers:
  - url: https://{hote}/api/v1
    description: Production (même origine que le portail ou la console)
    variables:
      hote:
        default: console.reclamations.example
        description: Portail d'une banque (`<slug>.<domaine>`) ou console du personnel (`console.<domaine>`)
  - url: http://localhost:3000/api/v1
    description: Développement

tags:
  - name: Santé
    description: Supervision
  - name: Dépôt et suivi
    description: Portail public du client final (QR code, lien de suivi, code OTP)
  - name: Espace client
    description: Réclamations du client après vérification du code OTP
  - name: Authentification
    description: Connexion du personnel, double authentification (TOTP), sessions, « Mon compte » (étape 19)
  - name: Réclamations
    description: Files, traitement, clôture (agent, superviseur)
  - name: Tableau de bord
    description: Indicateurs du §6.6, activité des agences (étape 19) et export
  - name: Notifications
    description: Notifications in-app du personnel
  - name: Paramétrage
    description: Catégories, agences, points de dépôt, horaires, jours fériés, apparence (Admin Entreprise)
  - name: Personnel
    description: Comptes du personnel et équipes (Admin Entreprise)
  - name: Audit
    description: Journal d'audit chaîné
  - name: Plateforme
    description: Banques, plans, statistiques et audit de toutes les banques (Super Admin)
  - name: Satisfaction
    description: Enquête de satisfaction après la clôture, ouverte par le lien de suivi (phase 2, étape 15)
  - name: Attribution
    description: Groupes d'agents, absences, attribution automatique ou suggérée, escalade à l'Admin Entreprise (phase 2, étape 16)
  - name: Conversations
    description: Chat web du portail et boîte de réception des agents (phase 2, étape 17)
  - name: Assistant IA
    description: Assistant automatique du portail, base de réponses de la banque, brouillons pour les agents, consommation (phase 2, étape 18)
  - name: Canaux
    description: Messages des clients reçus sur WhatsApp et par SMS, statuts des envois WhatsApp (phase 2, étape 20)
  - name: Baromètre
    description: Baromètre mensuel de l'expérience client et recommandations, par banque (phase 2, étape 23)

paths:
  # ===========================================================================
  #  Santé
  # ===========================================================================
  /sante:
    get:
      tags: [Santé]
      operationId: lireSante
      summary: État de l'API, de ses dépendances, du worker, des envois et du disque
      description: |
        Point de supervision (étape 10). **503** seulement si l'API ne peut pas servir (base ou
        Redis injoignable) : c'est ce que regarde le contrôle de santé du conteneur. Un worker
        arrêté, des e-mails ou SMS en attente depuis plus de 10 minutes ou un disque presque plein
        (moins de 5 % ou de 2 Gio libres) passent `statut` à `degrade` avec un **200** : la
        supervision externe surveille `"statut":"ok"` et alerte sans que le site soit coupé.
      x-roles: [PUBLIC]
      security: []
      responses:
        '200':
          description: API disponible ; `statut` dit si tout va bien
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sante' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '503':
          description: La base ou Redis ne répond pas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sante' }

  # ===========================================================================
  #  Public : dépôt et suivi
  # ===========================================================================
  /public/points-depot/{code}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireFormulaireDepot
      summary: Formulaire de dépôt d'un point (QR code ou lien)
      description: Le code du point suffit à identifier la banque, l'agence et le canal (§6.1).
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/CodePoint'
      responses:
        '200':
          description: Tout ce qu'il faut pour afficher le formulaire
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormulaireDepot' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/defi-anti-robot:
    get:
      tags: [Dépôt et suivi]
      operationId: lireDefiAntiRobot
      summary: Défi anti-robot à résoudre avant un dépôt ou une demande de code
      description: |
        Preuve de travail (étape 11), sur le principe d'ALTCHA : trouver l'entier `nombre`, entre 0 et
        `maximum`, tel que SHA-256(`sel` + `nombre`), en hexadécimal, soit égal à `defi`. Le jeton
        à envoyer (`jetonAntiRobot`) est le JSON `{"sel", "nombre", "signature"}` encodé en base64url.
        Un jeton sert une seule fois et expire avec le défi (10 minutes). La difficulté double par
        tranche de 10 défis demandés par une même adresse IP en 10 minutes, jusqu'à 16 fois la
        difficulté de base. Le portail résout le défi en arrière-plan pendant la saisie.
      x-roles: [PUBLIC]
      security: []
      responses:
        '200':
          description: Défi signé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DefiAntiRobot' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/points-depot/{code}/reclamations:
    post:
      tags: [Dépôt et suivi]
      operationId: deposerReclamation
      summary: Déposer une réclamation
      description: |
        Crée le ticket (numéro `PRÉFIXE-AAAA-NNNNNN`), démarre le SLA et envoie l'accusé de réception
        par e-mail et SMS. Idempotent avec l'en-tête `Idempotency-Key` : la même clé renvoie le même
        accusé sans créer de doublon. Limité à 5 dépôts par heure et par adresse IP, 3 par téléphone.
        Exige un jeton anti-robot (`lireDefiAntiRobot`) : absent, 400 ; faux, expiré ou déjà
        utilisé, 422 `ANTI_ROBOT_REFUSE`. Un renvoi avec la même clé d'idempotence ne le consomme pas.
      x-roles: [PUBLIC]
      x-action: deposer
      security: []
      parameters:
        - $ref: '#/components/parameters/CodePoint'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DepotReclamation' }
            encoding:
              fichiers:
                contentType: image/jpeg, image/png, image/webp, application/pdf
      responses:
        '201':
          description: Réclamation enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccuseDepot' }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/points-depot/{code}/assistant:
    post:
      tags: [Assistant IA]
      operationId: converserAvecAssistant
      summary: Un tour de l'assistant automatique du portail
      description: |
        Sans état côté serveur : le portail renvoie à chaque tour les derniers échanges (textes du client,
        codes des messages de l'assistant). Sans message du client, l'assistant se présente comme tel et
        dit comment joindre une personne (décision I3).
        L'IA ne fait que trier le dernier message (intention, question fréquente, catégorie), après
        masquage des numéros de carte et de compte, IBAN, téléphones, e-mails et codes (décision I5).
        Ce que lit le client vient des textes fixes de l'assistant et des réponses validées par la
        banque (décision I4) : il ne promet rien, ne change aucun statut et ne dépose rien lui-même.
        Une `proposition` prépare le dépôt, que le client relit, complète et envoie avec
        `deposerReclamation`. Sans fournisseur d'IA, s'il ne répond pas ou si le plafond quotidien de la
        banque est atteint, des règles de mots-clés prennent le relais. Assistant fermé : 403
        FONCTION_NON_OUVERTE. Limité à 40 tours par 10 minutes et par adresse IP.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/CodePoint'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TourAssistant' }
      responses:
        '200':
          description: Réponse de l'assistant
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReponseAssistant' }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireSuivi
      summary: Chronologie horodatée d'une réclamation
      description: Ouverte par le lien de suivi. Statuts et dates seulement ; le détail exige le code OTP.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      responses:
        '200':
          description: Chronologie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiviPublic' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}/otp:
    post:
      tags: [Dépôt et suivi]
      operationId: demanderCodeOtp
      summary: Recevoir un code OTP par SMS ou e-mail
      description: |
        Code à 6 chiffres, valable 10 minutes. 3 envois par heure et par réclamation. Exige un jeton
        anti-robot (`lireDefiAntiRobot`), comme le dépôt : chaque SMS est facturé à la banque.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemandeOtp' }
      responses:
        '202':
          description: Code envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpEnvoye' }
        '400': { $ref: '#/components/responses/Invalide' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}/otp/verification:
    post:
      tags: [Dépôt et suivi]
      operationId: verifierCodeOtp
      summary: Vérifier le code OTP et ouvrir une session client
      description: 5 essais par code. La session client dure 30 minutes et ne donne accès qu'aux réclamations de ce client dans cette banque.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationOtp' }
      responses:
        '200':
          description: Session client ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}/avis:
    get:
      tags: [Satisfaction]
      operationId: lireAvis
      summary: Enquête de satisfaction d'une réclamation clôturée
      description: |
        Ouverte par le lien du message de clôture ou par le bouton de la page de suivi (étape 15).
        404 si la réclamation n'a pas d'enquête : banque sans enquêtes, réclamation pas encore
        clôturée, ou clôture forcée.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      responses:
        '200':
          description: Enquête et, si elle est donnée, la réponse du client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avis' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
    post:
      tags: [Satisfaction]
      operationId: donnerAvis
      summary: Réponse du client à l'enquête de satisfaction
      description: |
        Une seule réponse, dans les 7 jours qui suivent la clôture ; elle ne se modifie plus
        (409 AVIS_DEJA_DONNE). Après 7 jours : 422 ENQUETE_TERMINEE.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReponseAvis' }
      responses:
        '200':
          description: Réponse enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Avis' }
        '400': { $ref: '#/components/responses/Invalide' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/banques/{slug}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireBanquePortail
      summary: Nom et couleurs de la banque du portail (étape 21)
      description: Pour l'accueil du portail et « Retrouver mes réclamations », sans QR code ni lien de suivi.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      responses:
        '200':
          description: La banque
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BanquePublique' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/banques/{slug}/acces:
    post:
      tags: [Dépôt et suivi]
      operationId: demanderCodeAcces
      summary: Retrouver ses réclamations — recevoir un code (étape 21)
      description: |
        Le client a perdu son lien de suivi : il donne son téléphone ou son e-mail. S'il a des réclamations
        dans cette banque, un code à 6 chiffres part à ce numéro ou à cette adresse (10 minutes). La réponse
        est la même dans tous les cas : elle ne dit pas si le numéro est connu. Exige un défi anti-robot ;
        3 demandes par heure et par numéro ou adresse.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemandeAcces' }
      responses:
        '200':
          description: Code envoyé s'il y a des réclamations à ce numéro ou à cette adresse
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpEnvoye' }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/banques/{slug}/acces/verification:
    post:
      tags: [Dépôt et suivi]
      operationId: verifierCodeAcces
      summary: Retrouver ses réclamations — vérifier le code (étape 21)
      description: |
        Bon code : la session de l'espace client (30 minutes), avec toutes ses réclamations dans cette
        banque. Un numéro inconnu se comporte comme un code faux. 5 essais par code, et par numéro ou
        adresse en 10 minutes.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/Slug'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationAcces' }
      responses:
        '200':
          description: Session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/logos/{fichier}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireLogo
      summary: Logo d'une banque (adresse donnée par logoUrl)
      description: Le nom du fichier est aléatoire et change à chaque nouveau logo ; l'image peut donc être gardée en cache un an.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - name: fichier
          in: path
          required: true
          schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}\.(png|svg|webp)$', examples: ['Xq3h0Zk8b2mN4pLs.png'] }
      responses:
        '200':
          description: Image du logo
          content:
            image/png:
              schema: { type: string, format: binary }
            image/svg+xml:
              schema: { type: string }
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  # ===========================================================================
  #  Espace client (après OTP)
  # ===========================================================================
  /client/reclamations:
    get:
      tags: [Espace client]
      operationId: listerMesReclamations
      summary: Historique des réclamations du client dans cette banque
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      responses:
        '200':
          description: Réclamations du client, les plus récentes d'abord
          content:
            application/json:
              schema:
                type: object
                required: [donnees]
                properties:
                  donnees:
                    type: array
                    items: { $ref: '#/components/schemas/ReclamationClientResume' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /client/reclamations/{id}:
    get:
      tags: [Espace client]
      operationId: lireMaReclamation
      summary: Détail d'une réclamation du client
      description: Messages échangés (jamais les notes internes), pièces jointes visibles, chronologie et actions possibles.
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /client/reclamations/{id}/messages:
    post:
      tags: [Espace client]
      operationId: envoyerMessageClient
      summary: Écrire à la banque (avec pièces jointes)
      description: |
        Si la banque attendait une réponse, le ticket repasse « En cours » et le chrono SLA reprend.
        Chat web ouvert (étape 17) : le message entre dans la conversation de la réclamation ; l'agent
        n'est alerté qu'au premier message non lu d'une rafale. 30 messages au plus par réclamation
        et par 10 minutes.
      x-roles: [CLIENT]
      x-action: messageDuClient
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/NouveauMessage' }
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /client/reclamations/{id}/conversation:
    get:
      tags: [Conversations]
      operationId: lireConversationClient
      summary: Chat de la réclamation — nouveaux messages et état, relu toutes les 5 secondes
      description: |
        Messages publics de la réclamation écrits à partir de `apres` (tous sans `apres`), disponibilité
        de la banque et sa dernière lecture. Réservé aux banques dont Makor a ouvert le chat web
        (décision I2) : sinon 403 FONCTION_NON_OUVERTE. Le client ne voit jamais le nom de l'agent.
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/Apres'
      responses:
        '200':
          description: Nouveaux messages et état du chat
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /client/reclamations/{id}/conversation/lecture:
    post:
      tags: [Conversations]
      operationId: marquerConversationLueClient
      summary: Le chat est à l'écran — messages lus, client en ligne
      description: |
        À appeler à l'ouverture du chat, à l'arrivée d'une réponse de la banque et chaque minute tant que
        le chat reste à l'écran. Le premier appel ouvre la conversation. Une réponse lue dans les
        2 minutes ne donne lieu à aucun e-mail ni SMS.
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Lecture enregistrée
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /client/reclamations/{id}/confirmation:
