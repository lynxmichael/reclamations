        L'Admin Entreprise décide de chaque recommandation (`RETENUE`, `ECARTEE`, ou `A_ETUDIER` pour
        revenir sur sa décision), avec un commentaire facultatif (l'action prévue, la raison). Seule la
        décision change : le baromètre et le texte des recommandations restent tels que publiés. Chaque
        décision est inscrite au journal d'audit.
      x-roles: [ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Mois'
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRecommandation' }
      responses:
        '200':
          description: Recommandation décidée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RecommandationBarometre' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
