        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /banque/reclamations/{id}/rattachement:
    post:
      tags: [Réclamations]
      operationId: rattacherReclamation
      summary: Rattacher un doublon à la réclamation principale du même client (étape 21)
      description: |
        La réclamation `id` est un doublon de `principaleId` : même client, toutes deux non clôturées.
        Elle est clôturée (motif « Doublon », précision « Rattachée à … »), son SLA s'arrête, sans
        enquête de satisfaction ; elle garde ses messages et pièces jointes, consultables depuis la
        principale. Le client reçoit un seul message, avec le lien de suivi de la principale. Réservé au
        superviseur, ou à l'agent assigné aux deux. Une autre cliente, la même réclamation, une principale
        clôturée ou elle-même rattachée : 422 `RATTACHEMENT_IMPOSSIBLE`.
      x-roles: [AGENT, SUPERVISEUR]
      x-action: rattacher
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Rattachement' }
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }

