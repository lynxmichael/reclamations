      tags: [Réclamations]
      operationId: renvoyerMessage
      summary: Renvoyer au client un message non remis (étape 22)
      description: |
        Le même message, à la même coordonnée (celle du dossier). Seulement s'il est non remis et que son
        texte est gardé (accusé, réponse, résolution, clôture, lien de suivi…), pas un code ni un message
