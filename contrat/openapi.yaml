openapi: 3.1.0
info:
  title: Plateforme de gestion des réclamations — API
  version: 1.0.0
  summary: Contrat de l'API du MVP (Makor Telecoms · Solution 1)
  description: |
    Contrat de l'API, écrit avant le code (étape 5). Le backend NestJS de l'étape 7 et le frontend
    de l'étape 8 s'y conforment ; les réponses de l'API seront validées contre ce fichier par les tests.

    ## Espaces

    | Préfixe | Qui | Authentification | La banque est connue par |
    |---|---|---|---|
    | `/public` | Client final, sans compte | aucune | le code du point de dépôt ou le jeton de suivi |
    | `/client` | Client final après code OTP | `jetonClient` (30 min) | le jeton |
    | `/auth` | Personnel | mot de passe + TOTP | — |
    | `/banque` | Agent, superviseur, Admin Entreprise | `jetonPersonnel` (15 min) | le jeton |
    | `/plateforme` | Super Admin | `jetonPersonnel` | — (toutes les banques, métadonnées seulement) |

    La banque n'est jamais un paramètre libre de la requête : un agent de la banque A qui demande
    un ticket de la banque B reçoit 404.

    ## Conventions

    - Chemins et champs en français, comme le code et le modèle de données.
    - Dates au format ISO 8601 en UTC (`2026-09-25T10:00:00Z`) ; l'interface les affiche dans le
      fuseau de la banque (`fuseauHoraire` de `/banque/parametres`).
    - Identifiants UUID.
    - Listes paginées : `page` (à partir de 1) et `parPage` (100 au plus) ; réponse
      `{ donnees, pagination: { page, parPage, total } }`.
    - Erreurs au format RFC 9457 (`application/problem+json`) avec un `code` stable.
    - Les actions sur une réclamation renvoient la réclamation à jour.
    - `x-roles` indique qui peut appeler chaque opération ; `x-action` la relie à la méthode du
      service du cycle de vie (`src/application/reclamations/cycle-de-vie.ts`).
  contact:
    name: Makor Telecoms
  license:
    name: Propriétaire — Makor Telecoms
    identifier: LicenseRef-Proprietaire

servers:
  - url: https://{hote}/api/v1
    description: Production (même origine que le portail ou la console)
    variables:
      hote:
        default: console.reclamations.example
        description: Portail d'une banque (`<slug>.<domaine>`) ou console du personnel (`console.<domaine>`)
  - url: http://localhost:3000/api/v1
    description: Développement

tags:
  - name: Santé
    description: Supervision
  - name: Dépôt et suivi
    description: Portail public du client final (QR code, lien de suivi, code OTP)
  - name: Espace client
    description: Réclamations du client après vérification du code OTP
  - name: Authentification
    description: Connexion du personnel, TOTP, sessions
  - name: Réclamations
    description: Files, traitement, clôture (agent, superviseur)
  - name: Tableau de bord
    description: Indicateurs du §6.6 et export
  - name: Notifications
    description: Notifications in-app du personnel
  - name: Paramétrage
    description: Catégories, agences, points de dépôt, horaires, jours fériés, apparence (Admin Entreprise)
  - name: Personnel
    description: Comptes du personnel et équipes (Admin Entreprise)
  - name: Audit
    description: Journal d'audit chaîné
  - name: Plateforme
    description: Banques, plans, statistiques et audit de toutes les banques (Super Admin)

paths:
  # ===========================================================================
  #  Santé
  # ===========================================================================
  /sante:
    get:
      tags: [Santé]
      operationId: lireSante
      summary: État de l'API, de la base et de Redis
      x-roles: [PUBLIC]
      security: []
      responses:
        '200':
          description: Service opérationnel
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sante' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }
        '503':
          description: Une dépendance ne répond pas
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Sante' }

  # ===========================================================================
  #  Public : dépôt et suivi
  # ===========================================================================
  /public/points-depot/{code}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireFormulaireDepot
      summary: Formulaire de dépôt d'un point (QR code ou lien)
      description: Le code du point suffit à identifier la banque, l'agence et le canal (§6.1).
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/CodePoint'
      responses:
        '200':
          description: Tout ce qu'il faut pour afficher le formulaire
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FormulaireDepot' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/points-depot/{code}/reclamations:
    post:
      tags: [Dépôt et suivi]
      operationId: deposerReclamation
      summary: Déposer une réclamation
      description: |
        Crée le ticket (numéro `PRÉFIXE-AAAA-NNNNNN`), démarre le SLA et envoie l'accusé de réception
        par e-mail et SMS. Idempotent avec l'en-tête `Idempotency-Key` : la même clé renvoie le même
        accusé sans créer de doublon. Limité à 5 dépôts par heure et par adresse IP, 3 par téléphone.
      x-roles: [PUBLIC]
      x-action: deposer
      security: []
      parameters:
        - $ref: '#/components/parameters/CodePoint'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/DepotReclamation' }
            encoding:
              fichiers:
                contentType: image/jpeg, image/png, image/webp, application/pdf
      responses:
        '201':
          description: Réclamation enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccuseDepot' }
        '400': { $ref: '#/components/responses/Invalide' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}:
    get:
      tags: [Dépôt et suivi]
      operationId: lireSuivi
      summary: Chronologie horodatée d'une réclamation
      description: Ouverte par le lien de suivi. Statuts et dates seulement ; le détail exige le code OTP.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      responses:
        '200':
          description: Chronologie
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuiviPublic' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}/otp:
    post:
      tags: [Dépôt et suivi]
      operationId: demanderCodeOtp
      summary: Recevoir un code OTP par SMS ou e-mail
      description: Code à 6 chiffres, valable 10 minutes. 3 envois par heure et par réclamation.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemandeOtp' }
      responses:
        '202':
          description: Code envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OtpEnvoye' }
        '400': { $ref: '#/components/responses/Invalide' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /public/suivi/{jetonSuivi}/otp/verification:
    post:
      tags: [Dépôt et suivi]
      operationId: verifierCodeOtp
      summary: Vérifier le code OTP et ouvrir une session client
      description: 5 essais par code. La session client dure 30 minutes et ne donne accès qu'aux réclamations de ce client dans cette banque.
      x-roles: [PUBLIC]
      security: []
      parameters:
        - $ref: '#/components/parameters/JetonSuivi'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationOtp' }
      responses:
        '200':
          description: Session client ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SessionClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  # ===========================================================================
  #  Espace client (après OTP)
  # ===========================================================================
  /client/reclamations:
    get:
      tags: [Espace client]
      operationId: listerMesReclamations
      summary: Historique des réclamations du client dans cette banque
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      responses:
        '200':
          description: Réclamations du client, les plus récentes d'abord
          content:
            application/json:
              schema:
                type: object
                required: [donnees]
                properties:
                  donnees:
                    type: array
                    items: { $ref: '#/components/schemas/ReclamationClientResume' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /client/reclamations/{id}:
    get:
      tags: [Espace client]
      operationId: lireMaReclamation
      summary: Détail d'une réclamation du client
      description: Messages échangés (jamais les notes internes), pièces jointes visibles, chronologie et actions possibles.
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Détail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /client/reclamations/{id}/messages:
    post:
      tags: [Espace client]
      operationId: envoyerMessageClient
      summary: Écrire à la banque (avec pièces jointes)
      description: Si la banque attendait une réponse, le ticket repasse « En cours » et le chrono SLA reprend.
      x-roles: [CLIENT]
      x-action: messageDuClient
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/NouveauMessage' }
      responses:
        '201':
          description: Message envoyé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /client/reclamations/{id}/confirmation:
    post:
      tags: [Espace client]
      operationId: confirmerResolution
      summary: Confirmer la résolution (clôture)
      x-roles: [CLIENT]
      x-action: confirmer
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Réclamation clôturée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }

  /client/reclamations/{id}/contestation:
    post:
      tags: [Espace client]
      operationId: contesterResolution
      summary: Contester la résolution (réouverture)
      description: Possible jusqu'à la clôture automatique (5 jours après la résolution par défaut).
      x-roles: [CLIENT]
      x-action: contester
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Contestation' }
      responses:
        '200':
          description: Réclamation rouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReclamationClient' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }

  /client/reclamations/{id}/pieces-jointes/{pieceId}:
    get:
      tags: [Espace client]
      operationId: telechargerPieceJointeClient
      summary: Télécharger une pièce jointe visible du client
      x-roles: [CLIENT]
      security:
        - jetonClient: []
      parameters:
        - $ref: '#/components/parameters/Id'
        - $ref: '#/components/parameters/PieceId'
      responses:
        '200': { $ref: '#/components/responses/Fichier' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }

  # ===========================================================================
  #  Authentification du personnel
  # ===========================================================================
  /auth/connexion:
    post:
      tags: [Authentification]
      operationId: connexion
      summary: Première étape de connexion (e-mail et mot de passe)
      description: |
        Renvoie toujours une étape TOTP : la double authentification est obligatoire pour tout le personnel.
        Après 5 échecs, le compte est verrouillé 15 minutes. 10 tentatives par 15 minutes et par adresse IP.
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connexion' }
      responses:
        '200':
          description: Mot de passe accepté, code TOTP attendu
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtapeTotp' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '423': { $ref: '#/components/responses/Verrouille' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/connexion/totp:
    post:
      tags: [Authentification]
      operationId: validerCodeTotp
      summary: Seconde étape de connexion (code TOTP)
      description: Ouvre la session. Le refresh token est posé en cookie `rt` (httpOnly, Secure, SameSite=Strict).
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeTotp' }
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/invitation/acceptation:
    post:
      tags: [Authentification]
      operationId: accepterInvitation
      summary: Accepter une invitation (choix du mot de passe, puis enrôlement TOTP)
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionMotDePasse' }
      responses:
        '200':
          description: Mot de passe enregistré ; le TOTP doit maintenant être activé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolementTotp' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/totp/activation:
    post:
      tags: [Authentification]
      operationId: activerTotp
      summary: Activer le TOTP avec un premier code, et ouvrir la session
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeTotp' }
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/rafraichissement:
    post:
      tags: [Authentification]
      operationId: rafraichirSession
      summary: Nouveau jeton d'accès à partir du cookie de rafraîchissement
      description: Le refresh token change à chaque appel. Réutiliser un ancien jeton révoque toute la session.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - cookieRafraichissement: []
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/deconnexion:
    post:
      tags: [Authentification]
      operationId: deconnexion
      summary: Fermer la session (révoque le refresh token)
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '204':
          description: Session fermée, cookie effacé
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/mot-de-passe/oubli:
    post:
      tags: [Authentification]
      operationId: demanderReinitialisation
      summary: Recevoir un lien de réinitialisation par e-mail
      description: Répond toujours 202, que l'adresse existe ou non.
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Demande prise en compte
        '400': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/mot-de-passe/reinitialisation:
    post:
      tags: [Authentification]
      operationId: reinitialiserMotDePasse
      summary: Choisir un nouveau mot de passe avec le lien reçu
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionMotDePasse' }
      responses:
        '204':
          description: Mot de passe changé ; toutes les sessions sont révoquées
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/moi:
    get:
      tags: [Authentification]
      operationId: lireMoi
      summary: Utilisateur connecté
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Moi' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  # ===========================================================================
  #  Banque : réclamations
  # ===========================================================================
  /banque/reclamations:
    get:
      tags: [Réclamations]
      operationId: listerReclamations
      summary: Files de traitement et recherche
      description: |
        Files du §6.2 : reçues (non assignées), assignées à moi, urgentes, en retard (SLA dépassé), escaladées.
        Un agent ne voit que les tickets qui lui sont assignés ; superviseur et Admin Entreprise voient toute la banque.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/File'
        - $ref: '#/components/parameters/FiltreStatut'
        - $ref: '#/components/parameters/FiltrePriorite'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreAgence'
        - $ref: '#/components/parameters/FiltreCanal'
        - $ref: '#/components/parameters/FiltreAgent'
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/Recherche'
        - $ref: '#/components/parameters/TriReclamations'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Page de réclamations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageReclamations' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/reclamations/export:
    get:
      tags: [Tableau de bord]
      operationId: exporterReclamations
      summary: Export CSV des réclamations filtrées
      description: Mêmes filtres que la liste. CSV UTF-8 avec BOM, séparateur « ; » (lisible directement dans Excel en français).
      x-roles: [SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/File'
        - $ref: '#/components/parameters/FiltreStatut'
        - $ref: '#/components/parameters/FiltrePriorite'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreAgence'
        - $ref: '#/components/parameters/FiltreCanal'
        - $ref: '#/components/parameters/FiltreAgent'
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/Recherche'
      responses:
        '200':
          description: Fichier CSV
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="reclamations-2026-09-25.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/reclamations/{id}:
    get:
      tags: [Réclamations]
      operationId: lireReclamation
      summary: Détail d'une réclamation
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /banque/reclamations/{id}/prise-en-charge:
    post:
      tags: [Réclamations]
      operationId: prendreEnCharge
      summary: Prendre en charge (Ouverte → En cours)
      x-roles: [AGENT, SUPERVISEUR]
      x-action: prendreEnCharge
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
