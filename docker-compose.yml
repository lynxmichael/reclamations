# Environnement de développement — Plateforme de gestion des réclamations
#
#   docker compose up -d                  PostgreSQL 16, Redis 8, Mailpit, l'API et le worker, puis
#                                         les écrans (installation et migrations d'abord, automatiquement)
#   docker compose exec api npm run semer jeu de démonstration : deux banques, leur personnel
#   docker compose exec api npm run totp -- <e-mail>   code TOTP d'un compte de démonstration
#   docker compose logs -f api worker     journaux (les SMS de développement s'y affichent)
#
#     Console du personnel          : http://localhost:5173
#     Portail d'une banque          : http://alpha.localhost:5174/d/<code du QR>  (slug de la banque)
#     API et documentation Swagger  : http://localhost:3000/api/docs
#     E-mails envoyés (Mailpit)     : http://localhost:8025
#
#   docker compose run --rm verification  contrat, tests unitaires, vérifications sur PostgreSQL
#                                         (étapes 2 à 4), tests de bout en bout de l'API (étape 7)
#   docker compose run --rm maquettes     écrans : types, tests, construction des deux applications,
#                                         de docs/maquettes/ et de docs/demo/
#   docker compose run --rm navigateur    écrans dans Chromium (Playwright) sur l'API réelle (étape 8)
#   docker compose up -d swagger          documentation du contrat seule : http://localhost:8081
#   docker compose down                   arrête (ajouter -v pour effacer les données)
#
# La production (VPS Contabo) a son propre fichier : docker-compose.prod.yml.

name: reclamations

x-frontend: &frontend
  image: node:22-bookworm
  working_dir: /depot/frontend
  volumes:
    - ./:/depot
    - frontend_node_modules:/depot/frontend/node_modules

x-backend: &backend
  image: node:22-bookworm
  working_dir: /depot/backend
  environment: &environnement-backend
    # Propriétaire des tables : migrations seulement
    DATABASE_URL: postgresql://${POSTGRES_USER:-reclamations}:${POSTGRES_PASSWORD:-reclamations}@postgres:5432/reclamations_dev
    # Rôle de l'application, sans droit propre (Row-Level Security)
    APP_DATABASE_URL: postgresql://reclamations_app:${APP_DB_PASSWORD:-reclamations_app}@postgres:5432/reclamations_dev
    REDIS_URL: redis://redis:6379
    # Secrets de DÉVELOPPEMENT (refusés en production)
    JWT_SECRET: developpement-uniquement-changer-en-production-0123456789
    CLE_CHIFFREMENT_TOTP: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
    CLE_OTP: developpement-uniquement-cle-otp-0123456789abcdef
    COOKIE_SECURE: "false"
    SMTP_URL: smtp://mailpit:1025
    STOCKAGE_DOSSIER: /donnees/fichiers
    # Adresses des écrans dans les e-mails et SMS : serveurs Vite ci-dessous
    URL_CONSOLE: http://localhost:${CONSOLE_PORT:-5173}
    URL_PORTAIL: http://{slug}.localhost:${PORTAIL_PORT:-5174}
    # Priment sur un éventuel backend/.env (lancement hors Docker), qui ne sert pas ici
    PORT: "3000"
    # Rechargement à chaque modification : sous Windows (Docker Desktop), les changements du dossier
    # partagé n'arrivent pas dans le conteneur ; on les détecte en relisant les fichiers chaque seconde
    CHOKIDAR_USEPOLLING: "true"
    CHOKIDAR_INTERVAL: "1000"
  volumes:
    - ./:/depot
    - backend_node_modules:/depot/backend/node_modules
    - fichiers_dev:/donnees/fichiers

services:
  postgres:
    image: postgres:16-bookworm
    restart: unless-stopped
    environment:
      # Propriétaire des tables : sert aux migrations, jamais à l'application
      POSTGRES_USER: ${POSTGRES_USER:-reclamations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-reclamations}
      POSTGRES_DB: reclamations_dev
      # Mot de passe du rôle de connexion de l'application (reclamations_app)
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:-reclamations_app}
      # Tri et comparaisons en français (é, è, ç…) grâce à ICU
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR --locale=C.UTF-8
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Scripts exécutés une seule fois, à la création du volume : bases et rôles
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d reclamations_dev"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Files d'attente BullMQ (envois, alertes SLA, clôture automatique) à partir de l'étape 4
  redis:
    image: redis:8-alpine
    restart: unless-stopped
    # noeviction : BullMQ exige que Redis ne supprime jamais une clé pour libérer de la mémoire
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # E-mails de développement : tout ce que le worker envoie arrive ici (http://localhost:8025)
  mailpit:
    image: axllent/mailpit:v1.31.1
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"

  # Installation du backend (npm ci, client Prisma), rôle de connexion de l'application (créé ou
  # réaligné sur APP_DB_PASSWORD, même si le volume PostgreSQL est ancien), puis migrations, avant l'API.
  # npm ci seulement si package-lock.json (ou Node) a changé depuis la dernière installation (repère
  # dans node_modules) : un « docker compose up -d » ordinaire ne vide pas les modules de l'API et du
  # worker en marche. Le client Prisma est toujours régénéré (schéma modifié, dossier du dépôt remplacé).
  backend-installation:
    <<: *backend
    depends_on:
      postgres:
        condition: service_healthy
    command: >-
      sh -c 'repere="node_modules/.installation-$$( (node -v; cat package-lock.json) | sha256sum | cut -c1-16)";
      if [ -f "$$repere" ]; then echo "Dépendances du backend à jour" && npx prisma generate;
      else npm ci --no-audit --no-fund && touch "$$repere"; fi
      && npm run -s roles:dev && npx prisma migrate deploy'

  # API NestJS (étape 7), rechargée à chaque modification du code
  api:
    <<: *backend
    restart: unless-stopped
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      backend-installation:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: npm run dev

  # Worker : tâches SLA chaque minute, envoi des e-mails (Mailpit) et des SMS (journal)
  worker:
    <<: *backend
    restart: unless-stopped
    depends_on:
      backend-installation:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started
    command: npm run dev:worker

  # Installation des écrans (npm ci), avant les serveurs Vite ; seulement si package-lock.json (ou
  # Node) a changé depuis la dernière installation, comme pour le backend
  frontend-installation:
    <<: *frontend
    command: >-
      sh -c 'repere="node_modules/.installation-$$( (node -v; cat package-lock.json) | sha256sum | cut -c1-16)";
      if [ -f "$$repere" ]; then echo "Dépendances des écrans à jour";
      else npm ci --no-audit --no-fund && touch "$$repere"; fi'

  # Console du personnel (étape 8), rechargée à chaque modification ; /api vers l'API
  console:
    <<: *frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      # Dépendances préparées par Vite hors de node_modules : une réinstallation ne les efface pas
      VITE_CACHE_DIR: /tmp/vite
      # Modifications du code détectées sous Windows aussi (voir l'API)
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${CONSOLE_PORT:-5173}:5173"
    depends_on:
      frontend-installation:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: npm run dev:console

  # Portail client (étape 8) : http://<slug>.localhost:5174 ; /api vers l'API
  portail:
    <<: *frontend
    restart: unless-stopped
    environment:
      API_URL: http://api:3000
      # Dépendances préparées par Vite hors de node_modules : une réinstallation ne les efface pas
      VITE_CACHE_DIR: /tmp/vite
      # Modifications du code détectées sous Windows aussi (voir l'API)
      CHOKIDAR_USEPOLLING: "true"
      CHOKIDAR_INTERVAL: "1000"
    ports:
      - "${PORTAIL_PORT:-5174}:5174"
    depends_on:
      frontend-installation:
        condition: service_completed_successfully
      api:
        condition: service_started
    command: npm run dev:portail

  # Outil ponctuel (profil « outils ») : lancé seulement par `docker compose run --rm verification`.
  # Vérifie le contrat d'API (étape 5), réinitialise la base jetable reclamations_verif, y applique
  # les migrations, lance les tests unitaires, puis les vérifications sur PostgreSQL :
  # intégrité (étape 2), sécurité (étape 3), cycle de vie et SLA (étape 4) ; enfin les tests de bout
  # en bout de l'API (étape 7) sur une base recréée, reclamations_e2e, et la base 15 de Redis.
  verification:
    <<: *backend
    profiles: ["outils"]
    environment:
      <<: *environnement-backend
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclamations}:${POSTGRES_PASSWORD:-reclamations}@postgres:5432/reclamations_verif
      APP_DATABASE_URL: postgresql://reclamations_app:${APP_DB_PASSWORD:-reclamations_app}@postgres:5432/reclamations_verif
    # Ses propres node_modules : son « npm ci » ne doit pas vider ceux de l'API et du worker en marche
    volumes:
      - ./:/depot
      - verification_node_modules:/depot/backend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "npm ci --no-audit --no-fund
      && npm run contrat:verifier
      && npm run typecheck
      && npm run -s roles:dev
      && npx prisma migrate reset --force
      && npm test
      && npm run verifier
      && npm run test:e2e"

  # Écrans (profil « outils ») : types, tests contre le contrat et la machine d'états, construction
  # de la console et du portail (étape 8), puis de docs/maquettes/index.html et docs/demo/index.html
  # (pages uniques, sans connexion, étape 6). Ses propres node_modules, comme « verification ».
  maquettes:
    <<: *frontend
    profiles: ["outils"]
    volumes:
      - ./:/depot
      - maquettes_node_modules:/depot/frontend/node_modules
    command: >
      sh -c "npm ci --no-audit --no-fund
      && npm run typecheck
      && npm test
      && npm run build"

  # Écrans dans un vrai navigateur (étape 8, profil « outils ») : Playwright et Chromium. L'API de
  # test tourne dans ce conteneur (port 3300, base jetable reclamations_navigateur, Redis base 14,
  # sans worker : les tests lisent codes et liens dans la boîte d'envoi) ; la console et le portail
  # construits pour la production sont servis par « vite preview » sous la CSP de production.
  # Captures de la note d'étape : docker compose run --rm -e CAPTURES=1 navigateur
  navigateur:
    image: mcr.microsoft.com/playwright:v1.56.0-noble
    profiles: ["outils"]
    working_dir: /depot/frontend
    init: true
    shm_size: 1gb
    environment:
      <<: *environnement-backend
      CI: "1"
    volumes:
      - ./:/depot
      - navigateur_backend_node_modules:/depot/backend/node_modules
      - navigateur_frontend_node_modules:/depot/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /depot/backend && npm ci --no-audit --no-fund && npm run -s roles:dev
      && cd /depot/frontend && npm ci --no-audit --no-fund
      && npx playwright test"

  # Recette automatique (étape 10, profil « outils ») : toutes les suites, puis le rapport des 11
  # critères de la section 10 dans docs/recette/rapport.md. Image construite depuis celle de
  # « navigateur », plus les outils de l'essai de sauvegarde (recette/Dockerfile : client
  # PostgreSQL 16, age, jq, rclone 1.75, moto pour le verrouillage des copies de l'étape 12).
  #   docker compose run --rm recette
  recette:
    build: ./recette
    image: reclamations-recette:local
    profiles: ["outils"]
    working_dir: /depot
    init: true
    shm_size: 1gb
    environment:
      <<: *environnement-backend
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclamations}:${POSTGRES_PASSWORD:-reclamations}@postgres:5432/reclamations_verif
      APP_DATABASE_URL: postgresql://reclamations_app:${APP_DB_PASSWORD:-reclamations_app}@postgres:5432/reclamations_verif
      CI: "1"
    volumes:
      - ./:/depot
      - recette_backend_node_modules:/depot/backend/node_modules
      - recette_frontend_node_modules:/depot/frontend/node_modules
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "cd /depot/backend && npm ci --no-audit --no-fund && npm run -s roles:dev
      && cd /depot/frontend && npm ci --no-audit --no-fund
      && cd /depot && node recette/recette.mjs"

  # Documentation Swagger du contrat d'API (profil « docs ») : docker compose up -d swagger
  swagger:
    image: swaggerapi/swagger-ui:v5.32.15
    profiles: ["docs"]
    environment:
      SWAGGER_JSON: /contrat/openapi.yaml
      DOC_EXPANSION: none
      DEFAULT_MODELS_EXPAND_DEPTH: "0"
    volumes:
      - ./contrat:/contrat:ro
    ports:
      - "${SWAGGER_PORT:-8081}:8080"

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
  verification_node_modules:
  frontend_node_modules:
  maquettes_node_modules:
  navigateur_backend_node_modules:
  navigateur_frontend_node_modules:
  recette_backend_node_modules:
  recette_frontend_node_modules:
  fichiers_dev:
