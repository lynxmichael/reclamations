  # ===========================================================================
  #  Banque : personnel
  # ===========================================================================
  /banque/conversations:
    get:
      tags: [Conversations]
      operationId: listerConversations
      summary: Boîte de réception — conversations des réclamations visibles
      description: |
        L'agent voit les conversations de ses réclamations ; le superviseur et l'Admin Entreprise, toutes.
        Seules figurent les conversations où le client a écrit. « À répondre » : le client a écrit en
        dernier, la plus longue attente d'abord ; « Non lues » et « Toutes » : l'activité la plus
        récente d'abord. Chat web fermé : 403 FONCTION_NON_OUVERTE.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/FiltreConversations'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Conversations et compteurs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageConversations' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/conversations/{id}:
    get:
      tags: [Conversations]
      operationId: lireConversation
      summary: Une conversation — réclamation, messages échangés, présence du client
      description: Jamais les notes internes, qui restent sur la fiche de la réclamation.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
