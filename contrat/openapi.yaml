        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /banque/reclamations/{id}/suggestion:
    post:
      tags: [Assistant IA]
      operationId: suggererReponse
      summary: Brouillon de réponse proposé à l'agent
      description: |
        « L'IA propose, l'humain décide » (décision I4) : rien n'est envoyé au client ni modifié. L'agent
        relit, corrige et envoie lui-même avec `repondreAuClient`. Le brouillon est vérifié : chaque
        interdit (promesse de remboursement ou de délai, statut annoncé, conseil financier, demande de
        code) est signalé dans `alertes`. Une catégorie plus juste et l'urgence sont suggérées, à titre
        indicatif. Seuls partent, masqués, la description et les derniers messages publics : jamais le
        nom ni les coordonnées du client, ni les notes internes, ni les pièces jointes (décision I5).
        Réclamation clôturée : 409 RECLAMATION_CLOTUREE. Assistant fermé : 403 FONCTION_NON_OUVERTE.
        Limité à 30 brouillons par 10 minutes et par utilisateur.
      x-roles: [AGENT, SUPERVISEUR]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Brouillon
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SuggestionReponse' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /banque/reclamations/{id}/resolution:
    post:
      tags: [Réclamations]
      operationId: resoudreReclamation
      summary: Résoudre (En cours → Résolue), avec la réponse finale
      description: Le client reçoit par e-mail et SMS les liens pour confirmer ou contester.
      x-roles: [AGENT, SUPERVISEUR]
      x-action: resoudre
      security:
