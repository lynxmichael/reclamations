# =============================================================================
#  Production — VPS Contabo (décision A9 de l'étape 3)
#
#    cp .env.production.example .env.production   puis remplir chaque valeur
#    docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#    docker compose -f docker-compose.prod.yml --env-file .env.production run --rm api \
#      node dist/scripts/creer-super-admin.js <e-mail> <prénom> <nom>
#
#  Seuls les ports 80 et 443 (Caddy) sont publiés : Docker contourne le pare-feu UFW pour les ports
#  qu'il publie, c'est pourquoi PostgreSQL, Redis et l'API n'en publient aucun.
#  Les migrations s'appliquent avant chaque démarrage de l'API. L'image web (Caddy, console et
#  portail construits, étape 8) se reconstruit avec les autres à chaque « up -d --build ».
#  Sauvegarde (étape 10) : chaque nuit, base et fichiers chiffrés par age, 7 copies locales,
#  copie hors du VPS (Contabo Object Storage). Vérifier ou restaurer une sauvegarde :
#    docker compose -f docker-compose.prod.yml --env-file .env.production run --rm restauration restaurer liste
#    docker compose -f docker-compose.prod.yml --env-file .env.production run --rm restauration restaurer derniere
#  (procédures complètes : docs/exploitation.md)
#  Aucun fichier du dépôt n'est monté dans les conteneurs : tout est dans les images. docker compose
#  peut donc aussi se lancer depuis un conteneur d'outils (répétition locale, étape 13 :
#  docker-compose.repetition.yml, deploiement/repetition.ps1).
#  Journaux de tous les services : 5 fichiers de 20 Mo au plus par conteneur.
# =============================================================================

name: reclamations-prod

x-journaux: &journaux
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-application: &application
  image: reclamations-application:${VERSION:-latest}
  restart: unless-stopped
  environment: &environnement
    NODE_ENV: production
    APP_DATABASE_URL: postgresql://reclamations_app:${APP_DB_PASSWORD:?APP_DB_PASSWORD manquant}@postgres:5432/reclamations
    REDIS_URL: redis://redis:6379
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET manquant}
    CLE_CHIFFREMENT_TOTP: ${CLE_CHIFFREMENT_TOTP:?CLE_CHIFFREMENT_TOTP manquant}
    CLE_OTP: ${CLE_OTP:?CLE_OTP manquant}
    DOMAINE_PLATEFORME: ${DOMAINE_PLATEFORME:?DOMAINE_PLATEFORME manquant}
    SMTP_URL: ${SMTP_URL:?SMTP_URL manquant}
    EMAIL_EXPEDITEUR: ${EMAIL_EXPEDITEUR:?EMAIL_EXPEDITEUR manquant}
    # Passerelle SMS de Makor Telecoms (étape 9) ; journal = aucun SMS envoyé
    SMS_MODE: ${SMS_MODE:-journal}
    SMS_URL: ${SMS_URL:-}
    SMS_CLE: ${SMS_CLE:-}
    SMS_EXPEDITEUR: ${SMS_EXPEDITEUR:-Reclamation}
    # Difficulté de base de l'anti-robot du portail (étape 11)
    ANTI_ROBOT_MAXIMUM: ${ANTI_ROBOT_MAXIMUM:-100000}
    # Assistant IA (étape 18) : regles = aucun envoi ; anthropic, openai ou mistral d'après le banc d'essai
    IA_FOURNISSEUR: ${IA_FOURNISSEUR:-regles}
    IA_MODELE: ${IA_MODELE:-}
    IA_CLE: ${IA_CLE:-}
    IA_URL: ${IA_URL:-}
    IA_DELAI_MS: ${IA_DELAI_MS:-8000}
    IA_PRIX_ENTREE: ${IA_PRIX_ENTREE:-0}
    IA_PRIX_SORTIE: ${IA_PRIX_SORTIE:-0}
    IA_PLAFOND_JOUR: ${IA_PLAFOND_JOUR:-2000}
    # WhatsApp Business et SMS entrant (étape 20) : vides, les webhooks sont refusés
    WHATSAPP_ENVOI: ${WHATSAPP_ENVOI:-meta}
    WHATSAPP_URL: ${WHATSAPP_URL:-https://graph.facebook.com}
    WHATSAPP_VERSION: ${WHATSAPP_VERSION:-v26.0}
    WHATSAPP_SECRET_APP: ${WHATSAPP_SECRET_APP:-}
    WHATSAPP_JETON_VERIFICATION: ${WHATSAPP_JETON_VERIFICATION:-}
    SMS_ENTRANT_SECRET: ${SMS_ENTRANT_SECRET:-}
  logging: *journaux
  networks: [interne]

# Sauvegarde et restauration : même image, droits différents sur les fichiers
x-sauvegarde: &sauvegarde
  image: reclamations-sauvegarde:${VERSION:-latest}
  environment:
    PGHOST: postgres
    PGUSER: ${POSTGRES_USER:-reclamations}
    PGPASSWORD: ${POSTGRES_PASSWORD}
    PGDATABASE: reclamations
    APP_DB_PASSWORD: ${APP_DB_PASSWORD}
    VERSION: ${VERSION:-latest}
    SAUVEGARDE_CLES_AGE: ${SAUVEGARDE_CLES_AGE:?SAUVEGARDE_CLES_AGE manquant (clés publiques age)}
    SAUVEGARDE_HEURE: ${SAUVEGARDE_HEURE:-02:30}
    SAUVEGARDE_LOCALES: ${SAUVEGARDE_LOCALES:-7}
    SAUVEGARDE_JOURS: ${SAUVEGARDE_JOURS:-30}
    SAUVEGARDE_MOIS: ${SAUVEGARDE_MOIS:-12}
    SAUVEGARDE_PING_URL: ${SAUVEGARDE_PING_URL:-}
    SAUVEGARDE_S3_BUCKET: ${SAUVEGARDE_S3_BUCKET:-}
    # Copies hors du VPS verrouillées (étape 12) : COMPLIANCE, GOVERNANCE ou aucun
    SAUVEGARDE_VERROU: ${SAUVEGARDE_VERROU:-COMPLIANCE}
    RCLONE_CONFIG_DISTANT_TYPE: s3
    RCLONE_CONFIG_DISTANT_PROVIDER: Other
    RCLONE_CONFIG_DISTANT_ENDPOINT: ${SAUVEGARDE_S3_ENDPOINT:-}
    RCLONE_CONFIG_DISTANT_ACCESS_KEY_ID: ${SAUVEGARDE_S3_CLE:-}
    RCLONE_CONFIG_DISTANT_SECRET_ACCESS_KEY: ${SAUVEGARDE_S3_SECRET:-}
    RCLONE_CONFIG_DISTANT_NO_CHECK_BUCKET: "true"
  depends_on:
    postgres:
      condition: service_healthy
  logging: *journaux
  networks: [interne]

services:
  # Caddy et les écrans : console.<domaine> (/srv/console), <slug>.<domaine> (/srv/portail)
  caddy:
    image: reclamations-web:${VERSION:-latest}
    build:
      context: .
      dockerfile: frontend/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAINE_PLATEFORME: ${DOMAINE_PLATEFORME}
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL manquant}
    volumes:
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api:
        condition: service_healthy
    logging: *journaux
    networks: [interne]

  api:
    <<: *application
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: application
      args:
        VERSION: ${VERSION:-latest}
    volumes:
      - fichiers:/donnees/fichiers
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    <<: *application
    command: ["node", "dist/src/worker.js"]
    # Pas de serveur HTTP : sain tant que son battement est dans Redis (un travail terminé il y a
    # moins de 2 minutes, étape 10) ; le même battement est publié par /api/v1/sante
    healthcheck:
      test: ["CMD", "node", "-e", "const R=require('ioredis');const r=new R(process.env.REDIS_URL,{maxRetriesPerRequest:1,connectTimeout:3000});r.on('error',()=>{});r.exists('reclamations:worker:battement').then(n=>process.exit(n?0:1),()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      # Pendant les 30 premières secondes, contrôle toutes les 5 s : sain dès son premier battement
      start_interval: 5s
      retries: 3
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  migrations:
    image: reclamations-migrations:${VERSION:-latest}
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: migrations
    restart: "no"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-reclamations}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD manquant}@postgres:5432/reclamations
    depends_on:
      postgres:
        condition: service_healthy
    logging: *journaux
    networks: [interne]

  # Image officielle et script des rôles (docker/postgres/Dockerfile) : aucun fichier du dépôt monté
  postgres:
    image: reclamations-postgres:16
    build:
      context: docker/postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-reclamations}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: reclamations
      APP_DB_PASSWORD: ${APP_DB_PASSWORD}
      POSTGRES_INITDB_ARGS: --encoding=UTF8 --locale-provider=icu --icu-locale=fr-FR --locale=C.UTF-8
      TZ: UTC
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d reclamations"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256m
    logging: *journaux
    networks: [interne]

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    logging: *journaux
    networks: [interne]

  # Sauvegarde quotidienne à SAUVEGARDE_HEURE (UTC) ; lecture seule sur les fichiers
  sauvegarde:
    <<: *sauvegarde
    build:
      context: docker/sauvegarde
    restart: unless-stopped
    init: true
    volumes:
      - sauvegardes:/sauvegardes
      - fichiers:/donnees/fichiers:ro

  # Outil lancé à la main (docker compose … run --rm restauration restaurer …), jamais par « up »
  restauration:
    <<: *sauvegarde
    profiles: [outils]
    restart: "no"
    command: ["restaurer", "--help"]
    stdin_open: true
    tty: true
    healthcheck:
      disable: true
    volumes:
      - sauvegardes:/sauvegardes
      - fichiers:/donnees/fichiers

networks:
  interne:

volumes:
  postgres_data:
  redis_data:
  fichiers:
  caddy_data:
  caddy_config:
  sauvegardes:
