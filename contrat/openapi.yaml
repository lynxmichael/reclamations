        '409': { $ref: '#/components/responses/Conflit' }

  # ===========================================================================
  #  Authentification du personnel
  # ===========================================================================
  /auth/connexion:
    post:
      tags: [Authentification]
      operationId: connexion
      summary: Première étape de connexion (e-mail et mot de passe)
      description: |
        Étape 19 : la double authentification est exigée du Super Admin, du personnel d'une banque qui l'a
        rendue obligatoire, et de toute personne qui l'a activée sur son compte (`TOTP_REQUIS`, ou
        `ENROLEMENT_TOTP_REQUIS` si elle n'est pas encore activée). Sinon, le mot de passe suffit :
        `SESSION_OUVERTE`, la session est ouverte et le refresh token posé en cookie `rt`, comme après le code.
        Après 5 échecs, le compte est verrouillé 15 minutes. 10 échecs par 15 minutes et par adresse IP (les connexions réussies ne comptent pas : le personnel d'une agence partage souvent la même adresse publique).
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/Connexion' }
      responses:
        '200':
          description: Mot de passe accepté ; code TOTP attendu, activation exigée, ou session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtapeConnexion' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '423': { $ref: '#/components/responses/Verrouille' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/connexion/totp:
    post:
      tags: [Authentification]
      operationId: validerCodeTotp
      summary: Seconde étape de connexion (code TOTP)
      description: Ouvre la session. Le refresh token est posé en cookie `rt` (httpOnly, Secure, SameSite=Strict).
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeTotp' }
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '423': { $ref: '#/components/responses/Verrouille' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/invitation/acceptation:
    post:
      tags: [Authentification]
      operationId: accepterInvitation
      summary: Accepter une invitation (choix du mot de passe)
      description: |
        Si la banque exige la double authentification (étape 19), son activation suit
        (`ENROLEMENT_TOTP_REQUIS`, puis `activerTotp`). Sinon, le compte est actif et la session s'ouvre
        (`SESSION_OUVERTE`, cookie `rt`) ; la personne pourra l'activer depuis « Mon compte ».
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionMotDePasse' }
      responses:
        '200':
          description: Mot de passe enregistré ; activation de la double authentification exigée, ou session ouverte
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EtapeConnexion' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /auth/totp/activation:
    post:
      tags: [Authentification]
      operationId: activerTotp
      summary: Activer le TOTP avec un premier code, et ouvrir la session
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeTotp' }
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '423': { $ref: '#/components/responses/Verrouille' }

  /auth/rafraichissement:
    post:
      tags: [Authentification]
      operationId: rafraichirSession
      summary: Nouveau jeton d'accès à partir du cookie de rafraîchissement
      description: Le refresh token change à chaque appel. Réutiliser un ancien jeton révoque toute la session.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - cookieRafraichissement: []
      responses:
        '200': { $ref: '#/components/responses/SessionOuverte' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/deconnexion:
    post:
      tags: [Authentification]
      operationId: deconnexion
      summary: Fermer la session (révoque le refresh token)
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '204':
          description: Session fermée, cookie effacé
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /auth/mot-de-passe/oubli:
    post:
      tags: [Authentification]
      operationId: demanderReinitialisation
      summary: Recevoir un lien de réinitialisation par e-mail
      description: Répond toujours 202, que l'adresse existe ou non.
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        '202':
          description: Demande prise en compte
        '400': { $ref: '#/components/responses/Invalide' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /auth/mot-de-passe/reinitialisation:
    post:
      tags: [Authentification]
      operationId: reinitialiserMotDePasse
      summary: Choisir un nouveau mot de passe avec le lien reçu
      x-roles: [PUBLIC]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DefinitionMotDePasse' }
      responses:
        '204':
          description: Mot de passe changé ; toutes les sessions sont révoquées
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }

  /auth/moi:
    get:
      tags: [Authentification]
      operationId: lireMoi
      summary: Utilisateur connecté
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE, SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '200':
          description: Profil
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Moi' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /auth/moi/totp/preparation:
    post:
      tags: [Authentification]
      operationId: preparerTotp
      summary: Mon compte — préparer l'activation de la double authentification
      description: |
        Étape 19. Nouveau secret, à scanner avec une application d'authentification ; il ne protège le
        compte qu'après `confirmerTotp`. Un nouvel appel remplace le secret préparé.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      responses:
        '200':
          description: Secret préparé
          content:
            application/json:
              schema: { $ref: '#/components/schemas/EnrolementCompte' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }

  /auth/moi/totp/activation:
    post:
      tags: [Authentification]
      operationId: confirmerTotp
      summary: Mon compte — activer la double authentification avec un premier code
      description: Le code à 6 chiffres affiché par l'application prouve que le secret préparé est enregistré.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeVerification' }
      responses:
        '200':
          description: Double authentification activée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Moi' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }
        '423': { $ref: '#/components/responses/Verrouille' }

  /auth/moi/totp/desactivation:
    post:
      tags: [Authentification]
      operationId: desactiverTotp
      summary: Mon compte — désactiver la double authentification
      description: |
        Avec un code valide de l'application. Refusé (422 `DOUBLE_AUTHENTIFICATION_OBLIGATOIRE`) si la
        banque l'exige. Les autres sessions de la personne sont fermées.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CodeVerification' }
      responses:
        '200':
          description: Double authentification désactivée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Moi' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '423': { $ref: '#/components/responses/Verrouille' }

  # ===========================================================================
  #  Banque : réclamations
  # ===========================================================================
  /banque/reclamations:
    get:
      tags: [Réclamations]
      operationId: listerReclamations
      summary: Files de traitement et recherche
      description: |
        Files du §6.2 : reçues (non assignées), assignées à moi, urgentes, en retard (SLA dépassé), escaladées.
        Un agent ne voit que les tickets qui lui sont assignés ; superviseur et Admin Entreprise voient toute la banque.
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/File'
        - $ref: '#/components/parameters/FiltreStatut'
        - $ref: '#/components/parameters/FiltrePriorite'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreAgence'
        - $ref: '#/components/parameters/FiltreCanal'
        - $ref: '#/components/parameters/FiltreAgent'
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/Recherche'
        - $ref: '#/components/parameters/TriReclamations'
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/ParPage'
      responses:
        '200':
          description: Page de réclamations
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PageReclamations' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

    post:
      tags: [Réclamations]
      operationId: saisirReclamation
      summary: Saisir la réclamation d'un client, au guichet ou au téléphone (étape 21)
      description: |
        Pour le client sans smartphone, ou qui appelle : un agent ou un superviseur saisit la réclamation
        à sa place. `GUICHET` exige l'agence ; `TELEPHONE` l'accepte en option (l'agence dont parle le
        client). Mêmes règles qu'au portail : catégorie active, description, nom, un téléphone ou un
        e-mail au moins, 5 pièces jointes. `consentementInforme` : le client a été informé de la politique
        de données de la banque ; la version en vigueur est enregistrée, et la chronologie et le journal
        d'audit disent qui l'a saisie. L'accusé de dépôt part au client comme au portail (SMS, e-mail),
        avec le lien de suivi, que la réponse donne aussi pour le récépissé imprimé. Un agent se l'assigne
        par défaut (`meLAssigner`) ; sinon, l'attribution habituelle (étape 16). Idempotent avec
        l'en-tête `Idempotency-Key`. 60 saisies par heure et par personne.
      x-roles: [AGENT, SUPERVISEUR]
      x-action: saisir
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/SaisieReclamation' }
            encoding:
              fichiers:
                contentType: image/jpeg, image/png, image/webp, application/pdf
      responses:
        '201':
          description: Réclamation enregistrée
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AccuseSaisie' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }
        '429': { $ref: '#/components/responses/TropDeRequetes' }

  /banque/reclamations/assignation-en-lot:
    post:
      tags: [Réclamations]
      operationId: assignerEnLot
      summary: Assigner ou répartir plusieurs réclamations (étape 21)
      description: |
        Par exemple les dossiers d'un agent absent ou d'un compte désactivé (file `a-reassigner`).
        `agentId` : toutes à cet agent actif. `repartir` : chacune à l'agent actif et présent le moins
        chargé — des groupes de sa catégorie et de son agence si l'attribution automatique est ouverte et
        qu'ils en ont un, sinon de toute la banque. Chacune comme `assignerReclamation` : machine d'états,
        chronologie, journal d'audit, notification au nouvel agent. Une réclamation impossible à assigner
        (clôturée, introuvable, déjà à cet agent, aucun agent disponible) est laissée telle quelle et
        listée avec sa raison.
      x-roles: [SUPERVISEUR]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AssignationEnLot' }
      responses:
        '200':
          description: Réclamations assignées et laissées
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ResultatAssignationEnLot' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /banque/reclamations/export:
    get:
      tags: [Tableau de bord]
      operationId: exporterReclamations
      summary: Export CSV des réclamations filtrées
      description: |
        Mêmes filtres que la liste. CSV UTF-8 avec BOM, séparateur « ; » (lisible directement dans
        Excel en français), dates dans le fuseau de la banque, délais en minutes ouvrées.
        Colonnes : numéro, dates de dépôt, de première réponse, de résolution et de clôture, statut,
        priorité, catégorie, agence, canal, agent, échéance, délais, SLA respecté, premier contact,
        réouvertures, escalade, mode de clôture. Ni description, ni nom ni coordonnées du client.
        50 000 lignes au plus (sinon 400 EXPORT_TROP_VOLUMINEUX). Chaque export est inscrit au
        journal d'audit de la banque. Un agent n'exporte que les réclamations qui lui sont assignées
        (étape 11).
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/File'
        - $ref: '#/components/parameters/FiltreStatut'
        - $ref: '#/components/parameters/FiltrePriorite'
        - $ref: '#/components/parameters/FiltreCategorie'
        - $ref: '#/components/parameters/FiltreAgence'
        - $ref: '#/components/parameters/FiltreCanal'
        - $ref: '#/components/parameters/FiltreAgent'
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
        - $ref: '#/components/parameters/Recherche'
      responses:
        '200':
          description: Fichier CSV
          headers:
            Content-Disposition:
              schema: { type: string, examples: ['attachment; filename="reclamations-2026-09-25.csv"'] }
          content:
            text/csv:
              schema: { type: string }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }

  /banque/reclamations/{id}:
    get:
      tags: [Réclamations]
      operationId: lireReclamation
      summary: Détail d'une réclamation
      x-roles: [AGENT, SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /banque/reclamations/{id}/prise-en-charge:
    post:
      tags: [Réclamations]
      operationId: prendreEnCharge
      summary: Prendre en charge (Ouverte → En cours)
      x-roles: [AGENT, SUPERVISEUR]
      x-action: prendreEnCharge
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }

  /banque/reclamations/{id}/assignation:
    post:
      tags: [Réclamations]
      operationId: assignerReclamation
      summary: Assigner à un agent
      x-roles: [SUPERVISEUR]
      x-action: assigner
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agentId]
              properties:
                agentId: { type: string, format: uuid }
      responses:
        '200': { $ref: '#/components/responses/Reclamation' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '422': { $ref: '#/components/responses/RegleMetier' }

  /banque/reclamations/{id}/reponses:
    post:
      tags: [Réclamations]
      operationId: repondreAuClient
      summary: Répondre au client (avec pièces jointes)
      description: |
        Depuis « Ouverte », le ticket est d'abord pris en charge. Avec `attendreReponse`, il passe
        « En attente client » et le chrono SLA s'arrête jusqu'à la réponse du client.
        Chat web (étape 17) : si le client a ouvert le chat, l'e-mail ou le SMS ne part que si la
        réponse reste non lue 2 minutes ; plusieurs réponses rapprochées donnent un seul avis.
      x-roles: [AGENT, SUPERVISEUR]
      x-action: repondreAuClient
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema: { $ref: '#/components/schemas/ReponseAuClient' }
      responses:
        '201': { $ref: '#/components/responses/Reclamation' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }
        '409': { $ref: '#/components/responses/Conflit' }
        '413': { $ref: '#/components/responses/FichierTropVolumineux' }
        '415': { $ref: '#/components/responses/TypeNonSupporte' }
        '422': { $ref: '#/components/responses/RegleMetier' }

