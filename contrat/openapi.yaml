      summary: Statistiques de toutes les banques (métadonnées seulement)
      description: Réclamations déposées pendant la période (par défaut, le mois courant en temps universel). Aucune description ni donnée de client.
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Du'
        - $ref: '#/components/parameters/Au'
