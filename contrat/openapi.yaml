      operationId: lireBarometre
      summary: Le baromètre d'un mois
      description: |
        Indicateurs du mois et du précédent, tendance sur 6 mois, irritants par catégorie et par agence,
        thèmes des commentaires des clients avec des exemples, faits marquants et recommandations. Les
        chiffres sont calculés par la plateforme ; l'IA (si l'assistant est ouvert) ne fait que regrouper
        les commentaires et rédiger les recommandations, sans chiffre qui ne soit dans les données.
        Mois sans baromètre : 404.
      x-roles: [SUPERVISEUR, ADMIN_ENTREPRISE]
      security:
        - jetonPersonnel: []
      parameters:
        - $ref: '#/components/parameters/Mois'
      responses:
        '200':
          description: Le baromètre
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Barometre' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '404': { $ref: '#/components/responses/Introuvable' }

  /banque/barometres/{mois}/recommandations/{id}:
