  /plateforme/administrateurs:
    get:
      tags: [Plateforme]
      operationId: listerSuperAdmins
      summary: Comptes Super Admin
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      responses:
        '200':
          description: Super Admins
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Utilisateur' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
    post:
      tags: [Plateforme]
      operationId: inviterSuperAdmin
      summary: Inviter un Super Admin
      x-roles: [SUPER_ADMIN]
      security:
        - jetonPersonnel: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentitePersonne' }
      responses:
        '201': { $ref: '#/components/responses/UnUtilisateur' }
        '400': { $ref: '#/components/responses/Invalide' }
        '401': { $ref: '#/components/responses/NonAuthentifie' }
        '403': { $ref: '#/components/responses/Interdit' }
        '409': { $ref: '#/components/responses/Conflit' }

components:
  securitySchemes:
    jetonPersonnel:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Jeton d'accès du personnel (15 minutes), obtenu après mot de passe + code TOTP.
    jetonClient:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Session client (30 minutes) obtenue avec le code OTP ; limitée à ce client et à sa banque.
    cookieRafraichissement:
      type: apiKey
      in: cookie
      name: rt
      description: Refresh token (httpOnly, Secure, SameSite=Strict), remplacé à chaque usage.

  # ---------------------------------------------------------------------------
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema: { type: string, format: uuid }
    PieceId:
      name: pieceId
      in: path
      required: true
      schema: { type: string, format: uuid }
    CodePoint:
      name: code
      in: path
      required: true
      description: Code public du point de dépôt, porté par le QR code ou le lien
      schema: { type: string, pattern: '^[A-Z0-9]{6,16}$', examples: ['7K3QX9P2MA'] }
    JetonSuivi:
      name: jetonSuivi
      in: path
      required: true
      description: Jeton du lien de suivi reçu au dépôt
      schema: { type: string, pattern: '^[A-Za-z0-9_-]{16,64}$' }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clé choisie par le navigateur (UUID conseillé) ; conservée 24 h
      schema: { type: string, minLength: 8, maxLength: 100 }
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1, default: 1 }
    ParPage:
      name: parPage
      in: query
      schema: { type: integer, minimum: 1, maximum: 100, default: 25 }
    Du:
      name: du
      in: query
      description: Début de période (inclus), date de dépôt
      schema: { type: string, format: date-time }
    Au:
      name: au
      in: query
      description: Fin de période (exclue), date de dépôt
      schema: { type: string, format: date-time }
    Recherche:
      name: recherche
      in: query
      description: Numéro de ticket, nom, e-mail ou téléphone
      schema: { type: string, minLength: 2, maxLength: 100 }
    File:
      name: file
      in: query
      description: File de traitement (§6.2)
      schema:
        type: string
        enum: [toutes, recues, assignees, urgentes, en-retard, escaladees]
        default: toutes
    FiltreStatut:
      name: statut
      in: query
      style: form
      explode: true
      schema:
        type: array
        items: { $ref: '#/components/schemas/StatutReclamation' }
    FiltrePriorite:
      name: priorite
      in: query
      schema: { $ref: '#/components/schemas/Priorite' }
    FiltreCategorie:
      name: categorieId
      in: query
      schema: { type: string, format: uuid }
    FiltreAgence:
      name: agenceId
      in: query
      schema: { type: string, format: uuid }
    FiltreCanal:
      name: canal
      in: query
      schema: { $ref: '#/components/schemas/CanalDepot' }
    FiltreAgent:
      name: agentId
      in: query
      schema: { type: string, format: uuid }
    FiltreAction:
      name: action
      in: query
      description: Préfixe d'action, ex. `reclamation.` ou `auth.connexion`
      schema: { type: string, maxLength: 80 }
    TriReclamations:
      name: tri
      in: query
      schema:
        type: string
        enum: [-creeLe, creeLe, echeanceSlaLe, -echeanceSlaLe, -priorite]
        default: -creeLe
    NonLues:
      name: nonLues
      in: query
      schema: { type: boolean, default: false }
    Apres:
      name: apres
      in: query
      description: Seulement les messages écrits à partir de cet instant (le `curseur` de la réponse précédente) ; un message déjà reçu peut revenir, à dédoublonner par `id`
      schema: { type: string, format: date-time }
    FiltreConversations:
      name: filtre
      in: query
      description: "a-repondre : le client a écrit en dernier ; non-lues : un message du client attend la lecture de la banque"
      schema: { type: string, enum: [a-repondre, non-lues, toutes], default: a-repondre }

  # ---------------------------------------------------------------------------
  responses:
    Invalide:
      description: Requête mal formée ou champ invalide (code VALIDATION, erreurs par champ)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    NonAuthentifie:
      description: Jeton absent, expiré ou invalide ; identifiants ou code incorrects
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Interdit:
      description: Rôle insuffisant, banque suspendue (code BANQUE_SUSPENDUE, pour toute opération du personnel de cette banque), ou fonction de la phase 2 que Makor n'a pas ouverte à la banque (code FONCTION_NON_OUVERTE)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Introuvable:
      description: Introuvable — y compris une ressource d'une autre banque, ou un ticket non assigné à l'agent
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Conflit:
      description: Action impossible dans l'état actuel (transition interdite, doublon, clé d'idempotence réutilisée)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    RegleMetier:
      description: Donnée correcte en forme mais refusée par une règle métier
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Verrouille:
      description: Compte verrouillé temporairement après des échecs répétés
      headers:
        Retry-After:
          description: Secondes avant de réessayer
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TropDeRequetes:
      description: Limite de débit atteinte
      headers:
        Retry-After:
          description: Secondes avant de réessayer
          schema: { type: integer }
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    FichierTropVolumineux:
      description: Fichier au-delà de 5 Mo (1 Mo pour un logo)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    TypeNonSupporte:
      description: Type de fichier refusé (JPEG, PNG, WebP ou PDF attendus)
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Probleme' }
    Fichier:
      description: Contenu du fichier
      headers:
        Content-Disposition:
          schema: { type: string, examples: ['attachment; filename="recu.pdf"'] }
      content:
        application/octet-stream:
          schema: { type: string, format: binary }
    Reclamation:
      description: Réclamation à jour
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReclamationDetail' }
    SessionOuverte:
      description: Session ouverte ; cookie `rt` posé
      headers:
        Set-Cookie:
          description: '`rt=<refresh token>; HttpOnly; Secure; SameSite=Strict; Path=/api/v1/auth`'
          schema: { type: string }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/SessionPersonnel' }
    Parametres:
      description: Paramètres de la banque
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ParametresBanque' }
    Regles:
      description: Règles d'attribution et d'escalade
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ReglesTraitement' }
    Horaires:
      description: Horaires ouvrés
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Horaires' }
    UnUtilisateur:
      description: Compte du personnel
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Utilisateur' }
    UneBanque:
      description: Banque
      content:
        application/json:
          schema: { $ref: '#/components/schemas/BanquePlateforme' }
    Verification:
      description: Résultat de la vérification de la chaîne
      content:
        application/json:
          schema: { $ref: '#/components/schemas/VerificationChaine' }

  # ---------------------------------------------------------------------------
  schemas:
    # ---- Énumérations (identiques au modèle de données) -----------------------
    StatutReclamation:
      type: string
      enum: [OUVERTE, EN_COURS, EN_ATTENTE_CLIENT, RESOLUE, CLOTUREE]
    Priorite:
      type: string
      enum: [NORMALE, URGENTE]
    CanalDepot:
      type: string
      enum: [QR_CODE, LIEN_WEB]
    RoleUtilisateur:
      type: string
      enum: [SUPER_ADMIN, ADMIN_ENTREPRISE, SUPERVISEUR, AGENT]
    RoleBanque:
      type: string
      description: Rôles attribuables par l'Admin Entreprise
      enum: [ADMIN_ENTREPRISE, SUPERVISEUR, AGENT]
    StatutUtilisateur:
      type: string
      enum: [INVITE, ACTIF, DESACTIVE]
    TypeEvenement:
      type: string
      enum: [CREATION, PRISE_EN_CHARGE, QUESTION_AU_CLIENT, REPONSE_DU_CLIENT, RESOLUTION, CONFIRMATION, CONTESTATION,
        CLOTURE_AUTOMATIQUE, CLOTURE_FORCEE, ASSIGNATION, CHANGEMENT_PRIORITE, ESCALADE, ESCALADE_ADMIN,
        ALERTE_SLA_PREVENTIVE, DEPASSEMENT_SLA, MESSAGE, PIECE_JOINTE]
    ModeCloture:
      type: string
      enum: [CONFIRMATION_CLIENT, AUTOMATIQUE, FORCEE]
    MotifClotureForcee:
      type: string
      enum: [DOUBLON, HORS_PERIMETRE, ABUS, AUTRE]
    TypeCommentaire:
      type: string
      enum: [NOTE_INTERNE, REPONSE_AU_CLIENT, MESSAGE_DU_CLIENT]
    TypeActeur:
      type: string
      enum: [CLIENT, UTILISATEUR, SYSTEME]
    CanalOtp:
      type: string
      enum: [EMAIL, SMS]
    ActionStatut:
      type: string
      description: Actions de la machine d'états (étape 4)
      enum: [PRENDRE_EN_CHARGE, QUESTIONNER_CLIENT, REPRENDRE_SUR_REPONSE, RESOUDRE, CONFIRMER, CONTESTER,
        CLOTURER_AUTOMATIQUEMENT, CLOTURER_DE_FORCE]
    OperationTicket:
      type: string
      description: Opérations sans changement de statut (étape 4)
      enum: [CONSULTER, ASSIGNER, CHANGER_PRIORITE, ESCALADER, NOTE_INTERNE, REPONDRE_AU_CLIENT, MESSAGE_DU_CLIENT]
    EtatChrono:
      type: string
      description: |
        État du chrono SLA, calculé par l'API à la lecture (étape 6) :
        DANS_LES_DELAIS, ALERTE (seuil d'alerte de la banque franchi), DEPASSE (échéance passée),
        EN_PAUSE (en attente du client), ARRETE (réclamation résolue ou clôturée).
      enum: [DANS_LES_DELAIS, ALERTE, DEPASSE, EN_PAUSE, ARRETE]
    CodeErreur:
      type: string
      description: Code stable d'une erreur, à utiliser par les interfaces (le titre peut changer)
      enum:
        # Requête et accès
        - VALIDATION
        - NON_AUTHENTIFIE
        - JETON_INVALIDE
        - INTERDIT
        - INTROUVABLE
        - TROP_DE_REQUETES
        - CONFLIT_IDEMPOTENCE
        # Authentification
        - IDENTIFIANTS_INVALIDES
        - COMPTE_VERROUILLE
        - CODE_TOTP_INVALIDE
        - MOT_DE_PASSE_TROP_FAIBLE
        - CODE_OTP_INVALIDE
        - CODE_OTP_EXPIRE
        - TROP_DE_TENTATIVES
        # Machine d'états (étape 4)
        - TRANSITION_INTERDITE
        - ACTEUR_NON_AUTORISE
        - AUCUN_AGENT_ASSIGNE
        - DELAI_DE_CONTESTATION_DEPASSE
        - CLOTURE_AUTOMATIQUE_PREMATUREE
        # Dépôt et messages
        - BANQUE_SUSPENDUE
        - POINT_DE_DEPOT_INACTIF
        - CATEGORIE_INVALIDE
        - CONTACT_REQUIS
        - CONTACT_INVALIDE
        - DESCRIPTION_REQUISE
        - CONSENTEMENT_REQUIS
        - ANTI_ROBOT_REFUSE
        - MESSAGE_VIDE
        - PRECISION_REQUISE
        - AGENT_INVALIDE
        # Fichiers
        - FICHIER_TROP_VOLUMINEUX
        - TYPE_DE_FICHIER_NON_SUPPORTE
        - TROP_DE_FICHIERS
        # Paramétrage et plateforme
        - PLAFOND_AGENTS_ATTEINT
        - EMAIL_DEJA_UTILISE
        - NOM_DEJA_UTILISE
        - CODE_DEJA_UTILISE
        - PREFIXE_DEJA_UTILISE
        - SLUG_DEJA_UTILISE
        - QR_CODE_SANS_AGENCE
        - SUPERVISEUR_INVALIDE
        - INVITATION_DEJA_ACCEPTEE
        - JOUR_FERIE_EXISTANT
        # Reporting (étape 9)
        - EXPORT_TROP_VOLUMINEUX
        # Enquêtes de satisfaction (étape 15)
        - AVIS_DEJA_DONNE
        - ENQUETE_TERMINEE
        # Attribution et escalade (étape 16)
        - FONCTION_NON_OUVERTE
        - GROUPE_INVALIDE
        - ABSENCE_INVALIDE
        # Serveur
        - ERREUR_INTERNE

    # ---- Communs -----------------------------------------------------------------
    Probleme:
      type: object
      description: Erreur au format RFC 9457
      required: [type, title, status, code]
      properties:
        type: { type: string, format: uri-reference, examples: ['/erreurs/transition-interdite'] }
        title: { type: string, examples: ['Action impossible dans le statut actuel'] }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string, examples: ['RESOUDRE est impossible depuis le statut OUVERTE'] }
        instance: { type: string, examples: ['/api/v1/banque/reclamations/0199.../resolution'] }
        code: { $ref: '#/components/schemas/CodeErreur' }
        erreurs:
          type: array
          description: Détail par champ (code VALIDATION)
          items: { $ref: '#/components/schemas/ErreurChamp' }
    ErreurChamp:
      type: object
      required: [champ, message]
      properties:
        champ: { type: string, examples: ['telephone'] }
        message: { type: string, examples: ['Numéro de téléphone invalide'] }
    Pagination:
      type: object
      required: [page, parPage, total]
      properties:
        page: { type: integer, minimum: 1 }
        parPage: { type: integer, minimum: 1, maximum: 100 }
        total: { type: integer, minimum: 0 }
    ReferenceNommee:
      type: object
      required: [id, nom]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
    Sante:
      type: object
      required: [statut, base, redis, worker, envois, disque, version]
      properties:
        statut:
          type: string
          enum: [ok, degrade]
          description: ok si toutes les autres valeurs sont ok
        base: { type: string, enum: [ok, indisponible] }
        redis: { type: string, enum: [ok, indisponible] }
        worker:
          type: string
          enum: [ok, absent, inconnu]
          description: absent si le worker n'a terminé aucun travail depuis 2 minutes ; inconnu si Redis ne répond pas
        envois:
          type: string
          enum: [ok, en_retard, inconnu]
          description: en_retard si un e-mail ou un SMS attend depuis plus de 10 minutes (worker, SMTP ou passerelle SMS en panne)
        disque:
          type: string
          enum: [ok, presque_plein, inconnu]
          description: espace libre du volume des pièces jointes (moins de 5 % ou de 2 Gio → presque_plein)
        version:
          type: string
          description: étiquette de l'image déployée (VERSION de .env.production)
          examples: ['1.0.0']
    Horodatage:
      type: string
      format: date-time
      examples: ['2026-09-25T10:00:00Z']
    HorodatageFacultatif:
      type: [string, 'null']
      format: date-time
    Couleur:
      type: [string, 'null']
      pattern: '^#[0-9A-Fa-f]{6}$'
      examples: ['#0B5FFF']
    PieceJointe:
      type: object
      required: [id, nomFichier, typeMime, tailleOctets, creeLe]
      properties:
        id: { type: string, format: uuid }
        nomFichier: { type: string, examples: ['releve.pdf'] }
        typeMime: { type: string, examples: ['application/pdf'] }
        tailleOctets: { type: integer, minimum: 1 }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
    Fichiers:
      type: array
      description: 5 fichiers au plus, 5 Mo chacun, JPEG, PNG, WebP ou PDF
      maxItems: 5
      items: { type: string, format: binary }

    # ---- Public : dépôt et suivi -----------------------------------------------------
    BanquePublique:
      type: object
      required: [nom, slug, logoUrl, couleurPrimaire, couleurSecondaire]
      properties:
        nom: { type: string, examples: ['Banque Alpha'] }
        slug: { type: string, examples: ['alpha'] }
        logoUrl: { type: [string, 'null'], format: uri-reference }
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
    FormulaireDepot:
      type: object
      required: [banque, canal, agence, agences, categories, politiqueDonnees, fichiers]
      properties:
        banque: { $ref: '#/components/schemas/BanquePublique' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        agence:
          description: Agence du QR code ; vide pour un lien web
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agences:
          type: array
          description: Agences proposées au client quand le point n'en a pas (choix facultatif)
          items: { $ref: '#/components/schemas/ReferenceNommee' }
        categories:
          type: array
          items:
            type: object
            required: [id, nom, description]
            properties:
              id: { type: string, format: uuid }
              nom: { type: string, examples: ['Carte bancaire'] }
              description: { type: [string, 'null'] }
        politiqueDonnees:
          type: object
          required: [version, url]
          properties:
            version: { type: string, examples: ['2026-09'] }
            url: { type: string, format: uri-reference }
        fichiers:
          type: object
          required: [maxFichiers, maxOctets, types]
          properties:
            maxFichiers: { type: integer, const: 5 }
            maxOctets: { type: integer, examples: [5242880] }
            types:
              type: array
              items: { type: string }
              examples: [['image/jpeg', 'image/png', 'image/webp', 'application/pdf']]
    DefiAntiRobot:
      type: object
      description: Défi de preuve de travail (étape 11), champs d'ALTCHA en français
      required: [algorithme, defi, sel, maximum, signature, expireLe]
      properties:
        algorithme: { type: string, const: SHA-256 }
        defi: { type: string, pattern: '^[0-9a-f]{64}$', description: "SHA-256(sel + nombre) en hexadécimal" }
        sel: { type: string, pattern: '^[0-9a-f]{24}\?expire=[0-9]{10}$', description: "Aléa et heure d'expiration (secondes Unix)", examples: ['9f86d081884c7d659a2feaa0?expire=1790000000'] }
        maximum: { type: integer, minimum: 1, description: "Le nombre cherché est entre 0 et maximum", examples: [100000] }
        signature: { type: string, pattern: '^[0-9a-f]{64}$', description: "HMAC-SHA-256 du défi par l'API" }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
    JetonAntiRobot:
      type: string
      minLength: 1
      maxLength: 1024
      description: |
        Défi résolu : JSON `{"sel", "nombre", "signature"}` encodé en base64url (lireDefiAntiRobot).
        À usage unique, valable jusqu'à l'expiration du défi.
      examples: ['eyJzZWwiOiI5Zjg2ZDA4MTg4NGM3ZDY1OWEyZmVhYTA_ZXhwaXJlPTE3OTAwMDAwMDAiLCJub21icmUiOjQyLCJzaWduYXR1cmUiOiIuLi4ifQ']
    DepotReclamation:
      type: object
      description: Un e-mail ou un téléphone au moins (arbitrage 1)
      required: [categorieId, description, nom, consentement, versionPolitique, jetonAntiRobot]
      anyOf:
        - required: [email]
        - required: [telephone]
      properties:
        categorieId: { type: string, format: uuid }
        agenceId: { type: string, format: uuid, description: "Seulement si le point de dépôt n'a pas d'agence" }
        description: { type: string, minLength: 1, maxLength: 5000 }
        nom: { type: string, minLength: 2, maxLength: 160, examples: ['Yao Kouassi'] }
        email: { type: string, format: email, maxLength: 254 }
        telephone: { type: string, maxLength: 25, description: "Format libre, normalisé en E.164 (+225 par défaut)", examples: ['07 08 09 10 11'] }
        consentement: { type: boolean, const: true, description: "Acceptation de la politique de données (ARTCI)" }
        versionPolitique: { type: string, maxLength: 20, examples: ['2026-09'] }
        jetonAntiRobot: { $ref: '#/components/schemas/JetonAntiRobot' }
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    AccuseDepot:
      type: object
      required: [numero, lienSuivi, jetonSuivi]
      properties:
        numero: { type: string, pattern: '^[A-Z0-9]{2,10}-[0-9]{4}-[0-9]{6}$', examples: ['ALP-2026-000042'] }
        lienSuivi: { type: string, format: uri, examples: ['https://alpha.reclamations.example/suivi/Qm9uam91ckJhbnF1ZUFscGhh'] }
        jetonSuivi: { type: string }
    EtapeSuivi:
      type: object
      required: [type, statut, date]
      properties:
        type: { $ref: '#/components/schemas/TypeEvenement' }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        date: { $ref: '#/components/schemas/Horodatage' }
    SuiviPublic:
      type: object
      description: Chronologie seule — ni description, ni messages, ni coordonnées
      required: [numero, statut, categorie, creeLe, banque, etapes, avis]
      properties:
        avis:
          description: Enquête de satisfaction de la réclamation clôturée (étape 15) ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisResume'
            - type: 'null'
        numero: { type: string, examples: ['ALP-2026-000042'] }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string, examples: ['Carte bancaire'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        banque: { $ref: '#/components/schemas/BanquePublique' }
        etapes:
          type: array
          items: { $ref: '#/components/schemas/EtapeSuivi' }
    EtatAvis:
      type: string
      description: "A_DONNER : enquête ouverte ; DONNE : réponse reçue ; TERMINE : 7 jours passés sans réponse"
      enum: [A_DONNER, DONNE, TERMINE]
    AvisResume:
      type: object
      required: [etat, expireLe]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
    ReponseAvis:
      type: object
      description: Réponse du client à l'enquête (étape 15)
      required: [note, recommandation]
      properties:
        note: { type: integer, minimum: 1, maximum: 5, description: "Satisfaction sur le traitement de la réclamation (CSAT), de 1 à 5" }
        recommandation: { type: integer, minimum: 0, maximum: 10, description: "Recommandation de la banque à un proche (NPS), de 0 à 10" }
        commentaire: { type: string, maxLength: 1000, description: "Facultatif" }
    Avis:
      type: object
      description: Enquête de satisfaction telle que la voit le client (étape 15)
      required: [numero, categorie, banque, etat, expireLe, reponse]
      properties:
        numero: { type: string, examples: ['ALP-2026-000042'] }
        categorie: { type: string, examples: ['Carte bancaire'] }
        banque: { $ref: '#/components/schemas/BanquePublique' }
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        reponse:
          oneOf:
            - $ref: '#/components/schemas/AvisDonne'
            - type: 'null'
    AvisDonne:
      type: object
      required: [note, recommandation, commentaire, reponduLe]
      properties:
        note: { type: integer, minimum: 1, maximum: 5 }
        recommandation: { type: integer, minimum: 0, maximum: 10 }
        commentaire: { type: [string, 'null'] }
        reponduLe: { $ref: '#/components/schemas/Horodatage' }
    DemandeOtp:
      type: object
      required: [jetonAntiRobot]
      properties:
        jetonAntiRobot: { $ref: '#/components/schemas/JetonAntiRobot' }
        canal:
          $ref: '#/components/schemas/CanalOtp'
          description: Par défaut le SMS si le client a un téléphone, sinon l'e-mail
    OtpEnvoye:
      type: object
      required: [canal, destinationMasquee, expireDans]
      properties:
        canal: { $ref: '#/components/schemas/CanalOtp' }
        destinationMasquee: { type: string, examples: ['+225 07 •• •• •• 11', 'y••••@exemple.ci'] }
        expireDans: { type: integer, description: "Secondes", examples: [600] }
    VerificationOtp:
      type: object
      required: [code]
      properties:
        code: { type: string, pattern: '^[0-9]{6}$' }
    SessionClient:
      type: object
      required: [jetonClient, expireDans]
      properties:
        jetonClient: { type: string }
        expireDans: { type: integer, examples: [1800] }

    # ---- Espace client ------------------------------------------------------------------
    ReclamationClientResume:
      type: object
      required: [id, numero, statut, categorie, creeLe]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
    MessageVisible:
      type: object
      description: Réponse de la banque ou message du client (jamais une note interne)
      required: [id, type, contenu, auteur, creeLe, piecesJointes]
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [REPONSE_AU_CLIENT, MESSAGE_DU_CLIENT] }
        contenu: { type: string }
        auteur: { type: string, enum: [BANQUE, CLIENT] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        piecesJointes:
          type: array
          items: { $ref: '#/components/schemas/PieceJointe' }
    ReclamationClient:
      type: object
      required: [id, numero, statut, categorie, description, creeLe, clotureAutoPrevueLe, messages, piecesJointes, etapes, actionsPossibles,
        operationsPossibles, avis, chat]
      properties:
        chat:
          description: Chat web (étape 17) ; vide si Makor ne l'a pas ouvert à la banque (fil de messages simple)
          oneOf:
            - $ref: '#/components/schemas/EtatChat'
            - type: 'null'
        avis:
          description: Enquête de satisfaction (étape 15) et adresse de sa page ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisClient'
            - type: 'null'
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        categorie: { type: string }
        description: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        clotureAutoPrevueLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Fin du délai pour confirmer ou contester
        messages:
          type: array
          items: { $ref: '#/components/schemas/MessageVisible' }
        piecesJointes:
          type: array
          description: Fichiers du dépôt
          items: { $ref: '#/components/schemas/PieceJointe' }
        etapes:
          type: array
          items: { $ref: '#/components/schemas/EtapeSuivi' }
        actionsPossibles:
          type: array
          description: Boutons à afficher (ex. CONFIRMER, CONTESTER)
          items: { $ref: '#/components/schemas/ActionStatut' }
        operationsPossibles:
          type: array
          description: "Opérations permises au client : CONSULTER, et MESSAGE_DU_CLIENT tant que la réclamation n'est pas résolue"
          items: { $ref: '#/components/schemas/OperationTicket' }
    AvisClient:
      type: object
      required: [etat, expireLe, chemin]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        chemin: { type: string, description: "Page de l'enquête sur le portail, ex. /suivi/<jeton>/avis", examples: ['/suivi/Zq3h0Zk8b2mN4pLsQ1w2e3r4t5y6u7i8/avis'] }
    NouveauMessage:
      type: object
      required: [contenu]
      properties:
        contenu: { type: string, minLength: 1, maxLength: 5000 }
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    Contestation:
      type: object
      required: [motif]
      properties:
        motif: { type: string, minLength: 1, maxLength: 5000 }

    # ---- Conversations et chat web (étape 17) -----------------------------------------
    CanalConversation:
      type: string
      description: "Canal d'une conversation : WEB (chat du portail) ; WHATSAPP et SMS entrant à l'étape 19"
      enum: [WEB, WHATSAPP, SMS]
    EtatChat:
      type: object
      description: Le chat vu du client
      required: [ouvert, repriseLe, luParLaBanqueLe]
      properties:
        ouvert: { type: boolean, description: "La banque est dans ses heures d'ouverture" }
        repriseLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Prochaine ouverture, quand la banque est fermée
        luParLaBanqueLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Dernière lecture de la conversation par la banque (« Lu » sous les messages du client)
    ConversationClient:
      type: object
      required: [statut, messages, curseur, chat]
      properties:
        statut:
          $ref: '#/components/schemas/StatutReclamation'
          description: Un statut différent de celui affiché appelle une relecture de la réclamation (boutons, historique)
        messages:
          type: array
          description: Messages écrits à partir de `apres`, du plus ancien au plus récent
          items: { $ref: '#/components/schemas/MessageVisible' }
        curseur:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Heure du dernier message de la réclamation, à repasser dans `apres`
        chat: { $ref: '#/components/schemas/EtatChat' }

    # ---- Authentification -----------------------------------------------------------
    MotDePasse:
      type: string
      minLength: 12
      maxLength: 128
      description: 12 caractères au moins ; refusé s'il figure dans une liste de mots de passe courants
    Connexion:
      type: object
      required: [email, motDePasse]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        motDePasse: { type: string, maxLength: 128 }
    EtapeTotp:
      type: object
      required: [etape, jetonIntermediaire, expireDans]
      properties:
        etape:
          type: string
          enum: [TOTP_REQUIS, ENROLEMENT_TOTP_REQUIS]
          description: ENROLEMENT_TOTP_REQUIS après une réinitialisation du TOTP par l'Admin Entreprise
        jetonIntermediaire: { type: string, description: "Valable 5 minutes, pour la seconde étape seulement" }
        expireDans: { type: integer, examples: [300] }
        enrolement:
          $ref: '#/components/schemas/EnrolementTotp'
          description: Présent quand etape = ENROLEMENT_TOTP_REQUIS
    CodeTotp:
      type: object
      required: [jetonIntermediaire, code]
      properties:
        jetonIntermediaire: { type: string }
        code: { type: string, pattern: '^[0-9]{6}$' }
    DefinitionMotDePasse:
      type: object
      required: [jeton, motDePasse]
      properties:
        jeton: { type: string, description: "Jeton reçu par e-mail (invitation ou réinitialisation)" }
        motDePasse: { $ref: '#/components/schemas/MotDePasse' }
    EnrolementTotp:
      type: object
      required: [jetonIntermediaire, otpauthUrl, secret, qrCodeDataUrl]
      properties:
        jetonIntermediaire: { type: string }
        otpauthUrl: { type: string, examples: ['otpauth://totp/Reclamations:agent@alpha.ci?secret=…&issuer=Reclamations'] }
        secret: { type: string, description: "Secret en base32, pour une saisie manuelle" }
        qrCodeDataUrl: { type: string, description: 'Image PNG en data: URL' }
    Moi:
      type: object
      required: [id, email, nom, prenom, role, banque]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nom: { type: string }
        prenom: { type: string }
        role: { $ref: '#/components/schemas/RoleUtilisateur' }
        banque:
          description: Vide pour un Super Admin
          oneOf:
            - type: object
              required: [id, nom, slug, fuseauHoraire]
              properties:
                id: { type: string, format: uuid }
                nom: { type: string }
                slug: { type: string }
                fuseauHoraire: { type: string, examples: ['Africa/Abidjan'] }
            - type: 'null'
    SessionPersonnel:
      type: object
      required: [jetonAcces, expireDans, utilisateur]
      properties:
        jetonAcces: { type: string }
        expireDans: { type: integer, examples: [900] }
        utilisateur: { $ref: '#/components/schemas/Moi' }

    # ---- Banque : réclamations --------------------------------------------------------
    ReclamationResume:
      type: object
      required: [id, numero, statut, priorite, canal, categorie, agence, agent, agentSuggere, client, creeLe, echeanceSlaLe, enRetard, escaladee, sla]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string, examples: ['ALP-2026-000042'] }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        categorie: { $ref: '#/components/schemas/ReferenceNommee' }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        agentSuggere:
          description: "Mode suggestion (étape 16) : l'agent proposé pour une réclamation non assignée, pour le superviseur ; vide sinon"
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        echeanceSlaLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Vide pendant la pause « En attente client » et après la résolution
        enRetard: { type: boolean }
        escaladee: { type: boolean }
        sla: { $ref: '#/components/schemas/SlaResume' }
    SlaResume:
      type: object
      description: Chrono d'une réclamation dans les files, de quoi dessiner sa jauge sans recalculer le temps ouvré
      required: [etat, delaiCibleMinutes, minutesRestantes]
      properties:
        etat: { $ref: '#/components/schemas/EtatChrono' }
        delaiCibleMinutes: { type: integer, minimum: 0, description: "Minutes ouvrées" }
        minutesRestantes:
          type: [integer, 'null']
          description: "Minutes ouvrées avant l'échéance, négatives après ; figées pendant la pause ; vides une fois le chrono arrêté"
    PageReclamations:
      type: object
      required: [donnees, pagination, compteurs]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/ReclamationResume' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        compteurs:
          type: object
          description: "Réclamations non clôturées de chaque file, pour l'utilisateur connecté et sans les autres filtres : les pastilles des onglets"
          required: [recues, assignees, urgentes, enRetard, escaladees]
          properties:
            recues: { type: integer, minimum: 0, description: "Non assignées (0 pour un agent)" }
            assignees: { type: integer, minimum: 0, description: "Assignées à l'utilisateur connecté" }
            urgentes: { type: integer, minimum: 0 }
            enRetard: { type: integer, minimum: 0 }
            escaladees: { type: integer, minimum: 0 }
    EtatSla:
      type: object
      required: [etat, delaiCibleMinutes, echeanceLe, alertePreventiveLe, enPauseDepuis, minutesRestantes, enRetard, respecte]
      properties:
        etat: { $ref: '#/components/schemas/EtatChrono' }
        delaiCibleMinutes: { type: integer, description: "Minutes ouvrées, copiées de la catégorie au dépôt" }
        echeanceLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        alertePreventiveLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        enPauseDepuis: { $ref: '#/components/schemas/HorodatageFacultatif' }
        minutesRestantes:
          type: [integer, 'null']
          description: "Minutes ouvrées avant l'échéance : calculées à la lecture quand le chrono tourne (négatives après l'échéance), figées pendant la pause et à la résolution"
        enRetard: { type: boolean }
        respecte: { type: [boolean, 'null'], description: "Verdict à la résolution" }
    Jalons:
      type: object
      required: [prisEnChargeLe, premiereReponseLe, resolueLe, clotureLe, clotureAutoPrevueLe, escaladeeLe, escaladeeAdminLe]
      properties:
        prisEnChargeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        premiereReponseLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        resolueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        clotureLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        clotureAutoPrevueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        escaladeeLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        escaladeeAdminLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Escalade automatique à l'Admin Entreprise, seuil de dépassement franchi (étape 16)
    InfosCloture:
      type: object
      required: [mode, motif, precision, par]
      properties:
        mode: { $ref: '#/components/schemas/ModeCloture' }
        motif:
          oneOf:
            - $ref: '#/components/schemas/MotifClotureForcee'
            - type: 'null'
        precision: { type: [string, 'null'] }
        par:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
    ActeurVisible:
      type: object
      required: [type, nom]
      properties:
        type: { $ref: '#/components/schemas/TypeActeur' }
        nom: { type: [string, 'null'], description: "Nom du membre du personnel ; vide pour le client et le système" }
    Message:
      type: object
      required: [id, type, contenu, auteur, creeLe, piecesJointes]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/TypeCommentaire' }
        contenu: { type: string }
        auteur: { $ref: '#/components/schemas/ActeurVisible' }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        piecesJointes:
          type: array
          items: { $ref: '#/components/schemas/PieceJointe' }
    Evenement:
      type: object
      required: [type, statutAvant, statutApres, acteur, visibleClient, date]
      properties:
        type: { $ref: '#/components/schemas/TypeEvenement' }
        statutAvant:
          oneOf:
            - $ref: '#/components/schemas/StatutReclamation'
            - type: 'null'
        statutApres:
          oneOf:
            - $ref: '#/components/schemas/StatutReclamation'
            - type: 'null'
        acteur: { $ref: '#/components/schemas/ActeurVisible' }
        visibleClient: { type: boolean }
        date: { $ref: '#/components/schemas/Horodatage' }
    ReclamationDetail:
      type: object
      required: [id, numero, statut, priorite, canal, description, categorie, agence, pointDepot, agent, escaladeeVers, client,
        creeLe, sla, jalons, cloture, nbReouvertures, messages, piecesJointes, chronologie, actionsPossibles, operationsPossibles, avis,
        attributionSuggeree, conversation]
      properties:
        conversation:
          description: Chat web (étape 17) ; vide si le client ne l'a pas ouvert ou si Makor ne l'a pas ouvert à la banque
          oneOf:
            - $ref: '#/components/schemas/ConversationTicket'
            - type: 'null'
        attributionSuggeree:
          description: "Mode suggestion (étape 16) : l'agent proposé, pour le superviseur, tant que la réclamation n'est pas assignée"
          oneOf:
            - $ref: '#/components/schemas/AttributionSuggeree'
            - type: 'null'
        avis:
          description: Enquête de satisfaction ouverte à la clôture (étape 15) ; vide s'il n'y en a pas
          oneOf:
            - $ref: '#/components/schemas/AvisReclamation'
            - type: 'null'
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        description: { type: string }
        categorie: { $ref: '#/components/schemas/ReferenceNommee' }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        pointDepot:
          type: object
          required: [id, libelle]
          properties:
            id: { type: string, format: uuid }
            libelle: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        escaladeeVers:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        client:
          type: object
          required: [id, nom, email, telephone]
          properties:
            id: { type: string, format: uuid }
            nom: { type: string }
            email: { type: [string, 'null'] }
            telephone: { type: [string, 'null'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        sla: { $ref: '#/components/schemas/EtatSla' }
        jalons: { $ref: '#/components/schemas/Jalons' }
        cloture:
          oneOf:
            - $ref: '#/components/schemas/InfosCloture'
            - type: 'null'
        nbReouvertures: { type: integer, minimum: 0 }
        messages:
          type: array
          description: Notes internes comprises
          items: { $ref: '#/components/schemas/Message' }
        piecesJointes:
          type: array
          description: Fichiers du dépôt
          items: { $ref: '#/components/schemas/PieceJointe' }
        chronologie:
          type: array
          items: { $ref: '#/components/schemas/Evenement' }
        actionsPossibles:
          type: array
          description: Transitions permises à l'utilisateur connecté
          items: { $ref: '#/components/schemas/ActionStatut' }
        operationsPossibles:
          type: array
          description: Opérations permises à l'utilisateur connecté
          items: { $ref: '#/components/schemas/OperationTicket' }
    AvisReclamation:
      type: object
      required: [etat, ouverteLe, expireLe, reponse]
      properties:
        etat: { $ref: '#/components/schemas/EtatAvis' }
        ouverteLe: { $ref: '#/components/schemas/Horodatage' }
        expireLe: { $ref: '#/components/schemas/Horodatage' }
        reponse:
          oneOf:
            - $ref: '#/components/schemas/AvisDonne'
            - type: 'null'
    ReponseAuClient:
      type: object
      required: [contenu]
      properties:
        contenu: { type: string, minLength: 1, maxLength: 5000 }
        attendreReponse:
          type: boolean
          default: false
          description: Passe le ticket « En attente client » (question) et suspend le chrono SLA
        fichiers: { $ref: '#/components/schemas/Fichiers' }
    ReclamationEnConversation:
      type: object
      required: [id, numero, statut, priorite, categorie]
      properties:
        id: { type: string, format: uuid }
        numero: { type: string }
        statut: { $ref: '#/components/schemas/StatutReclamation' }
        priorite: { $ref: '#/components/schemas/Priorite' }
        categorie: { type: string }
    ConversationResume:
      type: object
      required: [id, canal, reclamation, client, agent, dernierMessage, aRepondre, nonLue, clientEnLigne]
      properties:
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        reclamation: { $ref: '#/components/schemas/ReclamationEnConversation' }
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        dernierMessage:
          type: object
          required: [extrait, auteur, date]
          properties:
            extrait: { type: string, maxLength: 140, description: "Sur une ligne, coupé au mot" }
            auteur: { type: string, enum: [BANQUE, CLIENT] }
            date: { $ref: '#/components/schemas/Horodatage' }
        aRepondre: { type: boolean, description: "Le client a écrit en dernier" }
        nonLue: { type: boolean, description: "Un message du client attend la lecture de la banque" }
        clientEnLigne: { type: boolean, description: "Le client avait le chat à l'écran il y a moins de 2 minutes" }
    PageConversations:
      type: object
      required: [donnees, pagination, compteurs]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/ConversationResume' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        compteurs:
          type: object
          description: Toutes pages confondues, dans le périmètre de l'appelant (pastille du menu)
          required: [aRepondre, nonLues]
          properties:
            aRepondre: { type: integer, minimum: 0 }
            nonLues: { type: integer, minimum: 0 }
    ConversationDetail:
      type: object
      required: [id, canal, reclamation, client, agent, description, deposeeLe, messages, aRepondre, nonLue, clientEnLigne,
        luParLeClientLe, operationsPossibles]
      properties:
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        reclamation: { $ref: '#/components/schemas/ReclamationEnConversation' }
        client:
          type: object
          required: [nom]
          properties:
            nom: { type: string }
        agent:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        description: { type: string, description: "Texte du dépôt, en tête du fil" }
        deposeeLe: { $ref: '#/components/schemas/Horodatage' }
        messages:
          type: array
          description: Réponses de la banque et messages du client, du plus ancien au plus récent (jamais une note interne)
          items: { $ref: '#/components/schemas/Message' }
        aRepondre: { type: boolean }
        nonLue: { type: boolean }
        clientEnLigne: { type: boolean }
        luParLeClientLe:
          $ref: '#/components/schemas/HorodatageFacultatif'
          description: Dernière lecture par le client (« Lu » sous les réponses de la banque)
        operationsPossibles:
          type: array
          description: REPONDRE_AU_CLIENT si l'appelant peut répondre d'ici
          items: { $ref: '#/components/schemas/OperationTicket' }
    ConversationTicket:
      type: object
      description: Conversation de la réclamation, sur sa fiche
      required: [id, canal, aRepondre, nonLue, clientEnLigne, luParLeClientLe]
      properties:
        id: { type: string, format: uuid }
        canal: { $ref: '#/components/schemas/CanalConversation' }
        aRepondre: { type: boolean }
        nonLue: { type: boolean }
        clientEnLigne: { type: boolean }
        luParLeClientLe: { $ref: '#/components/schemas/HorodatageFacultatif' }

    # ---- Tableau de bord ----------------------------------------------------------------
    Volume:
      type: object
      required: [cle, libelle, total]
      properties:
        cle: { type: string }
        libelle: { type: string }
        total: { type: integer, minimum: 0 }
    Indicateurs:
      type: object
      description: Définitions du §6.6 ; délais en minutes ouvrées
      required: [du, au, total, parStatut, parCategorie, parCanal, parAgence, delaiPremiereReponseMoyenMinutes,
        delaiResolutionMoyenMinutes, tauxRespectSla, tauxResolutionPremierContact, charge, evolution, satisfaction]
      properties:
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        total: { type: integer, minimum: 0 }
        parStatut:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parCategorie:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parCanal:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        parAgence:
          type: array
          items: { $ref: '#/components/schemas/Volume' }
        delaiPremiereReponseMoyenMinutes: { type: [number, 'null'] }
        delaiResolutionMoyenMinutes: { type: [number, 'null'] }
        tauxRespectSla: { type: [number, 'null'], minimum: 0, maximum: 1, description: "Part des réclamations résolues avant leur échéance" }
        tauxResolutionPremierContact: { type: [number, 'null'], minimum: 0, maximum: 1, description: "Sans attente client, sans escalade, sans réouverture" }
        charge: { $ref: '#/components/schemas/Charge' }
        evolution: { $ref: '#/components/schemas/Evolution' }
        satisfaction:
          description: Enquêtes de satisfaction (étape 15) ; vide si la banque ne les a pas activées et n'en a aucune sur la période
          oneOf:
            - $ref: '#/components/schemas/Satisfaction'
            - type: 'null'
    Satisfaction:
      type: object
      description: |
        Enquêtes ouvertes pendant la période (date de clôture), avec les mêmes filtres que les autres
        indicateurs. Satisfaits : notes 4 et 5 (CSAT). NPS : part des notes 9 et 10 moins part des notes
        0 à 6, de -100 à 100. Un agent ne voit que ses réclamations.
      required: [enquetes, reponses, tauxReponse, tauxSatisfaits, noteMoyenne, nps, promoteurs, passifs, detracteurs, parAgent, commentaires]
      properties:
        enquetes: { type: integer, minimum: 0, description: "Enquêtes ouvertes (réclamations clôturées par confirmation ou automatiquement)" }
        reponses: { type: integer, minimum: 0 }
        tauxReponse: { type: [number, 'null'], minimum: 0, maximum: 1 }
        tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1, description: "CSAT : part des notes 4 et 5" }
        noteMoyenne: { type: [number, 'null'], minimum: 1, maximum: 5 }
        nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
        promoteurs: { type: integer, minimum: 0, description: "Recommandation 9 ou 10" }
        passifs: { type: integer, minimum: 0, description: "Recommandation 7 ou 8" }
        detracteurs: { type: integer, minimum: 0, description: "Recommandation de 0 à 6" }
        parAgent:
          type: array
          description: Agents qui ont traité des réclamations ayant reçu une réponse, du plus grand nombre de réponses au plus petit
          items:
            type: object
            required: [cle, libelle, reponses, tauxSatisfaits, nps]
            properties:
              cle: { type: string }
              libelle: { type: string }
              reponses: { type: integer, minimum: 1 }
              tauxSatisfaits: { type: number, minimum: 0, maximum: 1 }
              nps: { type: integer, minimum: -100, maximum: 100 }
        commentaires:
          type: array
          maxItems: 10
          description: Les 10 derniers commentaires laissés par les clients
          items:
            type: object
            required: [reclamationId, numero, note, recommandation, commentaire, reponduLe]
            properties:
              reclamationId: { type: string, format: uuid }
              numero: { type: string }
              note: { type: integer, minimum: 1, maximum: 5 }
              recommandation: { type: integer, minimum: 0, maximum: 10 }
              commentaire: { type: string }
              reponduLe: { $ref: '#/components/schemas/Horodatage' }
    Charge:
      type: object
      description: |
        Réclamations non clôturées à cet instant, quelle que soit la période (étape 11) ; les autres
        filtres s'appliquent. En alerte : seuil d'alerte de la banque franchi, échéance pas encore
        passée. En retard : mêmes règles que la file « En retard ».
      required: [aTraiter, enAttenteClient, enAlerte, enRetard]
      properties:
        aTraiter: { type: integer, minimum: 0, description: "Ouvertes ou en cours" }
        enAttenteClient: { type: integer, minimum: 0 }
        enAlerte: { type: integer, minimum: 0 }
        enRetard: { type: integer, minimum: 0 }
    Regroupement:
      type: string
      description: Pas d'une série dans le temps, calculé dans le fuseau de la banque (semaine du lundi)
      enum: [JOUR, SEMAINE, MOIS]
    Evolution:
      type: object
      description: Courbe du tableau de bord (étape 9, décision E7 de l'étape 6)
      required: [regroupement, points]
      properties:
        regroupement: { $ref: '#/components/schemas/Regroupement' }
        points:
          type: array
          maxItems: 400
          items:
            type: object
            required: [debut, deposees, resolues]
            properties:
              debut: { $ref: '#/components/schemas/Horodatage' }
              deposees: { type: integer, minimum: 0, description: "Déposées pendant ce pas" }
              resolues: { type: integer, minimum: 0, description: "Résolues pendant ce pas (date de la dernière résolution), quelle que soit leur date de dépôt" }

    # ---- Notifications in-app --------------------------------------------------------------
    NotificationInApp:
      type: object
      required: [id, modele, sujet, contenu, reclamationId, creeLe, lueLe]
      properties:
        id: { type: string, format: uuid }
        modele: { type: string, examples: ['sla.alerte_preventive'] }
        sujet: { type: [string, 'null'] }
        contenu: { type: string }
        reclamationId: { type: [string, 'null'], format: uuid }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        lueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
    PageNotifications:
      type: object
      required: [donnees, pagination, nonLues]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/NotificationInApp' }
        pagination: { $ref: '#/components/schemas/Pagination' }
        nonLues: { type: integer, minimum: 0 }

    # ---- Paramétrage ----------------------------------------------------------------------
    ParametresBanque:
      type: object
      required: [nom, slug, prefixeTickets, fuseauHoraire, seuilAlerteSlaPourcent, delaiClotureAutoJours,
        smsChaqueChangementStatut, enqueteSatisfaction, attributionAutomatique, modeAttribution, chatWeb, couleurPrimaire, couleurSecondaire,
        logoUrl, emailContact, plan, consommation]
      properties:
        nom: { type: string }
        slug: { type: string }
        prefixeTickets: { type: string }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer, minimum: 1, maximum: 99 }
        delaiClotureAutoJours: { type: integer, minimum: 1, maximum: 60 }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean, description: "Enquête de satisfaction à la clôture (étape 15), activée par Makor" }
        attributionAutomatique: { type: boolean, description: "Attribution et escalade automatiques (étape 16), ouvertes par Makor" }
        modeAttribution: { $ref: '#/components/schemas/ModeAttribution' }
        chatWeb: { type: boolean, description: "Chat web du portail et boîte de réception (étape 17), ouverts par Makor" }
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
        logoUrl: { type: [string, 'null'], format: uri-reference }
        emailContact: { type: [string, 'null'], format: email }
        plan:
          type: object
          required: [nom, plafondAgents, plafondTicketsMois]
          properties:
            nom: { type: string }
            plafondAgents: { type: [integer, 'null'], description: "Vide = illimité" }
            plafondTicketsMois: { type: [integer, 'null'], description: "Vide = illimité" }
        consommation:
          type: object
          required: [agents, ticketsCeMois]
          properties:
            agents: { type: integer, description: "Agents et superviseurs non désactivés" }
            ticketsCeMois: { type: integer }
    ModificationApparence:
      type: object
      minProperties: 1
      properties:
        couleurPrimaire: { $ref: '#/components/schemas/Couleur' }
        couleurSecondaire: { $ref: '#/components/schemas/Couleur' }
        emailContact: { type: [string, 'null'], format: email, maxLength: 254 }
    Categorie:
      type: object
      required: [id, nom, description, prioriteParDefaut, delaiCibleMinutes, ordre, active]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        description: { type: [string, 'null'] }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, description: "Minutes ouvrées" }
        ordre: { type: integer }
        active: { type: boolean }
    EcritureCategorie:
      type: object
      required: [nom, delaiCibleMinutes]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, maximum: 525600 }
        ordre: { type: integer, default: 0 }
    ModificationCategorie:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'], maxLength: 1000 }
        prioriteParDefaut: { $ref: '#/components/schemas/Priorite' }
        delaiCibleMinutes: { type: integer, minimum: 1, maximum: 525600 }
        ordre: { type: integer }
        active: { type: boolean }
    Agence:
      type: object
      required: [id, code, nom, ville, adresse, active]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['AG01'] }
        nom: { type: string, examples: ['Plateau'] }
        ville: { type: [string, 'null'] }
        adresse: { type: [string, 'null'] }
        active: { type: boolean }
    EcritureAgence:
      type: object
      required: [code, nom]
      properties:
        code: { type: string, minLength: 1, maxLength: 20 }
        nom: { type: string, minLength: 2, maxLength: 160 }
        ville: { type: [string, 'null'], maxLength: 120 }
        adresse: { type: [string, 'null'], maxLength: 255 }
    ModificationAgence:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        ville: { type: [string, 'null'], maxLength: 120 }
        adresse: { type: [string, 'null'], maxLength: 255 }
        active: { type: boolean }
    PointDepot:
      type: object
      required: [id, code, canal, libelle, agence, actif, urlDepot]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['7K3QX9P2MA'] }
        canal: { $ref: '#/components/schemas/CanalDepot' }
        libelle: { type: string }
        agence:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        actif: { type: boolean }
        urlDepot: { type: string, format: uri, description: "Adresse encodée dans le QR code ou à placer sur le site" }
    EcriturePointDepot:
      type: object
      required: [canal, libelle]
      properties:
        canal: { $ref: '#/components/schemas/CanalDepot' }
        libelle: { type: string, minLength: 2, maxLength: 160 }
        agenceId: { type: [string, 'null'], format: uuid, description: "Obligatoire pour un QR code" }
    ModificationPointDepot:
      type: object
      minProperties: 1
      properties:
        libelle: { type: string, minLength: 2, maxLength: 160 }
        agenceId: { type: [string, 'null'], format: uuid }
        actif: { type: boolean }
    Plage:
      type: object
      required: [jourSemaine, debut, fin]
      properties:
        jourSemaine: { type: integer, minimum: 1, maximum: 7, description: "1 = lundi … 7 = dimanche" }
        debut: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', examples: ['08:00'] }
        fin: { type: string, pattern: '^(([01][0-9]|2[0-3]):[0-5][0-9]|24:00)$', examples: ['12:00'] }
    Horaires:
      type: object
      required: [fuseauHoraire, plages]
      properties:
        fuseauHoraire: { type: string, examples: ['Africa/Abidjan'] }
        plages:
          type: array
          items: { $ref: '#/components/schemas/Plage' }
    JourFerie:
      type: object
      required: [id, date, libelle, recurrent]
      properties:
        id: { type: string, format: uuid }
        date: { type: string, format: date, examples: ['2026-08-07'] }
        libelle: { type: string, examples: ["Fête de l'Indépendance"] }
        recurrent: { type: boolean, description: "Répété chaque année au même jour" }
    EcritureJourFerie:
      type: object
      required: [date, libelle]
      properties:
        date: { type: string, format: date }
        libelle: { type: string, minLength: 2, maxLength: 120 }
        recurrent: { type: boolean, default: false }

    # ---- Attribution et escalade automatiques (étape 16) ---------------------------------------
    ModeAttribution:
      type: string
      description: |
        MANUELLE : le superviseur assigne, comme en phase 1. SUGGESTION : l'API propose l'agent, le
        superviseur valide. AUTOMATIQUE : la réclamation part au dépôt vers l'agent proposé.
      enum: [MANUELLE, SUGGESTION, AUTOMATIQUE]
    SeuilEscalade:
      type: [integer, 'null']
      minimum: 101
      maximum: 1000
      description: "Pourcentage du délai cible (150 = la moitié du délai après l'échéance) ; vide = pas de seuil ici"
    ReglesTraitement:
      type: object
      required: [mode, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent, categories, agences]
      properties:
        mode: { $ref: '#/components/schemas/ModeAttribution' }
        seuilEscaladeAdminPourcent:
          $ref: '#/components/schemas/SeuilEscalade'
          description: Seuil d'escalade à l'Admin Entreprise de la banque, réclamations normales
        seuilEscaladeAdminUrgentPourcent:
          $ref: '#/components/schemas/SeuilEscalade'
          description: Seuil pour les réclamations urgentes ; vide = celui des normales
        categories:
          type: array
          description: Toutes les catégories, actives ou non, dans l'ordre d'affichage
          items:
            type: object
            required: [categorie, active, groupe, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent]
            properties:
              categorie: { $ref: '#/components/schemas/ReferenceNommee' }
              active: { type: boolean }
              groupe:
                oneOf:
                  - $ref: '#/components/schemas/ReferenceNommee'
                  - type: 'null'
              seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
              seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        agences:
          type: array
          description: Toutes les agences, par code
          items:
            type: object
            required: [agence, active, groupe]
            properties:
              agence: { $ref: '#/components/schemas/ReferenceNommee' }
              active: { type: boolean }
              groupe:
                oneOf:
                  - $ref: '#/components/schemas/ReferenceNommee'
                  - type: 'null'
    ModificationReglesTraitement:
      type: object
      minProperties: 1
      properties:
        mode: { $ref: '#/components/schemas/ModeAttribution' }
        seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        categories:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, groupeId, seuilEscaladeAdminPourcent, seuilEscaladeAdminUrgentPourcent]
            properties:
              id: { type: string, format: uuid }
              groupeId: { type: [string, 'null'], format: uuid }
              seuilEscaladeAdminPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
              seuilEscaladeAdminUrgentPourcent: { $ref: '#/components/schemas/SeuilEscalade' }
        agences:
          type: array
          maxItems: 500
          items:
            type: object
            required: [id, groupeId]
            properties:
              id: { type: string, format: uuid }
              groupeId: { type: [string, 'null'], format: uuid }
    MembreGroupe:
      type: object
      required: [id, nom, statut, absent, aTraiter]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, examples: ['Awa Koné'] }
        statut: { $ref: '#/components/schemas/StatutUtilisateur' }
        absent: { type: boolean, description: "Absence déclarée pour aujourd'hui" }
        aTraiter: { type: integer, minimum: 0, description: "Réclamations ouvertes ou en cours qui lui sont assignées (sa charge)" }
    GroupeAgents:
      type: object
      required: [id, nom, membres, categories, agences]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string, examples: ['Monétique'] }
        membres:
          type: array
          description: Agents du groupe, par nom
          items: { $ref: '#/components/schemas/MembreGroupe' }
        categories:
          type: array
          items: { $ref: '#/components/schemas/ReferenceNommee' }
        agences:
          type: array
          items: { $ref: '#/components/schemas/ReferenceNommee' }
    EcritureGroupe:
      type: object
      required: [nom, membres]
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        membres:
          type: array
          description: Agents de la banque (rôle Agent, compte non désactivé)
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    ModificationGroupe:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        membres:
          type: array
          maxItems: 200
          uniqueItems: true
          items: { type: string, format: uuid }
    Absence:
      type: object
      required: [id, agent, du, au, creeLe]
      properties:
        id: { type: string, format: uuid }
        agent: { $ref: '#/components/schemas/ReferenceNommee' }
        du: { type: string, format: date, description: "Premier jour d'absence" }
        au: { type: string, format: date, description: "Dernier jour d'absence (inclus)" }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
    NouvelleAbsence:
      type: object
      required: [agentId, du, au]
      properties:
        agentId: { type: string, format: uuid }
        du: { type: string, format: date }
        au: { type: string, format: date, description: "Au plus 366 jours après le premier jour, pas avant aujourd'hui" }
    AttributionSuggeree:
      type: object
      description: Agent qui recevrait la réclamation maintenant (mode suggestion)
      required: [agent, groupe]
      properties:
        agent: { $ref: '#/components/schemas/ReferenceNommee' }
        groupe: { $ref: '#/components/schemas/ReferenceNommee' }

    # ---- Personnel -------------------------------------------------------------------------
    Utilisateur:
      type: object
      required: [id, email, nom, prenom, telephone, role, statut, superviseur, totpActif, derniereConnexionLe, verrouilleJusquA]
      properties:
        id: { type: string, format: uuid }
        email: { type: string, format: email }
        nom: { type: string }
        prenom: { type: string }
        telephone: { type: [string, 'null'] }
        role: { $ref: '#/components/schemas/RoleUtilisateur' }
        statut: { $ref: '#/components/schemas/StatutUtilisateur' }
        superviseur:
          oneOf:
            - $ref: '#/components/schemas/ReferenceNommee'
            - type: 'null'
        totpActif: { type: boolean }
        derniereConnexionLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        verrouilleJusquA: { $ref: '#/components/schemas/HorodatageFacultatif' }
    PageUtilisateurs:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/Utilisateur' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    IdentitePersonne:
      type: object
      required: [email, nom, prenom]
      properties:
        email: { type: string, format: email, maxLength: 254 }
        nom: { type: string, minLength: 1, maxLength: 120 }
        prenom: { type: string, minLength: 1, maxLength: 120 }
        telephone: { type: [string, 'null'], maxLength: 25 }
    InvitationUtilisateur:
      allOf:
        - $ref: '#/components/schemas/IdentitePersonne'
        - type: object
          required: [role]
          properties:
            role: { $ref: '#/components/schemas/RoleBanque' }
            superviseurId: { type: [string, 'null'], format: uuid, description: "Équipe d'un agent" }
    ModificationUtilisateur:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 1, maxLength: 120 }
        prenom: { type: string, minLength: 1, maxLength: 120 }
        telephone: { type: [string, 'null'], maxLength: 25 }
        role: { $ref: '#/components/schemas/RoleBanque' }
        superviseurId: { type: [string, 'null'], format: uuid }

    # ---- Audit -------------------------------------------------------------------------------
    LigneAudit:
      type: object
      required: [id, chaine, rang, horodatage, acteur, action, entite, entiteId, donnees, ip]
      properties:
        id: { type: string, description: "Identifiant technique (entier)" }
        chaine: { type: string, examples: ['banque:0199…', 'plateforme'] }
        rang: { type: integer, minimum: 1 }
        horodatage: { $ref: '#/components/schemas/Horodatage' }
        acteur:
          type: object
          required: [type, id, libelle, role]
          properties:
            type: { $ref: '#/components/schemas/TypeActeur' }
            id: { type: [string, 'null'], format: uuid }
            libelle: { type: [string, 'null'], description: "Identité figée au moment de l'action (jamais le nom d'un client)" }
            role: { type: [string, 'null'] }
        action: { type: string, examples: ['reclamation.resolution'] }
        entite: { type: [string, 'null'] }
        entiteId: { type: [string, 'null'] }
        donnees: { type: [object, 'null'], additionalProperties: true, description: "Identifiants et statuts seulement" }
        ip: { type: [string, 'null'] }
    PageAudit:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/LigneAudit' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    VerificationChaine:
      type: object
      required: [chaine, valide, lignes, premiereRupture]
      properties:
        chaine: { type: string }
        valide: { type: boolean }
        lignes: { type: integer, minimum: 0 }
        premiereRupture: { type: [integer, 'null'], description: "Rang de la première ligne altérée ou manquante" }

    # ---- Plateforme ----------------------------------------------------------------------------
    Plan:
      type: object
      required: [id, code, nom, description, plafondAgents, plafondTicketsMois, actif]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, examples: ['ESSENTIEL'] }
        nom: { type: string }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1, description: "Vide = illimité ; bloque les invitations" }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1, description: "Vide = illimité ; jamais bloquant pour un dépôt" }
        actif: { type: boolean }
    EcriturePlan:
      type: object
      required: [code, nom]
      properties:
        code: { type: string, pattern: '^[A-Z0-9_]{2,40}$' }
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1 }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1 }
    ModificationPlan:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 120 }
        description: { type: [string, 'null'] }
        plafondAgents: { type: [integer, 'null'], minimum: 1 }
        plafondTicketsMois: { type: [integer, 'null'], minimum: 1 }
        actif: { type: boolean }
    BanquePlateforme:
      type: object
      required: [id, nom, slug, prefixeTickets, plan, fuseauHoraire, seuilAlerteSlaPourcent, delaiClotureAutoJours,
        smsChaqueChangementStatut, enqueteSatisfaction, attributionAutomatique, chatWeb, suspendueLe, motifSuspension, creeLe, consommation]
      properties:
        id: { type: string, format: uuid }
        nom: { type: string }
        slug: { type: string }
        prefixeTickets: { type: string }
        plan: { $ref: '#/components/schemas/ReferenceNommee' }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer }
        delaiClotureAutoJours: { type: integer }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean }
        attributionAutomatique: { type: boolean }
        chatWeb: { type: boolean }
        suspendueLe: { $ref: '#/components/schemas/HorodatageFacultatif' }
        motifSuspension: { type: [string, 'null'] }
        creeLe: { $ref: '#/components/schemas/Horodatage' }
        consommation:
          type: object
          required: [agents, ticketsCeMois]
          properties:
            agents: { type: integer }
            ticketsCeMois: { type: integer }
    PageBanques:
      type: object
      required: [donnees, pagination]
      properties:
        donnees:
          type: array
          items: { $ref: '#/components/schemas/BanquePlateforme' }
        pagination: { $ref: '#/components/schemas/Pagination' }
    CreationBanque:
      type: object
      required: [nom, slug, prefixeTickets, planId, administrateur]
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        slug: { type: string, pattern: '^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?$', description: "Adresse du portail" }
        prefixeTickets: { type: string, pattern: '^[A-Z0-9]{2,10}$' }
        planId: { type: string, format: uuid }
        fuseauHoraire: { type: string, default: Africa/Abidjan }
        administrateur: { $ref: '#/components/schemas/IdentitePersonne' }
    ModificationBanque:
      type: object
      minProperties: 1
      properties:
        nom: { type: string, minLength: 2, maxLength: 160 }
        planId: { type: string, format: uuid }
        fuseauHoraire: { type: string }
        seuilAlerteSlaPourcent: { type: integer, minimum: 1, maximum: 99 }
        delaiClotureAutoJours: { type: integer, minimum: 1, maximum: 60 }
        smsChaqueChangementStatut: { type: boolean }
        enqueteSatisfaction: { type: boolean, description: "Enquête de satisfaction à la clôture (étape 15)" }
        attributionAutomatique:
          type: boolean
          description: "Attribution et escalade automatiques (étape 16) ; fermer la fonction remet la banque en attribution manuelle"
        chatWeb:
          type: boolean
          description: "Chat web du portail et boîte de réception (étape 17) ; fermé, l'espace client garde son fil de messages simple"
    IndicateursPlateforme:
      type: object
      required: [du, au, banques]
      properties:
        du: { $ref: '#/components/schemas/Horodatage' }
        au: { $ref: '#/components/schemas/Horodatage' }
        banques:
          type: array
          items:
            type: object
            required: [banque, total, parStatut, urgentes, tauxRespectSla, tauxResolutionPremierContact, satisfaction]
            properties:
              satisfaction:
                description: Totaux des enquêtes de la période (étape 15), jamais les commentaires ; vide sans enquête
                oneOf:
                  - type: object
                    required: [enquetes, reponses, tauxSatisfaits, nps]
                    properties:
                      enquetes: { type: integer, minimum: 0 }
                      reponses: { type: integer, minimum: 0 }
                      tauxSatisfaits: { type: [number, 'null'], minimum: 0, maximum: 1 }
                      nps: { type: [integer, 'null'], minimum: -100, maximum: 100 }
                  - type: 'null'
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              total: { type: integer }
              parStatut:
                type: array
                items: { $ref: '#/components/schemas/Volume' }
              urgentes: { type: integer }
              tauxRespectSla: { type: [number, 'null'] }
              tauxResolutionPremierContact: { type: [number, 'null'] }
    FacturationSms:
      type: object
      required: [mois, banques]
      properties:
        mois: { type: string, examples: ['2026-09'] }
        banques:
          type: array
          items:
            type: object
            required: [banque, sms, segments, echecs]
            properties:
              banque: { $ref: '#/components/schemas/ReferenceNommee' }
              sms: { type: integer, description: "SMS envoyés" }
              segments: { type: integer, description: "Segments facturés par la passerelle" }
              echecs: { type: integer }
